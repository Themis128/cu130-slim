[project]
name = "social-automation-api"
version = "0.1.0"
description = "Social Media Automation Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "pydantic[email]==2.7.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "httpx==0.23.0",
    "redis==5.0.1",
    "celery==5.4.0",
    "python-dotenv==1.0.1",
    "cryptography==42.0.5",
    "httpx-oauth==0.11.0",
    "pgvector==0.2.3",
    "structlog==24.1.0",
    "aiofiles==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "ruff==0.4.3",
    "mypy==1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true