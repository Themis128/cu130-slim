[project]
name = "social-automation-api"
version = "0.1.0"
description = "Social Media Automation Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.130.0,<0.150.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.3.3,<3.0.0",
    "pydantic[email]>=2.9.0,<3.0.0",
    "PyJWT>=2.8.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0,<1.0.0",
    "redis>=5.0.1,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "python-dotenv>=1.2.2",
    "cryptography>=43.0.0",
    "msgpack>=1.2.1",
    "httpx-oauth==0.17.0",
    "pgvector==0.2.3",
    "structlog==24.1.0",
    "aiofiles==24.1.0",
    "slowapi>=0.1.9",
    # Security: pin jaraco.context to fix path traversal via tar archives (GHSA)
    "jaraco.context>=6.1.0",
    "Pillow>=10.4.0",
    # Extended image-format support for the media library viewer:
    # HEIC/HEIF (iPhone photos) and AVIF are re-encoded server-side by
    # /api/v1/media/view so every browser can display them.
    "pillow-heif>=0.13.0",
    "pillow-avif-plugin>=1.4.6",
    # Security: pin setuptools and wheel for vulnerability fixes
    "setuptools>=78.1.1",
    "wheel>=0.46.2",
    # Security: pin starlette to fix DoS/SSRF (CVE-2024-xxxx)
    "starlette>=0.52.2",
    # Used for robust emoji stripping in image rendering
    "emoji>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.4.3",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "F821",  # undefined-name: false positives from SQLAlchemy cross-model forward refs
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
explicit_package_bases = true
# SQLAlchemy Result.scalars().first() is poorly typed without the mypy plugin;
# attr-defined/arg-type noise dominates CI without blocking real bugs.
disable_error_code = ["no-any-return", "no-untyped-def", "var-annotated", "misc", "attr-defined", "arg-type", "assignment"]

[[tool.mypy.overrides]]
module = ["app.models.*"]
disable_error_code = ["name-defined"]

[[tool.mypy.overrides]]
# Third-party packages without complete typing support:
# - aiofiles: no inline types / stubs installed
# - numpy: ships PEP-695 `type` statement stubs incompatible with python_version 3.11 target
# - emoji: no type stubs installed
module = ["aiofiles.*", "numpy.*", "emoji.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]