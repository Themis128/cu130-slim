[project]
name = "social-automation-api"
version = "0.1.0"
description = "Social Media Automation Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "pydantic[email]==2.7.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "redis==5.0.1",
    "celery==5.4.0",
    "python-dotenv==1.0.1",
    "cryptography==42.0.5",
    "httpx-oauth==0.17.0",
    "pgvector==0.2.3",
    "structlog==24.1.0",
    "aiofiles==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.4.3",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "F821",  # undefined-name: false positives from SQLAlchemy cross-model forward refs
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
explicit_package_bases = true
disable_error_code = ["no-any-return", "no-untyped-def", "var-annotated", "misc"]

[[tool.mypy.overrides]]
module = ["app.models.*"]
disable_error_code = ["name-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:jose",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]