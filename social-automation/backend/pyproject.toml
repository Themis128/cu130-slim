[project]
name = "social-automation-api"
version = "0.1.0"
description = "Social Media Automation Platform API"
requires-python = ">=3.11"
dependencies = [
    # Security: starlette CVEs #697,#698,#699 fixed in starlette >=0.40.0,/1.1.0,1.3.1
    "fastapi>=0.140.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    # Security: required by fastapi>=0.140.0 (was 2.7.1)
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pydantic[email]>=2.9.0",
    # Security: #686 algorithm confusion fixed in python-jose 3.4.0
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]==1.7.4",
    # Security: #688,#689,#690,#691 fixed in python-multipart >=0.0.31
    "python-multipart>=0.0.31",
    "httpx==0.27.0",
    "redis==5.0.1",
    "celery==5.4.0",
    "python-dotenv==1.0.1",
    # Security: #671,#672,#673 (vulnerable OpenSSL, subgroup attack) fixed in cryptography>=46.0.5
    "cryptography>=46.0.5",
    "httpx-oauth==0.17.0",
    "pgvector==0.2.3",
    "structlog==24.1.0",
    "aiofiles==24.1.0",
    # Security: #678 Minerva timing attack — no upstream fix, but pinned to latest
    "ecdsa>=0.19.0",
    # Security: #679 path traversal via tar archives, fixed in jaraco.context 6.1.0
    "jaraco.context>=6.1.0",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.4.3",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools>=70.0.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "F821",  # undefined-name: false positives from SQLAlchemy cross-model forward refs
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
explicit_package_bases = true
disable_error_code = ["no-any-return", "no-untyped-def", "var-annotated", "misc"]

[[tool.mypy.overrides]]
module = ["app.models.*"]
disable_error_code = ["name-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:jose",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
