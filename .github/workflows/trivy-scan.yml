---
name: Trivy Security Scan

"on":
  push:
    branches: [master, main]
    paths:
      - 'social-automation/**'
      - 'env-manager/**'
      - 'docker-compose*.yml'
      - '.github/workflows/trivy-scan.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'social-automation/**'
      - 'env-manager/**'
      - 'docker-compose*.yml'
      - '.github/workflows/trivy-scan.yml'
  schedule:
    # Run daily at 3 AM UTC to catch new vulnerabilities
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to fail build'
        required: true
        default: 'HIGH'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW

env:
  # Trivy configuration
  TRIVY_VERSION: '0.58.1'
  TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db:2'
  TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db:1'

jobs:
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'  # Don't fail on fs scan, just report

      - name: Upload Trivy filesystem results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  trivy-images:
    name: Trivy Image Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - comfyui
          - env-manager-backend
          - env-manager-frontend
          - social-api
          - social-worker-publishing
          - social-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull pre-built ${{ matrix.service }} image
        run: |
          docker pull "baltzakist/cu130-slim-${{ matrix.service }}:latest"

      - name: Resolve image ref
        id: image
        run: |
          echo "ref=baltzakist/cu130-slim-${{ matrix.service }}:latest" >> "$GITHUB_OUTPUT"
          echo "Scanning image: baltzakist/cu130-slim-${{ matrix.service }}:latest"
          docker images

      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: true
          exit-code: '0'
          scanners: 'vuln'
          timeout: '900s'

      - name: Fail on CRITICAL vulnerabilities
        if: matrix.service != 'comfyui'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          scanners: 'vuln'
          timeout: '900s'

      - name: Report CRITICAL vulnerabilities for comfyui (non-blocking)
        if: matrix.service == 'comfyui'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '0'
          scanners: 'vuln'
          timeout: '900s'

      - name: Fail on CRITICAL and HIGH for core services
        if: matrix.service != 'comfyui'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          scanners: 'vuln'
          timeout: '900s'

      - name: Upload Trivy image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}-results.sarif'
          category: 'trivy-docker-image-${{ matrix.service }}'

  trivy-sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull pre-built ComfyUI image
        run: |
          docker pull baltzakist/cu130-slim-comfyui:latest

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'baltzakist/cu130-slim-comfyui:latest'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'
          scanners: 'vuln'
          timeout: '900s'

      - name: Generate SBOM in SPDX format
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'baltzakist/cu130-slim-comfyui:latest'
          format: 'spdx-json'
          output: 'sbom-spdx.json'
          scanners: 'vuln'
          timeout: '900s'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
          retention-days: 90

      - name: Attach SBOM to Docker image (if pushing to registry)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo "SBOM generated. To attach to registry, use:"
          echo "  oras attach ghcr.io/${{ github.repository }}/cu130-slim:${{ github.sha }} --artifact-type application/vnd.cncf.cyclonedx+json sbom-cyclonedx.json"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: 'high'