name: Auto-healers (watchdog / supervisor)

"on":
  pull_request:
    paths:
      - "scripts/compose-watchdog.sh"
      - "scripts/tests/**"
      - ".devin/skills/pending-triggers-ops/scripts/heal_supervisor.py"
      - ".github/workflows/healers.yml"
  push:
    branches: [master]
    paths:
      - "scripts/compose-watchdog.sh"
      - "scripts/tests/**"
      - ".devin/skills/pending-triggers-ops/scripts/heal_supervisor.py"
      - ".github/workflows/healers.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck -S warning scripts/compose-watchdog.sh
      - name: pytest
        run: |
          pip install pytest
          python -m pytest -q -p no:cacheprovider scripts/tests
