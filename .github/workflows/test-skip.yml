---
# Companion to social-automation-backend.yml, which is path-filtered and so can
# never report `test` on PRs that do not touch the backend. GitHub blocks a
# merge forever when a required check stays "Expected", so this mirror runs the
# same check name to a no-op success whenever the real workflow does not fire.
# Triggers are exact inverses: only one of the two workflows reports `test`.

name: Backend CI (paths skipped)

"on":
  pull_request:
    branches: [master]
    paths-ignore:
      - 'social-automation/backend/**'
      - '.github/workflows/social-automation-backend.yml'

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - run: echo "social-automation/backend unchanged — real 'test' job not triggered; required check satisfied."
