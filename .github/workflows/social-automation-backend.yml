name: Social Automation Backend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'social-automation/backend/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'social-automation/backend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('social-automation/backend/pyproject.toml', 'social-automation/backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd social-automation/backend
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          cd social-automation/backend
          ruff check .

      - name: Run type checking
        run: |
          cd social-automation/backend
          mypy app --ignore-missing-imports

      - name: Run tests
        run: |
          cd social-automation/backend
          pytest -v --tb=short --cov=app --cov-report=xml
        env:
          CI: "true"
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/social_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only
          ENCRYPTION_KEY: test-encryption-key-32-bytes-long!!
          JWT_SECRET_KEY: test-jwt-secret-key-for-testing-only

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Themis128/cu130-slim
          files: ./social-automation/backend/coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./social-automation/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/social-automation-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.58.1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/social-automation-api:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
