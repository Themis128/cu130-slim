---
name: Social Automation Backend CI

"on":
  push:
    branches: [master]
    paths:
      - 'social-automation/backend/**'
  pull_request:
    branches: [master]
    paths:
      - 'social-automation/backend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('social-automation/backend/pyproject.toml', 'social-automation/backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd social-automation/backend
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          cd social-automation/backend
          ruff check .

      - name: Run type checking
        run: |
          cd social-automation/backend
          mypy app --ignore-missing-imports

      - name: Run tests
        run: |
          cd social-automation/backend
          pytest -v --tb=short --cov=app --cov-report=xml
        env:
          CI: "true"
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/social_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only
          ENCRYPTION_KEY: test-encryption-key-32-bytes-long!!
          JWT_SECRET_KEY: test-jwt-secret-key-for-testing-only

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Themis128/cu130-slim
          files: ./social-automation/backend/coverage.xml

  # Build job removed - handled by docker-ci.yml matrix build
  # This avoids duplicate builds and ensures consistent image naming