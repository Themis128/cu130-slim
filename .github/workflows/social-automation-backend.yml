---
name: Social Automation Backend CI

"on":
  push:
    branches: [master]
    paths:
      - 'social-automation/backend/**'
      - '.github/workflows/social-automation-backend.yml'
  # Required-check note: pull_request must stay UNFILTERED -- the `test`
  # check is branch-protection-required, and a filtered trigger leaves it
  # "Expected" forever on unrelated PRs (see secret-scan.yml). Relevance is
  # gated inside the `changes` job instead.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: if the diff cannot be computed, assume relevant so the
          # real job runs -- a skipped gate must never silently turn green.
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD") || {
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if printf '%s\n' "$files" | grep -qE '^(social-automation/backend/|\.github/workflows/social-automation-backend\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('social-automation/backend/pyproject.toml', 'social-automation/backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd social-automation/backend
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          cd social-automation/backend
          ruff check .

      - name: Run type checking
        run: |
          cd social-automation/backend
          mypy app --ignore-missing-imports

      - name: Run worker linting
        run: |
          cd social-automation/backend
          ruff check app/worker

      - name: Run worker type checking
        run: |
          cd social-automation/backend
          mypy app/worker --ignore-missing-imports

      - name: Run tests
        run: |
          cd social-automation/backend
          # Unit suite only — integration tests live under tests/integration/
          # and are gated by Full Stack Integration Tests.
          # Coverage gates (2026-10 coverage push): lines >= 99.0% and
          # branches >= 95.3% of app/, checked separately because
          # --cov-fail-under only sees the blended line+branch number once
          # --cov-branch is on. Measured on the merge commit: lines 99.09%,
          # branches 95.39% — gates ratchet to the measured floor and go up
          # as coverage grows, never down. TODO: post-merge feature work
          # dropped ~0.5pt of line coverage; recover and raise the floor.
          pytest tests/unit -v --tb=short --cov=app --cov-branch \
            --cov-report=xml --cov-report=json:coverage.json \
            --cov-report=term-missing:skip-covered \
            -m "not integration"
          python scripts/check_coverage_gates.py coverage.json \
            --lines 99.0 --branches 95.3
        env:
          CI: "true"
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/social_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          JWT_SECRET_KEY: test-jwt-secret-key-for-testing-only

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Themis128/cu130-slim
          files: ./social-automation/backend/coverage.xml

  # Build job removed - handled by docker-ci.yml matrix build
  # This avoids duplicate builds and ensures consistent image naming
