---
name: Social Automation Backend CI

"on":
  push:
    branches: [master]
    paths:
      - 'social-automation/backend/**'
      - '.github/workflows/social-automation-backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'social-automation/backend/**'
      - '.github/workflows/social-automation-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('social-automation/backend/pyproject.toml', 'social-automation/backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd social-automation/backend
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          cd social-automation/backend
          ruff check .

      - name: Run type checking
        run: |
          cd social-automation/backend
          mypy app --ignore-missing-imports

      - name: Run tests
        run: |
          cd social-automation/backend
          pytest -v --tb=short --cov=app --cov-report=xml -m "not integration"
        env:
          CI: "true"
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/social_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          JWT_SECRET_KEY: test-jwt-secret-key-for-testing-only

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Themis128/cu130-slim
          files: ./social-automation/backend/coverage.xml

  # Build job removed - handled by docker-ci.yml matrix build
  # This avoids duplicate builds and ensures consistent image naming