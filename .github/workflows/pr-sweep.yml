name: pr-sweep

# Scheduled full PR sweep — superset of pr-watch: update-branch on BEHIND,
# arm squash auto-merge on every open PR, and API-only rebuild of DIRTY
# heads (pr_rebuild). Runs the repo's own skill scripts so logic stays
# in one place. Complements the WSL pr-sweep-cron.sh (survives WSL down).
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pr_sweep_all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .devin/skills/pr-sweep-ops/scripts/pr_sweep_all.py
