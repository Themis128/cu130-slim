---
name: Secret Scan

# Required branch-protection check — must run on EVERY PR with no path filter,
# or docs/config-only PRs get permanently blocked by the missing check.

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: >-
            ${{
              github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
              github.event_name == 'push' && github.event.before ||
              github.event_name == 'workflow_dispatch' && github.event.before ||
              ''
            }}
          head: ${{ github.sha }}
          # Unverified findings (entropy matches in binaries/models) previously
          # failed the job with exit 183. Only fail on verified secrets.
          extra_args: --only-verified --exclude-paths=.github/trufflehog-exclude.txt
