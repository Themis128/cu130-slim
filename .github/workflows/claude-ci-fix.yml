name: Claude CI auto-fix

# Self-healing CI: when a same-repo PR's workflow fails, Claude Code checks out
# the PR head branch, fixes the root cause, commits+pushes directly to it
# (auto-merge stays armed), and comments on the PR.
#
# Security notes:
# - workflow_run always executes the workflow definition from the DEFAULT
#   branch, so PR code cannot modify this workflow.
# - head_repository.full_name == github.repository excludes fork PRs.
# - draft PRs and claude-auto-fix-ci-* branches are excluded (loop guard).
# - PR_FIX_PAT (fine-grained-scoped user PAT) is used for checkout/pushes so
#   fix commits retrigger CI; GITHUB_TOKEN pushes would not.
# - The prompt caps automated fix attempts at 3 per branch via git log.

on:
  workflow_run:
    workflows:
      - "Social Automation Backend CI"
      - "Full Stack Integration Tests"
      - "Docker CI"
      - "Docker Compose Validation"
      - "Ruff Lint"
      - "Env Manager CI"
      - "Mail Worker CI"
      - "Social Automation Frontend CI"
      - "Security Scanning"
      - "Trivy Security Scan"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write
  id-token: write

jobs:
  auto-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.pull_requests[0].draft == false &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-ci-fix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.PR_FIX_PAT }}

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Get CI failure details
        id: failure_details
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            const failedJobs = jobs.data.jobs.filter(job => job.conclusion === 'failure');

            let errorLogs = [];
            for (const job of failedJobs.slice(0, 5)) {
              try {
                const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id
                });
                errorLogs.push({
                  jobName: job.name,
                  logs: typeof logs.data === 'string' ? logs.data.slice(-8000) : ''
                });
              } catch (e) {
                errorLogs.push({ jobName: job.name, logs: `log download failed: ${e.message}` });
              }
            }

            core.setOutput('result', JSON.stringify({
              runUrl: run.data.html_url,
              failedJobs: failedJobs.map(j => j.name),
              errorLogs: errorLogs
            }));

      - name: Fix CI failure with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.PR_FIX_PAT }}
        with:
          github_token: ${{ secrets.PR_FIX_PAT }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: "--allowedTools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(uv:*),Bash(uvx:*),Bash(ruff:*),Bash(alembic:*),Bash(pip:*),Bash(pip3:*),Bash(docker:*),Bash(ls:*),Bash(cat:*),Bash(cd:*),Bash(echo:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(find:*),Bash(fd:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sed:*),Bash(awk:*),Bash(jq:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(tar:*),Bash(unzip:*),Bash(zip:*),Bash(grep:*),Bash(curl:*),Bash(yq:*)'"
          prompt: |
            CI failed on a pull request in ${{ github.repository }}.

            Failed run: ${{ fromJSON(steps.failure_details.outputs.result).runUrl }}
            Failed jobs: ${{ join(fromJSON(steps.failure_details.outputs.result).failedJobs, ', ') }}
            PR number: ${{ github.event.workflow_run.pull_requests[0].number }}
            You are checked out on the PR head branch itself.

            Your job: find the root cause and push the fix DIRECTLY to this
            branch. Do NOT create a new branch, do NOT open a new PR — commits
            pushed here update the existing PR and its auto-merge stays armed.

            Rules:
            1. Read the error logs below and run `gh run view --log-failed`
               against the failed run id if you need more context.
            2. Reproduce the failure locally where feasible. Backend Python
               lives in social-automation/backend (pytest, ruff, alembic).
               The coverage gate is 99.0% line / 95.3% branch — if the failure
               is a coverage ratchet, write REAL tests for the uncovered lines
               using the existing mock/fixture patterns in tests/unit/.
            3. Fix the actual root cause. NEVER weaken tests, coverage
               thresholds, lint rules, security gates, or skip assertions to
               make CI pass.
            4. Attempt cap: run `git log --grep='claude-ci-fix' --oneline | wc -l`.
               If it is already >= 3, post a PR comment explaining the blocker
               and STOP without pushing.
            5. When green locally, commit with a message starting
               `claude-ci-fix:` and `git push origin HEAD`.
            6. Finish by commenting on the PR (gh pr comment) summarizing the
               root cause and what you changed.
            7. If the failure needs credentials, secrets, a product decision,
               or is an infrastructure flake, comment explaining that and stop
               — do not push speculative changes.

            Error logs:
            ${{ toJSON(fromJSON(steps.failure_details.outputs.result).errorLogs) }}
