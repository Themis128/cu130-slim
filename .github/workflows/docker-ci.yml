name: Docker CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: comfyui
            context: .
            dockerfile: Dockerfile
          - name: env-manager-backend
            context: env-manager/backend
            dockerfile: env-manager/backend/Dockerfile
          - name: env-manager-frontend
            context: env-manager/frontend
            dockerfile: env-manager/frontend/Dockerfile
          - name: social-api
            context: social-automation/backend
            dockerfile: social-automation/backend/Dockerfile
          - name: social-worker
            context: social-automation/backend
            dockerfile: social-automation/backend/Dockerfile.worker
          - name: social-frontend
            context: social-automation/frontend
            dockerfile: social-automation/frontend/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: |
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/master' ||
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service.name }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cu130-slim-${{ matrix.service.name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name == 'social-frontend' && 'social-frontend' || matrix.service.name == 'social-api' && 'social-api' || matrix.service.name == 'social-worker' && 'social-worker' || matrix.service.name == 'env-manager-backend' && 'env-manager-backend' || matrix.service.name == 'env-manager-frontend' && 'env-manager-frontend' || matrix.service.name == 'comfyui' && 'cu130-slim-comfyui' || format('cu130-slim-{0}', matrix.service.name) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v2.00,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve primary image tag
        id: image
        if: github.event_name == 'push'
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG="$(printf '%s\n' "$META_TAGS" | head -n1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag for scanning
        id: scan_image
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG="$(printf '%s\n' "$META_TAGS" | head -n1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Report high vulnerabilities for ${{ matrix.service.name }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan_image.outputs.tag }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH'
          scanners: 'vuln'
          timeout: '900s'

      - name: Scan ${{ matrix.service.name }} for critical vulnerabilities
        if: matrix.service.name != 'comfyui'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan_image.outputs.tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          scanners: 'vuln'
          timeout: '900s'

      - name: Scan comfyui for critical vulnerabilities (non-blocking)
        if: matrix.service.name == 'comfyui'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan_image.outputs.tag }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL'
          scanners: 'vuln'
          timeout: '900s'