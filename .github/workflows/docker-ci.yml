name: Docker CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        load: true
        tags: cu130-slim:ci

    - name: Report high vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: cu130-slim:ci
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'HIGH'

    - name: Scan image for critical vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: cu130-slim:ci
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL'

    - name: Tag image for Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: docker tag cu130-slim:ci ${{ secrets.DOCKERHUB_USERNAME }}/cu130-slim:latest

    - name: Push to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cu130-slim:latest
