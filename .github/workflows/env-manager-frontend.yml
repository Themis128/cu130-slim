name: Env Manager Frontend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'env-manager/frontend/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'env-manager/frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: env-manager/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('env-manager/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd env-manager/frontend
          npm ci

      - name: Run linting
        run: |
          cd env-manager/frontend
          npm run lint

      - name: Run type checking
        run: |
          cd env-manager/frontend
          npm run typecheck

      - name: Run tests
        run: |
          cd env-manager/frontend
          npm run test -- --run

      - name: Build
        run: |
          cd env-manager/frontend
          npm run build
