name: Security Scanning

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          path: ./
          base: >-
            ${{
              github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
              github.event_name == 'push' && github.event.before ||
              ''
            }}
          head: ${{ github.sha }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependency check
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: dependency-check-${{ hashFiles('.github/dependency-check-suppression.xml') }}
          restore-keys: |
            dependency-check-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@4.0.3
        with:
          project: 'cu130-slim'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --suppression .github/dependency-check-suppression.xml

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build social-api image
        run: docker compose --project-name cu130-slim --env-file .github/test.env build social-api

      - name: Scan images with Trivy
        uses: aquasecurity/trivy-action@v0.58.1
        with:
          scan-type: 'image'
          image-ref: 'cu130-slim_social-api:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  sast-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            social-automation/frontend/node_modules
            env-manager/frontend/node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('social-automation/frontend/package-lock.json', 'env-manager/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install frontend dependencies
        run: |
          cd social-automation/frontend
          npm ci
          cd ../../env-manager/frontend
          npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
