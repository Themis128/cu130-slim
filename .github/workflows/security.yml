---
name: Security Scanning

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Trivy configuration
  TRIVY_VERSION: '0.58.1'
  TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db:2'
  TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db:1'

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: >-
            ${{
              github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
              github.event_name == 'push' && github.event.before ||
              ''
            }}
          head: ${{ github.sha }}

  dependency-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache dependency check
        uses: actions/cache@v6
        with:
          path: ~/.dependency-check
          key: dependency-check-${{ hashFiles('.github/dependency-check-suppression.xml') }}
          restore-keys: |
            dependency-check-

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: 'cu130-slim'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: --failOnCVSS 7

      - name: Upload dependency check report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports/

  container-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - comfyui
          - env-manager-backend
          - env-manager-frontend
          - social-api
          - social-worker
          - social-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache "${{ matrix.service }}"

      - name: Resolve image ref
        id: image
        run: |
          REF=$(docker compose --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r ".services.\"${{ matrix.service }}\".image // empty")
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            # Compose project-name prefix for build-only services
            REF="cu130-slim-${{ matrix.service }}:latest"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Scanning image: $REF"
          docker images

      - name: Scan ${{ matrix.service }} with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: true
          ignore-policy: '.github/trivy-ignore.rego'
          timeout: '15m'
          exit-code: '0'
          scanners: 'vuln'

      - name: Fail on CRITICAL/HIGH for core services
        if: matrix.service != 'comfyui'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          scanners: 'vuln'

      - name: Upload ${{ matrix.service }} Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'


  sast-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript', 'typescript']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: |
            social-automation/frontend/node_modules
            env-manager/frontend/node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('social-automation/frontend/package-lock.json', 'env-manager/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install frontend dependencies
        run: |
          cd social-automation/frontend
          # legacy-peer-deps: lockfile resolved with vite 8 + plugin-react 4.x peer range
          npm ci --legacy-peer-deps
          cd ../../env-manager/frontend
          npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit env-manager backend
        run: |
          cd env-manager/backend
          pip-audit --desc -r requirements.txt

      - name: Audit social-automation backend
        run: |
          cd social-automation/backend
          pip install --upgrade "pip>=25.0" "wheel>=0.46.2" "setuptools>=78.1.1" "msgpack>=1.2.1" "jaraco.context>=6.1.0" "cryptography>=43.0.0"
          pip install -e .
          pip-audit --desc --local

  node-dependency-audit:
    name: Node.js dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit social-automation frontend
        run: |
          cd social-automation/frontend
          npm ci --legacy-peer-deps
          npm audit --audit-level=high

      - name: Audit env-manager frontend
        run: |
          cd env-manager/frontend
          npm ci
          npm audit --audit-level=high