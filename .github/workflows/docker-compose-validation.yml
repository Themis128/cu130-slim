---
name: Docker Compose Validation

"on":
  push:
    branches: [master]
    paths:
      - 'docker-compose*.yml'
      - '.github/workflows/docker-compose-validation.yml'
      - '.github/test.env'
      - '.env.example'
  pull_request:
    branches: [master]
    paths:
      - 'docker-compose*.yml'
      - '.github/workflows/docker-compose-validation.yml'
      - '.github/test.env'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose --env-file .github/test.env -f docker-compose.yml config > /dev/null && echo "docker-compose.yml is valid"

      - name: Check for required environment variables
        run: |
          python3 scripts/validate-compose-env.py

      - name: Check service definitions
        run: |
          echo "Services defined in docker-compose.yml:"
          docker compose --env-file .github/test.env config --services

      - name: Check for port conflicts
        run: |
          docker compose --env-file .github/test.env config --format json | python3 scripts/check-compose-ports.py

      - name: Validate pre-built image references
        run: |
          echo "Checking pre-built image references..."
          # All CI-built images use baltzakist/cu130-slim-{service}:<tag> with pull_policy: always.
          # CI auto-increments version tags (v2.{run_number}) and updates :latest.
          # Accept either :latest or a versioned :vN.N tag.
          expected_prefixes=(
            "baltzakist/cu130-slim-comfyui:"
            "baltzakist/cu130-slim-env-manager-backend:"
            "baltzakist/cu130-slim-env-manager-frontend:"
            "baltzakist/cu130-slim-social-api:"
            "baltzakist/cu130-slim-social-worker:"
            "baltzakist/cu130-slim-social-frontend:"
          )

          config_output=$(docker compose --env-file .github/test.env config --format json)

          for prefix in "${expected_prefixes[@]}"; do
            service_name=$(echo "$prefix" | sed 's|.*/cu130-slim-\(.*\):.*|\1|')
            if echo "$config_output" | jq -e --arg s "$service_name" '.services[$s]' > /dev/null 2>&1; then
              actual_image=$(echo "$config_output" | jq -r --arg s "$service_name" '.services[$s].image')
              if [[ "$actual_image" == ${prefix}* ]]; then
                echo "✅ $service_name uses correct image: $actual_image"
              else
                echo "❌ $service_name has incorrect image: $actual_image (expected prefix: ${prefix}*)"
                exit 1
              fi
            else
              echo "⚠️  Service $service_name not found in docker-compose.yml"
            fi
          done

          # Worker services share a single image but have different service names.
          for worker_service in social-worker-publishing social-worker-media social-worker-default; do
            if echo "$config_output" | jq -e --arg s "$worker_service" '.services[$s]' > /dev/null 2>&1; then
              actual_image=$(echo "$config_output" | jq -r --arg s "$worker_service" '.services[$s].image')
              if [[ "$actual_image" == baltzakist/cu130-slim-social-worker:* ]]; then
                echo "✅ $worker_service uses correct image: $actual_image"
              else
                echo "❌ $worker_service has incorrect image: $actual_image (expected prefix: baltzakist/cu130-slim-social-worker:*)"
                exit 1
              fi
            else
              echo "⚠️  Service $worker_service not found in docker-compose.yml"
            fi
          done

          # All CI-built services must have pull_policy: always.
          for service in comfyui env-manager-backend env-manager-frontend social-api social-worker-publishing social-worker-media social-worker-default social-frontend celery-beat; do
            if echo "$config_output" | jq -e --arg s "$service" '.services[$s].image' > /dev/null 2>&1; then
              pull_policy=$(echo "$config_output" | jq -r --arg s "$service" '.services[$s].pull_policy // "missing"')
              if [[ "$pull_policy" == "always" ]]; then
                echo "✅ $service has pull_policy: always"
              else
                echo "❌ $service has pull_policy: $pull_policy (expected: always)"
                exit 1
              fi
            fi
          done

          echo "✅ All pre-built image references validated"
