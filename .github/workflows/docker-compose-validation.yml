name: Docker Compose Validation

on:
  push:
    branches: [ master ]
    paths:
      - 'docker-compose*.yml'
      - '.github/workflows/docker-compose-validation.yml'
      - '.github/test.env'
  pull_request:
    branches: [ master ]
    paths:
      - 'docker-compose*.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose -f docker-compose.yml config > /dev/null && echo "docker-compose.yml is valid"

      - name: Check for required environment variables
        run: |
          if [ ! -f .env.example ]; then
            echo "WARNING: .env.example not found"
            echo "Required variables for docker-compose.yml:"
            grep -oE '\$\{[A-Z_]+' docker-compose.yml | sed 's/${//' | sort -u
          fi

      - name: Validate docker-compose with sample env
        run: |
          docker compose --env-file .github/test.env config > /dev/null
          echo "docker-compose.yml validates with test env"

      - name: Check service definitions
        run: |
          echo "Services defined in docker-compose.yml:"
          docker compose --env-file .github/test.env config --services

      - name: Check for port conflicts
        run: |
          echo "Port mappings:"
          docker compose --env-file .github/test.env config | grep -A2 "ports:" | head -30
