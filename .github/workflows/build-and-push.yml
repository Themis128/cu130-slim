name: Build and push images
# Single GHCR package: ghcr.io/themis128/cu130-slim
# Tags: <service>-latest and <service>-sha-<7-char-sha>
#
# docker-compose.yml consumes the moving <service>-latest tags (pull_policy: always).
# Immutable <service>-sha-<sha> tags remain on GHCR for manual rollbacks.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # No paths: filter — code-only pushes must produce images too (the live
    # stack runs baked images, pull_policy: never). The `detect` job below
    # maps changed paths → the services that consume them and builds just
    # those; an empty matrix skips the build jobs entirely.

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected services
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.s.outputs.services }}
      comfyui: ${{ steps.s.outputs.comfyui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Deep enough that the last non-cancelled run's sha resolves for
          # the diff base even through long merge storms.
          fetch-depth: 100

      - name: Map changed paths to services
        id: s
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ALL='["social-api","social-worker-publishing","social-sidecar-base","env-manager-backend","env-manager-frontend","social-frontend","cloudflared"]'
          S="[]"; C="false"
          add() {
            case "$S" in *"\"$1\""*) return ;; esac
            if [ "$S" = "[]" ]; then S="[\"$1\"]"; else S="${S%]},\"$1\"]"; fi
          }

          if [ "$EVENT" != "push" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            S="$ALL"; C="true"
          else
            # cancel-in-progress means an earlier push's run may have been
            # cancelled or failed mid-build — a before..sha diff would never
            # ship its changes. Diff from the last SUCCESSFUL run's sha so
            # cancelled/failed pushes fold into this run's build set.
            BASE="$BEFORE"
            LAST_OK=$(curl -sf \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/build-and-push.yml/runs?branch=${{ github.ref_name }}&per_page=10" \
              | python3 -c "import json,sys; runs=json.load(sys.stdin)['workflow_runs']; print(next((r['head_sha'] for r in runs if r['head_sha'] != '$SHA' and r.get('conclusion') == 'success'), ''))" 2>/dev/null || true)
            if [ -n "$LAST_OK" ] && git rev-parse --verify "$LAST_OK^{commit}" >/dev/null 2>&1; then
              BASE="$LAST_OK"
              echo "diff base: last successful run sha $BASE"
            fi
            if ! CHANGED=$(git diff --name-only "$BASE" "$SHA" 2>/dev/null); then
              echo "diff failed (shallow history?) — building all"; S="$ALL"; C="true"
            else
            echo "changed files:"; echo "$CHANGED"
            # Dep/toolchain files can touch any image — rebuild everything.
            grep -qE 'requirements[^/]*\.txt|pyproject\.toml|\.github/workflows/build-and-push\.yml' <<<"$CHANGED" \
              && { S="$ALL"; C="true"; }
            grep -qE '^social-automation/backend/' <<<"$CHANGED" \
              && { add social-api; add social-worker-publishing; }
            grep -qE '^social-automation/frontend/' <<<"$CHANGED" \
              && add social-frontend
            # docker/ holds Dockerfile.sidecar-base; env-manager-backend
            # FROMs it — rebuild both (ordering race bounded by next build).
            grep -qE '^docker/' <<<"$CHANGED" \
              && { add social-sidecar-base; add env-manager-backend; }
            grep -qE '^env-manager/backend/' <<<"$CHANGED" && add env-manager-backend
            grep -qE '^env-manager/frontend/' <<<"$CHANGED" && add env-manager-frontend
            grep -qE '^social-automation/Dockerfile\.cloudflared|^cloudflared/' <<<"$CHANGED" \
              && add cloudflared
            grep -qE '^Dockerfile$|^comfyui/' <<<"$CHANGED" && C="true"
            fi
          fi
          echo "services=$S" >> "$GITHUB_OUTPUT"
          echo "comfyui=$C" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: detect
    # An empty service set (e.g. a docs- or root-scripts-only merge) must be
    # a clean skip — an empty matrix errors the whole workflow at eval time.
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Authenticated docker.io pulls (login-action below) — mirror.gcr.io
      # rate-limits (429) under shared-runner load; the plain docker.io refs
      # resolve via the Docker Hub login and have far higher limits.
      PYTHON_BASE_IMAGE: python:3.11-slim
      NODE_BASE_IMAGE: node:22-alpine
      NGINX_BASE_IMAGE: nginx:alpine
      ALPINE_BASE_IMAGE: alpine:3.20
    strategy:
      fail-fast: false
      matrix:
        # detect emits only the services whose source paths changed;
        # workflow_dispatch emits the full set. Backend builds twice with
        # shared base layers: social-api → slim `social-backend-api` (core
        # deps), social-worker-publishing → full `social-backend` (worker
        # extra). Legacy aliases publish alongside.
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # env-manager-backend FROMs the shared sidecar base — build+push it
      # first when missing (first run after the split; idempotent after).
      - name: Ensure shared sidecar base exists
        if: matrix.service == 'env-manager-backend'
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER}/cu130-slim:social-sidecar-base-latest"
          if ! docker manifest inspect "$BASE" >/dev/null 2>&1; then
            echo "sidecar base missing — building+pushing $BASE"
            docker buildx build --push \
              -f docker/Dockerfile.sidecar-base \
              --build-arg "PYTHON_IMAGE=${PYTHON_BASE_IMAGE}" \
              -t "$BASE" docker/
          else
            echo "sidecar base present"
          fi

      - name: Derive short sha tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "package=ghcr.io/${OWNER}/cu130-slim" >> "$GITHUB_OUTPUT"

      - name: Build service
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache ${{ matrix.service }}

      - name: Resolve built image reference
        id: image
        run: |
          # Profile-gated services (["dev"], ["build-only"]) vanish from
          # `config` output unless their profiles are enabled — the bare
          # query misses them and the fallback guesses "<svc>-latest", which
          # does NOT match the compose `image:` name for social-api
          # (social-backend-api-latest) / social-worker-publishing
          # (social-backend-latest), so `docker tag` then fails.
          REF=$(docker compose --profile dev --profile build-only \
            --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r '.services["${{ matrix.service }}"].image // empty')
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            REF="${{ steps.meta.outputs.package }}:${{ matrix.service }}-latest"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Tag and push to single package
        run: |
          set -euo pipefail
          BUILT="${{ steps.image.outputs.ref }}"
          PACKAGE="${{ steps.meta.outputs.package }}"
          SVC="${{ matrix.service }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          docker tag "$BUILT" "${PACKAGE}:${SVC}-latest"
          docker tag "$BUILT" "${PACKAGE}:${SVC}-${SHA_TAG}"
          docker push "${PACKAGE}:${SVC}-latest"
          docker push "${PACKAGE}:${SVC}-${SHA_TAG}"
          echo "Pushed ${PACKAGE}:${SVC}-latest and ${PACKAGE}:${SVC}-${SHA_TAG}"
          # The api build produces the slim image; publish it under the
          # canonical social-backend-api tag plus the legacy social-api alias.
          if [ "$SVC" = "social-api" ]; then
            for TAG in social-backend-api-latest social-api-latest; do
              docker tag "$BUILT" "${PACKAGE}:${TAG}"
              docker push "${PACKAGE}:${TAG}"
            done
            docker tag "$BUILT" "${PACKAGE}:social-backend-api-${SHA_TAG}"
            docker push "${PACKAGE}:social-backend-api-${SHA_TAG}"
            echo "Also pushed social-backend-api-latest + social-api-latest"
          fi
          # The worker build produces the full image; publish the canonical
          # social-backend tag plus the legacy social-worker-* aliases.
          if [ "$SVC" = "social-worker-publishing" ]; then
            for TAG in social-backend-latest social-worker-latest social-worker-publishing-latest; do
              docker tag "$BUILT" "${PACKAGE}:${TAG}"
              docker push "${PACKAGE}:${TAG}"
            done
            docker tag "$BUILT" "${PACKAGE}:social-backend-${SHA_TAG}"
            docker push "${PACKAGE}:social-backend-${SHA_TAG}"
            echo "Also pushed social-backend-latest + worker aliases"
          fi

  build-and-push-comfyui:
    name: Build and push ComfyUI
    needs: detect
    if: needs.detect.outputs.comfyui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx \
            /opt/hostedtoolcache /usr/share/swift /usr/local/lib/node_modules \
            /usr/local/.ghcup /opt/az /usr/lib/jvm /opt/microsoft 2>/dev/null || true
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short sha tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "package=ghcr.io/${OWNER}/cu130-slim" >> "$GITHUB_OUTPUT"

      - name: Build ComfyUI
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache comfyui

      - name: Resolve built image reference
        id: image
        run: |
          REF=$(docker compose --profile dev --profile build-only \
            --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r '.services.comfyui.image // empty')
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            REF="${{ steps.meta.outputs.package }}:comfyui-latest"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Tag and push to single package
        run: |
          set -euo pipefail
          BUILT="${{ steps.image.outputs.ref }}"
          PACKAGE="${{ steps.meta.outputs.package }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          docker tag "$BUILT" "${PACKAGE}:comfyui-latest"
          docker tag "$BUILT" "${PACKAGE}:comfyui-${SHA_TAG}"
          docker push "${PACKAGE}:comfyui-latest"
          docker push "${PACKAGE}:comfyui-${SHA_TAG}"
          echo "Pushed ${PACKAGE}:comfyui-latest and ${PACKAGE}:comfyui-${SHA_TAG}"
