name: Build and push images
# Pushes to ghcr.io/themis128/* (public option). Make packages public in GitHub UI if anonymous pulls are required.
#
# After a successful build, tags each image as :latest and :sha-<7-char-sha>,
# then opens a PR that rewrites docker-compose.yml pins to the new sha tags.
# docker-compose.yml is intentionally NOT in the push path filters so those
# bot PRs do not retrigger a full rebuild loop.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/Dockerfile*"
      - ".github/workflows/build-and-push.yml"

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        service:
          - social-api
          - social-worker-publishing
          - env-manager-backend
          - env-manager-frontend
          - social-frontend
          - cloudflared
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short sha tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build service
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache ${{ matrix.service }}

      - name: Resolve image reference
        id: image
        run: |
          REF=$(docker compose --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r '.services["${{ matrix.service }}"].image // empty')
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REF="ghcr.io/${OWNER}/cu130-slim-${{ matrix.service }}:latest"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "repo=${REF%:*}" >> "$GITHUB_OUTPUT"

      - name: Tag and push latest + sha
        run: |
          BUILT="${{ steps.image.outputs.ref }}"
          REPO="${{ steps.image.outputs.repo }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          docker tag "$BUILT" "${REPO}:latest"
          docker tag "$BUILT" "${REPO}:${SHA_TAG}"
          docker push "${REPO}:latest"
          docker push "${REPO}:${SHA_TAG}"
          echo "Pushed ${REPO}:latest and ${REPO}:${SHA_TAG}"

  build-and-push-comfyui:
    name: Build and push ComfyUI
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx \
            /opt/hostedtoolcache /usr/share/swift /usr/local/lib/node_modules \
            /usr/local/.ghcup /opt/az /usr/lib/jvm /opt/microsoft 2>/dev/null || true
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short sha tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build ComfyUI
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache comfyui

      - name: Resolve image reference
        id: image
        run: |
          REF=$(docker compose --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r '.services.comfyui.image // empty')
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REF="ghcr.io/${OWNER}/cu130-slim-comfyui:latest"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "repo=${REF%:*}" >> "$GITHUB_OUTPUT"

      - name: Tag and push latest + sha
        run: |
          BUILT="${{ steps.image.outputs.ref }}"
          REPO="${{ steps.image.outputs.repo }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          docker tag "$BUILT" "${REPO}:latest"
          docker tag "$BUILT" "${REPO}:${SHA_TAG}"
          docker push "${REPO}:latest"
          docker push "${REPO}:${SHA_TAG}"
          echo "Pushed ${REPO}:latest and ${REPO}:${SHA_TAG}"

  update-compose:
    name: Update compose image pins
    needs: [build-and-push, build-and-push-comfyui]
    if: ${{ always() && needs.build-and-push.result == 'success' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short sha tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=chore/compose-image-sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Rewrite compose pins
        run: |
          chmod +x scripts/update-compose-image-tags.sh
          ./scripts/update-compose-image-tags.sh "${{ steps.meta.outputs.sha_tag }}" docker-compose.yml
          grep -n 'ghcr.io/themis128/cu130-slim' docker-compose.yml

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- docker-compose.yml; then
            echo "compose already pinned to ${SHA_TAG}; nothing to do"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git add docker-compose.yml
          git commit -m "chore(compose): point images at ${SHA_TAG}"
          git push -u origin "$BRANCH" --force-with-lease

          EXISTING=$(gh pr list --head "$BRANCH" --base master --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already exists for ${BRANCH}"
            gh pr view "$EXISTING" --json url --jq .url
            exit 0
          fi

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          ## Summary
          Auto-update from **Build and push images**.

          - Pins all \`ghcr.io/themis128/cu130-slim-*\` app images in \`docker-compose.yml\` to \`${SHA_TAG}\`
          - Matching images were also pushed as \`:latest\`
          - Third-party images (n8n, postgres, etc.) are unchanged

          ## Loop prevention
          \`docker-compose.yml\` is not in the rebuild path filters, so merging this PR does not retrigger a full image rebuild.

          ## Test plan
          - [ ] CI validate + secret-scan pass
          - [ ] Confirm GHCR packages expose \`${SHA_TAG}\` (and make packages public if needed)
          - [ ] After merge: \`docker compose pull\` for app services
          EOF
          gh pr create --base master --head "$BRANCH" \
            --title "chore(compose): point images at ${SHA_TAG}" \
            --body-file "$BODY_FILE"

