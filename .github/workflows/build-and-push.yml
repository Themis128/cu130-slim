name: Build and push images
# Single GHCR package: ghcr.io/themis128/cu130-slim
# Tags: <service>-latest and <service>-sha-<7-char-sha>
#
# docker-compose.yml consumes the moving <service>-latest tags (pull_policy: always).
# Immutable <service>-sha-<sha> tags remain on GHCR for manual rollbacks.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/Dockerfile*"
      - ".github/workflows/build-and-push.yml"

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        service:
          - social-api
          - social-worker-publishing
          - env-manager-backend
          - env-manager-frontend
          - social-frontend
          - cloudflared
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short sha tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "package=ghcr.io/${OWNER}/cu130-slim" >> "$GITHUB_OUTPUT"

      - name: Build service
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache ${{ matrix.service }}

      - name: Resolve built image reference
        id: image
        run: |
          REF=$(docker compose --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r '.services["${{ matrix.service }}"].image // empty')
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            REF="${{ steps.meta.outputs.package }}:${{ matrix.service }}-latest"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Tag and push to single package
        run: |
          set -euo pipefail
          BUILT="${{ steps.image.outputs.ref }}"
          PACKAGE="${{ steps.meta.outputs.package }}"
          SVC="${{ matrix.service }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          docker tag "$BUILT" "${PACKAGE}:${SVC}-latest"
          docker tag "$BUILT" "${PACKAGE}:${SVC}-${SHA_TAG}"
          docker push "${PACKAGE}:${SVC}-latest"
          docker push "${PACKAGE}:${SVC}-${SHA_TAG}"
          echo "Pushed ${PACKAGE}:${SVC}-latest and ${PACKAGE}:${SVC}-${SHA_TAG}"
          # Worker matrix builds Dockerfile.worker; also publish shared social-worker-* tags
          # so media/default/messenger/celery-beat compose refs keep working.
          if [ "$SVC" = "social-worker-publishing" ]; then
            docker tag "$BUILT" "${PACKAGE}:social-worker-latest"
            docker tag "$BUILT" "${PACKAGE}:social-worker-${SHA_TAG}"
            docker push "${PACKAGE}:social-worker-latest"
            docker push "${PACKAGE}:social-worker-${SHA_TAG}"
            echo "Also pushed ${PACKAGE}:social-worker-latest and ${PACKAGE}:social-worker-${SHA_TAG}"
          fi

  build-and-push-comfyui:
    name: Build and push ComfyUI
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx \
            /opt/hostedtoolcache /usr/share/swift /usr/local/lib/node_modules \
            /usr/local/.ghcup /opt/az /usr/lib/jvm /opt/microsoft 2>/dev/null || true
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short sha tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "package=ghcr.io/${OWNER}/cu130-slim" >> "$GITHUB_OUTPUT"

      - name: Build ComfyUI
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache comfyui

      - name: Resolve built image reference
        id: image
        run: |
          REF=$(docker compose --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r '.services.comfyui.image // empty')
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            REF="${{ steps.meta.outputs.package }}:comfyui-latest"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Tag and push to single package
        run: |
          set -euo pipefail
          BUILT="${{ steps.image.outputs.ref }}"
          PACKAGE="${{ steps.meta.outputs.package }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          docker tag "$BUILT" "${PACKAGE}:comfyui-latest"
          docker tag "$BUILT" "${PACKAGE}:comfyui-${SHA_TAG}"
          docker push "${PACKAGE}:comfyui-latest"
          docker push "${PACKAGE}:comfyui-${SHA_TAG}"
          echo "Pushed ${PACKAGE}:comfyui-latest and ${PACKAGE}:comfyui-${SHA_TAG}"
