name: Build and push images

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/Dockerfile*"
      - "docker-compose.yml"
      - ".github/workflows/build-and-push.yml"

permissions:
  contents: read
  packages: read

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        service:
          - social-api
          - social-worker
          - env-manager-backend
          - env-manager-frontend
          - social-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build service
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache ${{ matrix.service }}

      - name: Resolve image reference
        id: image
        run: |
          REF=$(docker compose --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r '.services.${{ matrix.service }}.image // empty')
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            REF="baltzakist/cu130-slim-${{ matrix.service }}:latest"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Push image
        run: |
          docker push ${{ steps.image.outputs.ref }}

  build-and-push-comfyui:
    name: Build and push ComfyUI
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ComfyUI
        run: |
          docker compose --project-name cu130-slim --env-file .github/test.env build --no-cache comfyui

      - name: Resolve image reference
        id: image
        run: |
          REF=$(docker compose --project-name cu130-slim --env-file .github/test.env config --format json \
            | jq -r '.services.comfyui.image // empty')
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            REF="baltzakist/cu130-slim-comfyui:2.2.0"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Push ComfyUI image
        run: |
          docker push ${{ steps.image.outputs.ref }}
