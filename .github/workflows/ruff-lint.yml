---
# Always-on ruff gate. The service workflows (social-automation-backend.yml,
# env-manager-frontend.yml) run ruff too, but this job reports `ruff` on
# EVERY PR so branch protection can require it -- the I001 regressions fixed
# in #1240/#1250/#1254 all landed because no required check ran ruff.

name: Ruff Lint

"on":
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      # Each dir is linted with the ruff version its own manifest pins, so a
      # required check never disagrees with what a dev runs locally:
      #   social-automation/backend  -> pyproject dev dep ruff==0.4.3
      #   env-manager/backend        -> no config/pin; canonical repo pin 0.4.3
      #   slack-apps/socialauto-digest -> requirements.txt ruff==0.16.0
      - name: Run ruff (all lint dirs, report every failure)
        run: |
          status=0
          pip install -q "ruff==0.4.3"
          (cd social-automation/backend && ruff check .) || status=1
          (cd env-manager/backend && ruff check .) || status=1
          pip install -q "ruff==0.16.0"
          (cd slack-apps/socialauto-digest && ruff check .) || status=1
          exit $status
