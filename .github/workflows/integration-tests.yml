name: Full Stack Integration Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: |
            env-manager/frontend/node_modules
            social-automation/frontend/node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('env-manager/frontend/package-lock.json', 'social-automation/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - name: Install backend dependencies
        run: |
          cd social-automation/backend
          pip install -e ".[dev]"

      - name: Run database migrations
        run: |
          cd social-automation/backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/social_test

      - name: Start backend server
        run: |
          cd social-automation/backend
          uvicorn app.main:app --host 0.0.0.0 --port 8083 &
          sleep 10
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/social_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only
          ENCRYPTION_KEY: test-encryption-key-32-bytes-long!!
          JWT_SECRET_KEY: test-jwt-secret-key-for-testing-only
          DEBUG: "true"

      - name: Test backend health endpoint
        run: |
          curl -f http://localhost:8083/health || exit 1

      - name: Test backend API endpoints
        run: |
          # Test auth endpoints
          curl -X POST http://localhost:8083/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email": "test@example.com", "password": "testpass123", "name": "Test User"}' \
            -f

      - name: Install frontend dependencies
        if: ${{ hashFiles('env-manager/frontend/package.json') != '' }}
        run: |
          cd env-manager/frontend
          npm ci

      - name: Build frontend
        if: ${{ hashFiles('env-manager/frontend/package.json') != '' }}
        run: |
          cd env-manager/frontend
          npm run build

      - name: Run integration tests
        run: |
          cd social-automation/backend
          pytest tests/integration -v --tb=short || echo "Integration tests not yet implemented"
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/social_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only
          ENCRYPTION_KEY: test-encryption-key-32-bytes-long!!
          JWT_SECRET_KEY: test-jwt-secret-key-for-testing-only
