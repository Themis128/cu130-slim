---
name: Full Stack Integration Tests

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/social_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-testing-only
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      JWT_SECRET_KEY: test-jwt-secret-key-for-testing-only
      UPLOAD_DIR: /tmp/uploads
      DEBUG: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: |
            env-manager/frontend/node_modules
            social-automation/frontend/node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('env-manager/frontend/package-lock.json', 'social-automation/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-${{ hashFiles('env-manager/frontend/package-lock.json') }}-
            ${{ runner.os }}-node22-${{ hashFiles('social-automation/frontend/package-lock.json') }}-
            ${{ runner.os }}-node22-

      - name: Install backend dependencies
        run: |
          cd social-automation/backend
          pip install -e ".[dev]"

      - name: Create uploads directory
        run: mkdir -p $UPLOAD_DIR

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... (attempt $i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Wait for Redis to be ready
        run: |
          # NOTE: redis-cli is not preinstalled on hosted runners — use a raw TCP check.
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/6379) > /dev/null 2>&1; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... (attempt $i/30)"
            sleep 2
          done
          echo "Redis did not become ready in time"
          exit 1

      - name: Run database migrations
        run: |
          cd social-automation/backend
          alembic upgrade head

      - name: Start backend server
        run: |
          cd social-automation/backend
          uvicorn app.main:app --host 0.0.0.0 --port 8083 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/uvicorn.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8083/health > /dev/null; then
              echo "Backend is ready after ${attempt} attempt(s)"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/uvicorn.pid" 2>/dev/null)" 2>/dev/null; then
              echo "Backend exited before becoming ready" >&2
              cat "$RUNNER_TEMP/uvicorn.log"
              exit 1
            fi
            sleep 1
          done
          echo "Backend did not become ready within 60 seconds" >&2
          cat "$RUNNER_TEMP/uvicorn.log"
          exit 1

      - name: Test backend health endpoint
        run: |
          curl -f http://localhost:8083/health || exit 1

      - name: Dump backend server log on failure
        if: ${{ failure() }}
        run: |
          if [ -f "$RUNNER_TEMP/uvicorn.log" ]; then
            cat "$RUNNER_TEMP/uvicorn.log"
          fi

      - name: Test backend API endpoints
        run: |
          # Test auth endpoints
          curl -X POST http://localhost:8083/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email": "test@example.com", "password": "testpass123", "name": "Test User"}' \
            -f || echo "Auth register test failed (may be expected if user exists)"

      - name: Install env-manager frontend dependencies
        run: |
          cd env-manager/frontend
          npm ci

      - name: Build env-manager frontend
        run: |
          cd env-manager/frontend
          npm run build

      - name: Test env-manager frontend
        continue-on-error: true
        run: |
          cd env-manager/frontend
          npm run test

      - name: Install social-automation frontend dependencies
        run: |
          cd social-automation/frontend
          # legacy-peer-deps: lockfile resolved with vite 8 + plugin-react 4.x peer range
          npm ci --legacy-peer-deps

      - name: Run social-automation frontend linting
        run: |
          cd social-automation/frontend
          npm run lint

      - name: Run social-automation frontend type checking
        run: |
          cd social-automation/frontend
          npm run typecheck

      - name: Test social-automation frontend
        continue-on-error: true
        run: |
          cd social-automation/frontend
          npm run test

      - name: Build social-automation frontend
        run: |
          cd social-automation/frontend
          npm run build

      - name: Run backend unit tests
        continue-on-error: true
        run: |
          cd social-automation/backend
          pytest tests/unit -v --tb=short -m "not integration"

      - name: Run backend integration tests
        continue-on-error: true
        run: |
          cd social-automation/backend
          pytest tests/integration -v --tb=short
