name: Auto-merge green PRs
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - name: Merge PRs whose required checks are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for n in $(gh pr list --state open --json number --jq '.[].number'); do
            state=$(gh pr view "$n" --json mergeStateStatus --jq .mergeStateStatus || echo UNKNOWN)
            if [ "$state" = "CLEAN" ] || [ "$state" = "UNSTABLE" ]; then
              echo "PR $n ($state) -> squash merge"
              gh pr merge "$n" --squash --delete-branch --auto || true
            else
              echo "PR $n ($state) — skip"
            fi
          done
