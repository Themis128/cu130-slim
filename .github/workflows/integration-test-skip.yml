---
# Companion to integration-tests.yml — same rationale as test-skip.yml. Reports
# the required `integration-test` check as success on PRs whose paths the real
# workflow ignores (mirrors its pull_request paths exactly).

name: Integration Tests (paths skipped)

"on":
  pull_request:
    branches: [master]
    paths-ignore:
      - 'social-automation/**'
      - 'env-manager/**'
      - 'docker-compose*.yml'
      - '.github/workflows/integration-tests.yml'

permissions:
  contents: read

jobs:
  integration-test:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - run: echo "integration-test paths unchanged — real 'integration-test' job not triggered; required check satisfied."
