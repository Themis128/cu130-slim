---
name: Social Automation Frontend CI

"on":
  push:
    branches: [master]
    paths:
      - 'social-automation/frontend/**'
      - 'social-automation/backend/**'  # Worker uses same backend code
  pull_request:
    branches: [master]
    paths:
      - 'social-automation/frontend/**'
      - 'social-automation/backend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: social-automation/frontend/node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('social-automation/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install dependencies
        run: |
          cd social-automation/frontend
          # legacy-peer-deps: lockfile resolved with vite 8 + plugin-react 4.x peer range
          npm ci --legacy-peer-deps

      - name: Run linting
        run: |
          cd social-automation/frontend
          npm run lint

      - name: Run type checking
        run: |
          cd social-automation/frontend
          npm run typecheck

      - name: Run tests
        run: |
          cd social-automation/frontend
          npm run test

      - name: Build
        run: |
          cd social-automation/frontend
          npm run build

  worker-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('social-automation/backend/pyproject.toml', 'social-automation/backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd social-automation/backend
          pip install -e ".[dev]"

      - name: Run linting (worker code)
        run: |
          cd social-automation/backend
          ruff check app/worker

      - name: Run type checking (worker code)
        run: |
          cd social-automation/backend
          mypy app/worker --ignore-missing-imports