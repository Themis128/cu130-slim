---
name: Social Automation Frontend CI

"on":
  push:
    branches: [master]
    paths:
      - 'social-automation/frontend/**'
      - 'social-automation/backend/**'  # Worker uses same backend code
  pull_request:
    branches: [master]
    paths:
      - 'social-automation/frontend/**'
      - 'social-automation/backend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: social-automation/frontend/node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('social-automation/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install dependencies
        run: |
          cd social-automation/frontend
          # legacy-peer-deps: lockfile resolved with vite 8 + plugin-react 4.x peer range
          npm ci --legacy-peer-deps

      - name: Run linting
        run: |
          cd social-automation/frontend
          npm run lint

      - name: Run type checking
        run: |
          cd social-automation/frontend
          npm run typecheck

      - name: Run tests
        run: |
          cd social-automation/frontend
          npm run test

      - name: Build
        run: |
          cd social-automation/frontend
          npm run build

  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('social-automation/backend/pyproject.toml', 'social-automation/backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd social-automation/backend
          pip install -e ".[dev]"

      - name: Run linting (worker code)
        run: |
          cd social-automation/backend
          ruff check app/worker

      - name: Run type checking (worker code)
        run: |
          cd social-automation/backend
          mypy app/worker --ignore-missing-imports