name: Social Automation Frontend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'social-automation/frontend/**'
  pull_request:
    branches: [ master ]
    paths:
      - 'social-automation/frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: social-automation/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd social-automation/frontend
          npm ci

      - name: Run linting
        run: |
          cd social-automation/frontend
          npm run lint

      - name: Run type checking
        run: |
          cd social-automation/frontend
          npm run typecheck

      - name: Run tests
        run: |
          cd social-automation/frontend
          npm run test -- --run

      - name: Build
        run: |
          cd social-automation/frontend
          npm run build

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./social-automation/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/social-automation-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/social-automation-frontend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'