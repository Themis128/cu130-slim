---
name: Social Automation Frontend CI

"on":
  push:
    branches: [master]
    paths:
      - 'social-automation/frontend/**'
  pull_request:
    branches: [master]
    paths:
      - 'social-automation/frontend/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: social-automation/frontend/node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('social-automation/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install dependencies
        run: |
          cd social-automation/frontend
          # legacy-peer-deps: lockfile resolved with vite 8 + plugin-react 4.x peer range
          npm ci --legacy-peer-deps

      - name: Run linting
        run: |
          cd social-automation/frontend
          npm run lint

      - name: Run type checking
        run: |
          cd social-automation/frontend
          npm run typecheck

      - name: Run tests
        run: |
          cd social-automation/frontend
          npm run test

      - name: Build
        run: |
          cd social-automation/frontend
          npm run build
