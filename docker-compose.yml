      - MESSENGER_SIDECAR_URL=http://stack-ops:9230
      # Self-hosted SearXNG metasearch (runs on omv — deploy/omv-workspace).
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      # OpenTelemetry → self-hosted Tempo on omv (OTLP/HTTP, LAN).
      # Continues Cloudflare zone traces via forwarded traceparent headers.
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-social-api}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://192.168.1.200:4318}
      # FastAPI 0.142 built-in telemetry exports ALL signals when the endpoint
      # is set; Tempo on omv only ingests traces (/v1/metrics 404s — spammed
      # "Failed to export metrics batch" every export interval).
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-none}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-none}
    volumes:
      - ./.env:/app/.env:ro
      - ./social-automation/backend/app:/app/app
      - ./social-automation/backend/alembic:/app/alembic
      - ./social-automation/backend/tests:/app/tests
      # Ops CLIs (meta_tool, linkedin_tool, x_tool, tiktok_tool, bluesky_tool,
      # slack_tool, monetization_tool, viber_tool) — read-only.
      - ./social-automation/backend/scripts:/app/scripts:ro
      - ./social-automation/backend/dbt:/app/dbt
      - ./social-automation/backend/mlruns:/app/mlruns
      # Deploy seeds (content_prompt_templates etc.) — idempotent, applied on boot.
      - ./deploy/seeds:/app/deploy/seeds:ro
      - ./social-automation/uploads:/app/uploads
      - "/mnt/c/Users/tbaltzakis/OneDrive/Kakkava Sofia:/mnt/kakkava:ro"
      # Read-only access to notebook reports output for /api/v1/reports.
      - ./notebooks:/notebooks:ro
      - tunnel_url:/run/tunnel
    command: sh -c "alembic upgrade head && (python scripts/seed_content_templates.py || echo 'WARN content-template seed failed (non-fatal)') && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
      # comfyui + instagram-private-api intentionally absent: both are
      # idle-slept and wake-proxied via stack-ops; depending on them would
      # force-start the heaviest containers on every api recreate.
      chroma:
        condition: service_healthy
      minio:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')" || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    memswap_limit: 4096m
    cpus: '4'
    restart: unless-stopped
  # ── Metrics exporter ─────────────────────────────────────────────────────
  # Prometheus on omv can't reach the loopback-bound API; this proxies ONLY
  # /metrics to a LAN port. Everything else 404s — no API surface exposed.
  social-metrics:
    image: nginx:1.27-alpine
    pull_policy: if_not_present
    container_name: social-metrics
    networks:
      - backend
    ports:
      - 9390:80
    volumes:
      - ./deploy/nginx/metrics-exporter.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/metrics | head -1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    memswap_limit: 512m
    cpus: '1'
    restart: unless-stopped
  # ── Blue/green deploy ─────────────────────────────────────────────────────
  # api-gateway is the stable upstream the frontend proxies /api/v1 through.
  # Deploy scripts start the inactive slot, health-check it, rewrite
  # deploy/nginx/upstream/active.conf, and `nginx -s reload` — hitless swap.
  api-gateway:
    image: nginx:1.27-alpine
    pull_policy: if_not_present
    container_name: social-api-gateway
    networks:
      - backend
    volumes:
      - ./deploy/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/upstream:/etc/nginx/upstream:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    memswap_limit: 256m
    cpus: '1'
    restart: unless-stopped
  # Second API slot used by scripts/deploy-api.py. Same env/mounts as
  # social-api via `extends`; starts under the `bluegreen` profile only so a
  # plain `docker compose up -d` leaves it off.
  social-api-green:
    extends: social-api
    container_name: social-api-green
    ports: !override
      - 127.0.0.1:18083:8000
    profiles:
      - bluegreen
  # ── Celery workers (queue-dedicated) ──────────────────────────────────────
  # Three worker containers, each consuming a dedicated queue so time-sensitive
  # publishing tasks are never blocked by CPU-heavy media/AI work:
  #   social-worker-publishing — conc=3 (I/O-bound API calls, time-sensitive)
  #   social-worker-media      — conc=2, max-tasks-per-child=50 (CPU-heavy, recycle RAM)
  #   social-worker-default    — conc=2, max-tasks-per-child=200 (light tasks)
  # Total: 7 concurrent prefork processes across 3 containers.
  # celery-beat (below) schedules tasks into the routed queues.
  social-worker-publishing:
    image: ghcr.io/themis128/cu130-slim:social-worker-publishing-latest
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile
      target: worker
      additional_contexts:
        browser: ./browser-novnc
    container_name: social-worker-publishing
    networks:
      - backend
      - db
    environment: *worker-env
    volumes: *worker-volumes
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: *worker-depends
    <<: *public-dns
    # conc=3: publishing is I/O-bound (LinkedIn/Twitter/Meta API calls), low
    # RAM per process (~120MB).  3 slots ensure "publish now" is never blocked
    # by a long process_publish_queue run.  max-tasks-per-child=200: light
    # tasks, recycle infrequently to avoid churn.
    command: celery -A app.worker.celery_app worker -Q publishing --loglevel=info --concurrency=3 --max-tasks-per-child=200 --hostname=publishing@%h
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker.celery_app inspect ping -d publishing@$$HOSTNAME | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 90s
    mem_limit: 1280m
    memswap_limit: 3072m
    cpus: '4'
    restart: unless-stopped

  social-worker-media:
    image: ghcr.io/themis128/cu130-slim:social-worker-latest
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile
      target: worker
      additional_contexts:
        browser: ./browser-novnc
    container_name: social-worker-media
    networks:
      - backend
      - db
    environment: *worker-env
    volumes: *worker-volumes
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: *worker-depends
    <<: *public-dns
    # conc=2: media tasks are CPU/RAM-heavy (Pillow, AI calls).  max-tasks-per-
    # child=50: recycle processes more often to release fragmented Pillow/AI
    # memory on this 8GB-RAM host.
    command: celery -A app.worker.celery_app worker -Q media --loglevel=info --concurrency=2 --max-tasks-per-child=50 --hostname=media@%h
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker.celery_app inspect ping -d media@$$HOSTNAME | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Video generation tasks run up to ~15min (segmented long-form); a short
    # grace period SIGKILLs them mid-run and the task only redelivers after
    # the 3600s broker visibility timeout — stuck "STARTED" for an hour.
    stop_grace_period: 15m
    mem_limit: 1280m
    memswap_limit: 3072m
    cpus: '4'
    restart: unless-stopped

  social-worker-default:
    image: ghcr.io/themis128/cu130-slim:social-worker-latest
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile
      target: worker
      additional_contexts:
        browser: ./browser-novnc
    container_name: social-worker-default
    networks:
      - backend
      - db
    environment: *worker-env
    volumes: *worker-volumes
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: *worker-depends
    <<: *public-dns
    # -Q default,celery catches both routed "default" tasks and any unrouted
    # task.  conc=2, max-tasks-per-child=200: analytics/workflows/digests are
    # I/O-bound with short bursts, recycle infrequently.
    command: celery -A app.worker.celery_app worker -Q default,celery --loglevel=info --concurrency=2 --max-tasks-per-child=200 --hostname=default@%h
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker.celery_app inspect ping -d default@$$HOSTNAME | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 90s
    mem_limit: 1280m
    memswap_limit: 3072m
    cpus: '4'
    restart: unless-stopped

  social-worker-messenger:
    image: ghcr.io/themis128/cu130-slim:social-worker-latest
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile
      target: worker
      additional_contexts:
        browser: ./browser-novnc
    container_name: social-worker-messenger
    networks:
      - backend
      - db
    environment: *worker-env
    volumes: *worker-volumes
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: *worker-depends
    <<: *public-dns
    # Dedicated queue for Messenger bot tasks: personal Messenger polling
    # (every 120s) does heavy AI work — DMR inference, RAG retrieval, intent
    # detection, ChromaDB memory storage.  conc=2: one slot for the poller,
    # one for ad-hoc bot tasks (brand indexing, thread pause/resume).
    # max-tasks-per-child=50: AI calls are RAM-heavy, recycle often.
    command: celery -A app.worker.celery_app worker -Q messenger --loglevel=info --concurrency=2 --max-tasks-per-child=50 --hostname=messenger@%h
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker.celery_app inspect ping -d messenger@$$HOSTNAME | grep -q pong || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 90s
    mem_limit: 1024m
    memswap_limit: 2048m
    cpus: '4'
    restart: unless-stopped
  celery-beat:
    image: ghcr.io/themis128/cu130-slim:social-worker-latest
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile
      target: worker
      additional_contexts:
        browser: ./browser-novnc
    container_name: celery-beat
    networks:
      - backend
      - db
    environment: *worker-env
    volumes:
      - ./.env:/app/.env:ro
      - ./social-automation/backend/app:/app/app
    extra_hosts:
      - host.docker.internal:host-gateway
    command: celery -A app.worker.celery_app beat --loglevel=info --scheduler=celery.beat:PersistentScheduler
    stop_grace_period: 90s
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *public-dns
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import os,sys; sys.exit(0 if any(b''beat'' in open(f''/proc/{p}/cmdline'',''rb'').read() for p in os.listdir(''/proc'') if p.isdigit()) else 1)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    memswap_limit: 512m
    cpus: '1'
    restart: unless-stopped
  cloudflared:
    image: ghcr.io/themis128/cu130-slim:cloudflared-latest
    pull_policy: always
    build:
      context: ./social-automation
      dockerfile: Dockerfile.cloudflared
    container_name: social-cloudflared
    networks:
      - backend
      - default
    environment:
      - SOCIAL_TUNNEL_TOKEN=${SOCIAL_TUNNEL_TOKEN:-}
    volumes:
      - tunnel_url:/run/tunnel
      - ./social-automation/cloudflared-entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # pgrep alone stays "healthy" while cloudflared is disconnected from the
      # edge; the metrics gauge only exceeds 0 when tunnel connections exist.
      test:
        [
          "CMD-SHELL",
          "pgrep -f cloudflared >/dev/null && curl -sf http://localhost:20241/metrics | grep -Eq 'cloudflared_tunnel_ha_connections [1-9]'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    memswap_limit: 512m
    cpus: '1'
    restart: unless-stopped
    depends_on:
      social-api:
        condition: service_healthy

  social-frontend:
    image: ghcr.io/themis128/cu130-slim:social-frontend-latest
    pull_policy: always
    build:
      context: ./social-automation/frontend
      dockerfile: Dockerfile
    container_name: social-frontend
    command: ["node", "novnc-server.cjs"]
    ports:
      - 127.0.0.1:8082:8083
    environment:
      - TZ=Europe/Athens
      - NEXT_PUBLIC_APP_TIMEZONE=Europe/Athens
      - API_INTERNAL_URL=http://api-gateway:8080
      - NEXT_PUBLIC_API_URL=/api/v1
      - PORT=8083
      - HOSTNAME=0.0.0.0
    networks:
      - backend
      - frontend
    depends_on:
      social-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: '1'
    restart: unless-stopped

  # ── Instagram Private API sidecar (aiograpi-rest) ────────────────────────
  # RESTful HTTP wrapper around aiograpi (async Instagram private mobile API).
  # Enables profile writes (bio, picture, name, website, phone) that the
  # official Graph API does not support.  Runs on internal port 8000, exposed
  # as 8011 on the host for diagnostics.  Session files persist in a named
  # volume so Instagram login survives container restarts.
  instagram-private-api:
    image: subzeroid/aiograpi-rest:latest
    build:
      context: ./instagram-private-api
      dockerfile: Dockerfile
    container_name: instagram-private-api
    networks:
      - backend
    environment:
      - TZ=Europe/Athens
      - AIOGRAPI_REST_DB_PATH=/data/db.json
    volumes:
      - instagram_sessions:/data
      - ./social-automation/uploads:/uploads:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    memswap_limit: 2048m
    cpus: '2'
    restart: unless-stopped
    <<: *public-dns

  # ── Cloudflare WARP proxy (residential IP for Instagram sidecar) ───────────
  # Provides a SOCKS5 proxy on port 1080 that routes traffic through
  # Cloudflare WARP, giving the Instagram sidecar a non-datacenter IP
  # to avoid challenge_required from Instagram's anti-abuse system.
  # Free, no account required. Uses WireGuard tunnel via wgcf.
  warp-proxy:
    image: caomingjun/warp
    container_name: warp-proxy
    networks:
      - backend
    environment:
      - WARP_SLEEP=2
      - TZ=Europe/Athens
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp_data:/var/lib/cloudflare-warp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --socks5-hostname 127.0.0.1:1080 -sL https://cloudflare.com/cdn-cgi/trace | grep -q 'warp=on' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    memswap_limit: 512m
    cpus: '1'
    restart: unless-stopped

  # ── Browser + noVNC container (visual browser for social logins) ─────────
  # Provides a headed Chromium browser accessible via web browser (noVNC)
  # and an HTTP bridge API for the SocialAuto backend to start sessions,
  # check status, and extract cookies after visual login.
  # Supported platforms: instagram, facebook, linkedin, tiktok, twitter,
  #   threads, reddit, youtube, pinterest, tumblr, medium, discord,
  #   telegram, whatsapp
  browser-novnc:
    build:
      context: ./browser-novnc
      dockerfile: Dockerfile
    container_name: browser-novnc
    init: true  # browser processes spawn zombies
    networks:
      - backend
    environment:
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=800
      - SCREEN_DEPTH=24
      - VNC_PORT=5900
      - NOVNC_PORT=6080
      - BRIDGE_PORT=9223
      - AUDIO_WS_PORT=6081
      - TZ=Europe/Athens
    volumes:
      - browser_cookies:/app/cookies
      - browser_profile:/app/browser-profile
      - ./social-automation/uploads:/app/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9223/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # Memory cap — Chromium tabs multiply silently; matches runtime docker update 2026-09-26.
    mem_limit: 1536m
    memswap_limit: 4096m
    # CPU cap — shared multi-session bridge; a busy tab must not pin all cores.
    cpus: '4'


  # ── Dedicated engagement-ingestion browser (no sweeps → no steals) ──
  engagement-browser:
    build:
      context: ./browser-novnc
      dockerfile: Dockerfile
    container_name: engagement-browser
    init: true
    networks:
      - backend
    environment:
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=800
      - SCREEN_DEPTH=24
      - VNC_PORT=5900
      - NOVNC_PORT=6080
      - BRIDGE_PORT=9223
      - AUDIO_WS_PORT=6081
      - TZ=Europe/Athens
    volumes:
      - engagement_cookies:/app/cookies
      - engagement_profile:/app/browser-profile
      - ./social-automation/uploads:/app/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9223/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 4096m
    cpus: '2'

  # ── TikTok Browser Automation sidecar (Playwright) ───────────────────────
  # RESTful HTTP wrapper around Playwright for TikTok profile settings that
  # the official Display API does not expose: privacy toggles, notification
  # preferences, ad settings, accessibility, business verification form.
  # Captcha-gated writes (bio, avatar, nickname) are NOT supported.
  # Session cookie is injected at runtime via the /session endpoint.
  tiktok-browser-sidecar:
    build:
      context: ./tiktok-browser-sidecar
      dockerfile: Dockerfile
    container_name: tiktok-browser-sidecar
    init: true  # browser processes spawn zombies
    networks:
      - backend
    environment:
      - TIKTOK_SIDECAR_PORT=9224
      - TZ=Europe/Athens
    volumes:
      - tiktok_browser_data:/data
    healthcheck:
      # node image ships no curl — probe /health with node itself
      # (same fix as linkedin/facebook sidecars, PR #779).
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:9224/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1024m
    memswap_limit: 3072m
    # CPU cap — automation browsers burst to a full core on page renders.
    cpus: '2'
    restart: unless-stopped
    <<: *public-dns

  # ── LinkedIn Browser Automation sidecar (Playwright) ──────────────────────
  # RESTful HTTP wrapper around Playwright for LinkedIn profile management
  # that the official API does not expose: headline, about, cover photo,
  # profile picture, website, location, experience, education, skills,
  # and Company Page management (about, logo, cover, specialties).
  # Browser session is injected via POST /session with storage_state.
  linkedin-browser-sidecar:
    build:
      context: ./linkedin-browser-sidecar
      dockerfile: Dockerfile
    container_name: linkedin-browser-sidecar
    init: true  # browser processes spawn zombies
    networks:
      - backend
    environment:
      - LINKEDIN_SIDECAR_PORT=9225
      - TZ=Europe/Athens
      # Session re-login via POST /login (2FA = SMS to account phone).
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL:-}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD:-}
      # LinkedIn blocks WARP egress (redirect loops / 429 on the browser
      # fingerprint) — connect directly by default; set LINKEDIN_PROXY to opt in.
      - LINKEDIN_PROXY=${LINKEDIN_PROXY:-}
      - LINKEDIN_RATE_LIMIT_COOLDOWN_MS=${LINKEDIN_RATE_LIMIT_COOLDOWN_MS:-21600000}
      - LINKEDIN_DEBUG_CONSOLE=${LINKEDIN_DEBUG_CONSOLE:-0}
    volumes:
      - linkedin_browser_data:/data
    depends_on:
      - warp-proxy
    healthcheck:
      # node:22-slim ships no curl — probe /health with node itself.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:9225/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 1536m/2560m/4096m all oom_killed the renderer on feed+editor —
    # headed (xvfb) Chromium needs real headroom on LinkedIn's Ember app.
    mem_limit: 2048m
    memswap_limit: 8192m
    # CPU cap — heaviest renderer in the stack (Ember app); observed 71% of
    # a core, so 3 gives burst headroom without letting it starve siblings.
    cpus: '3'
    restart: unless-stopped
    <<: *public-dns

  # ── LinkedIn MCP Server (read/search/messaging) ───────────────────────────
  # Complements the linkedin-browser-sidecar (which handles writes/posting).
  # Uses stickerdaniel/linkedin-mcp-server with streamable-http transport.
  # Session is stored in linkedin_mcp_data volume and shared with the sidecar.
  linkedin-mcp-server:
    image: stickerdaniel/linkedin-mcp-server:latest
    container_name: linkedin-mcp-server
    networks:
      - backend
    command:
      [
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "9227",
        "--path",
        "/mcp",
      ]
    environment:
      - TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=9227
      - HTTP_PATH=/mcp
      - TZ=Europe/Athens
      - TOOL_TIMEOUT=300
      - BROWSER_IDLE_TIMEOUT=0
      - LINKEDIN_COOKIE=${LINKEDIN_COOKIE:-}
    volumes:
      - linkedin_mcp_data:/home/pwuser/.linkedin-mcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s=socket.socket(); s.settimeout(5); s.connect((''127.0.0.1'',9227)); s.close()" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: '1'
    restart: unless-stopped
    <<: *public-dns

  # ── Airbyte MCP Server (data connectors: FB Marketing, etc.) ──────────────
  # Wraps the official airbyte-mcp with streamable-http transport.
  # Provides tools to list/run Airbyte connectors (Facebook Marketing, Stripe,
  # Postgres, etc.) from SocialAuto. Requires connector credentials in env.
  airbyte-mcp-server:
    build:
      context: ./airbyte-mcp-server
      dockerfile: Dockerfile
    container_name: airbyte-mcp-server
    networks:
      - backend
    ports:
      - 127.0.0.1:9229:9229
    environment:
      - AIRBYTE_MCP_PORT=9228
      - AIRBYTE_MCP_HEALTH_PORT=9229
      - AIRBYTE_MCP_HOST=0.0.0.0
      - AIRBYTE_PROJECT_DIR=/data
      - AIRBYTE_MCP_SAFE_MODE=1
      - AIRBYTE_CLOUD_MCP_READONLY_MODE=0
      - TZ=Europe/Athens
      - AIRBYTE_CLOUD_CLIENT_ID=${AIRBYTE_CLOUD_CLIENT_ID:-}
      - AIRBYTE_CLOUD_CLIENT_SECRET=${AIRBYTE_CLOUD_CLIENT_SECRET:-}
      - AIRBYTE_CLOUD_WORKSPACE_ID=${AIRBYTE_CLOUD_WORKSPACE_ID:-}
      # Facebook Marketing connector credentials
      - FB_MARKETING_ACCESS_TOKEN=${FB_MARKETING_ACCESS_TOKEN:-}
      - FB_MARKETING_AD_ACCOUNT_ID=${FB_MARKETING_AD_ACCOUNT_ID:-}
      - FB_MARKETING_APP_ID=${FB_MARKETING_APP_ID:-}
      - FB_MARKETING_APP_SECRET=${FB_MARKETING_APP_SECRET:-}
    volumes:
      - airbyte_mcp_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9229/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: '1'
    restart: unless-stopped
    <<: *public-dns

  # ── Nextcloud MCP Server ──────────────────────────────────────────────────
  # ghcr.io/cbcoutinho/nextcloud-mcp-server — 110+ MCP tools over the omv
  # Nextcloud workspace (Notes, Calendar, Contacts, Files/WebDAV, Deck,
  # Cookbook, Tables, Sharing, News, Mail, Collectives, Talk) via
  # streamable-http. Authenticates with the NEXTCLOUD_* app password already
  # used by the media-export WebDAV mirror; registered in .devin/mcp_config.json.
  nextcloud-mcp-server:
    image: ghcr.io/cbcoutinho/nextcloud-mcp-server:0.198.3
    container_name: nextcloud-mcp-server
    networks:
      - backend
    ports:
      - 127.0.0.1:9231:8000
    environment:
      - NEXTCLOUD_HOST=https://cloud.cloudless.gr
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME:-}
      - NEXTCLOUD_PASSWORD=${NEXTCLOUD_APP_PASSWORD:-}
      - TOKEN_STORAGE_DB=/data/tokens.db
      - TOKEN_ENCRYPTION_KEY=${NEXTCLOUD_MCP_TOKEN_KEY:-}
      - TZ=Europe/Athens
    volumes:
      - nextcloud_mcp_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',8000)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: '1'
    restart: unless-stopped
    <<: *public-dns

  # ── Facebook Browser Automation sidecar (Playwright) ──────────────────────
  # RESTful HTTP wrapper around Playwright for Facebook personal-profile
  # operations that the official Graph API does not support: personal-profile
  # posting (text/photo/link/video), bio edits, profile picture, cover photo,
  # and website.  Also supports Page-mode posting via /page/* endpoints.
  # Browser session is injected via POST /session with storage_state.
  facebook-browser-sidecar:
    build:
      context: ./facebook-browser-sidecar
      dockerfile: Dockerfile
    container_name: facebook-browser-sidecar
    init: true  # browser processes spawn zombies
    networks:
      - backend
    environment:
      - FACEBOOK_SIDECAR_PORT=9226
      - TZ=Europe/Athens
    volumes:
      - facebook_browser_data:/data
    healthcheck:
      # node:22-slim ships no curl — probe /health with node itself.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:9226/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1024m
    memswap_limit: 3072m
    # CPU cap — automation browsers burst to a full core on page renders.
    cpus: '2'
    restart: unless-stopped
    <<: *public-dns

  # ── Messenger webhook sidecar ───────────────────────────────────────────
  # Async webhook event processor for Facebook Messenger.  Receives events
  # from social-api's /messenger/webhook POST endpoint and processes them
  # (AI auto-reply, conversation persistence) without blocking the main API.
  # Free, self-hosted — uses DMR (local GPU) primary with Cloudflare Workers AI fallback.
  messenger-sidecar:
    build:
      context: ./messenger-sidecar
      dockerfile: Dockerfile
    container_name: messenger-sidecar
    init: true  # browser processes spawn zombies
    networks:
      - backend
    environment:
      - SOCIAL_API_URL=http://social-api:8000
      - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL:-}
      - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - DMR_BASE_URL=${DMR_BASE_URL:-http://host.docker.internal:12435}
      - DMR_CHATBOT_MODEL=${DMR_CHATBOT_MODEL:-hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}
      - DMR_MID_MODEL=${DMR_MID_MODEL:-hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}
      - DMR_MEDIA_MODEL=${DMR_MEDIA_MODEL:-cloudless/qwen3-4b-media:latest}
      - MESSENGER_AI_MODEL=${MESSENGER_AI_MODEL:-@cf/meta/llama-3.1-8b-instruct}
      - TZ=Europe/Athens
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9230/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    memswap_limit: 2048m
    # CPU cap — webhook processor is mostly idle; bound its DMR bursts.
    cpus: '2'
    restart: unless-stopped
    <<: *public-dns

  # ── DMR GPU runner watchdog ─────────────────────────────────────────────
  # The docker-model-runner container (host port 12435, GPU llama.cpp + vLLM)
  # is a Docker Desktop-managed system container with RestartPolicy=always.
  # That covers crashes, but not "container up, engine wedged". This watchdog
  # polls the models endpoint and restarts the runner after 3 consecutive
  # failures. Needs the docker socket to reach the Desktop-managed container.
  dmr-watchdog:
    image: docker:27-cli
    container_name: dmr-watchdog
    command:
      - sh
      - -c
      - |
        fails=0
        last_started=""
        echo "[dmr-watchdog] watching http://host.docker.internal:12435/engines/v1/models"

        # Canonical configs mirror _BEST_PRACTICE_CONFIGS in
        # social-automation/backend/app/services/dmr.py — keep in sync.
        # NOTE: _configure REPLACES a model's whole BackendConfiguration,
        # so runtime flags must be included or they'd be stripped.
        # (The docker-model CLI plugin is Desktop-internal and I/O-errors
        # inside containers — use the HTTP endpoint like the app does.)
        configure() {
          wget -q -O /dev/null -T 10 \
            --header "Content-Type: application/json" \
            --post-data "$$1" \
            http://host.docker.internal:12435/engines/_configure
        }

        apply_configs() {
          echo "[dmr-watchdog] applying canonical model configs"
          ok=0
          configure '{"model":"ai/qwen3:8b-q4_K_M","context-size":6144,"keep_alive":"2m","llamacpp":{"reasoning-budget":-1},"runtime-flags":["--n-gpu-layers","0","--threads","8","--batch-size","1024","--flash-attn","on"]}' || ok=1
          configure '{"model":"hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M","context-size":4096,"keep_alive":"30m","runtime-flags":["--n-gpu-layers","0","--threads","8","--batch-size","1024","--flash-attn","on"]}' || ok=1
          configure '{"model":"ai/llama3.2","context-size":4096,"keep_alive":"2m","runtime-flags":["--n-gpu-layers","0","--threads","8","--batch-size","512","--flash-attn","on"]}' || ok=1
          configure '{"model":"ai/qwen3-vl","context-size":4096,"keep_alive":"90s","runtime-flags":["--n-gpu-layers","0","--threads","8","--batch-size","512","--flash-attn","on"]}' || ok=1
          configure '{"model":"hf.co/Qwen/Qwen3-Embedding-0.6B-GGUF","context-size":8192,"keep_alive":"15m","mode":"embedding","runtime-flags":["--n-gpu-layers","0","--threads","8"]}' || ok=1
          configure '{"model":"ai/smollm3","context-size":4096,"keep_alive":"60s","runtime-flags":["--reasoning-budget","0","--n-gpu-layers","0","--threads","4","--batch-size","512","--flash-attn","on"]}' || ok=1
          configure '{"model":"cloudless/qwen3-4b-media:latest","context-size":4096,"keep_alive":"5m","runtime-flags":["--n-gpu-layers","0","--threads","8","--batch-size","512","--flash-attn","on"]}' || ok=1
          # Return 0 only if every push landed; a failed push retries next tick
          return $$ok
        }

        tick=0
        while true; do
          tick=$$((tick+1))
          # Heartbeat for the container healthcheck — proves the loop is ticking.
          touch /tmp/dmr-watchdog.beat
          # Configs are in-memory per loaded model — wiped on runner restart
          # AND on model unload (keep-alive expiry). Re-apply on StartedAt
          # change and periodically (~every 6th tick = 60s).
          started=$$(docker inspect -f '{{.State.StartedAt}}' docker-model-runner 2>/dev/null)
          if { [ -n "$$started" ] && [ "$$started" != "$$last_started" ]; } || [ $$((tick % 6)) -eq 0 ]; then
            if wget -q -O /dev/null -T 5 http://host.docker.internal:12435/engines/v1/models 2>/dev/null; then
              if apply_configs; then
                last_started=$$started
              else
                echo "[dmr-watchdog] config apply failed - retrying next tick"
              fi
            fi
          fi

          # Deep health: /engines/v1/models stays 200 even when the scheduler
          # is wedged (llama-servers deadlocked on VRAM). /api/ps exercises
          # the scheduler — a hang there is the true wedge signal (seen
          # 2026-10-05).
          if wget -q -O /dev/null -T 5 http://host.docker.internal:12435/engines/v1/models 2>/dev/null \
             && wget -q -O /dev/null -T 8 http://host.docker.internal:12435/api/ps 2>/dev/null; then
            fails=0
          else
            fails=$$((fails+1))
            echo "[dmr-watchdog] DMR health check failed ($$fails/3)"
            if [ "$$fails" -ge 3 ]; then
              echo "[dmr-watchdog] restarting docker-model-runner"
              if ! docker restart docker-model-runner; then
                echo "[dmr-watchdog] restart failed — trying docker kill"
                if ! docker kill docker-model-runner 2>/dev/null; then
                  # Zombie PID 1 cannot be killed through the docker API
                  # (seen 2026-10-06: "PID is zombie and can not be killed")
                  # and the Desktop-managed container has no --init. Kill the
                  # container's containerd-shim on the host instead — the
                  # runner's restart=always policy then recreates it cleanly.
                  echo "[dmr-watchdog] kill failed — zombie PID 1; killing containerd-shim"
                  cid=$$(docker inspect -f '{{.Id}}' docker-model-runner 2>/dev/null)
                  if [ -n "$$cid" ]; then
                    docker run --rm --privileged --pid=host docker:27-cli \
                      pkill -9 -f "containerd-shim.*-id $$cid" \
                      && echo "[dmr-watchdog] shim killed — restart=always recreates the runner" \
                      || echo "[dmr-watchdog] shim kill failed — Docker Desktop restart required"
                  else
                    echo "[dmr-watchdog] container gone — Docker Desktop restart required"
                  fi
                fi
              fi
              fails=0
            fi
          fi
          # 10s tick: after a runner restart the in-memory model configs are
          # gone; loads in the window before apply_configs run at GGUF-default
          # ctx (262144 on the 4B -> KV-alloc failures). Tight cadence keeps
          # that window ~10s instead of ~60s.
          sleep 10
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 96m
    memswap_limit: 192m
    cpus: '1'
    restart: unless-stopped
    # Healthy = the watch loop is ticking (heartbeat < 45s old).
    # We deliberately do NOT probe DMR here — DMR health is the watchdog's
    # job; this check only proves the watchdog itself is alive.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/dmr-watchdog.beat &&
          [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/dmr-watchdog.beat) )) -lt 45 ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    <<: *public-dns

  # Exposes the DMR OpenAI-compatible API on the LAN for hosts that cannot
  # see host.docker.internal (omv Nextcloud Assistant → integration_openai
  # points here). Plain TCP forwarder to host.docker.internal:12435 —
  # LAN-only by topology (no auth; anyone on 192.168.1.0/24 can reach it).
  dmr-lan-proxy:
    image: node:24
    container_name: dmr-lan-proxy
    command:
      - node
      - -e
      - |
        const net = require('net');
        net.createServer((s) => {
          s.on('error', () => {});
          const d = net.connect(12435, 'host.docker.internal');
          d.on('error', () => s.destroy());
          s.pipe(d).pipe(s);
        }).listen(12436, '0.0.0.0', () => console.log('dmr-lan-proxy up'));
    ports:
      - "12436:12436"
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(12436,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    memswap_limit: 128m
    cpus: '1'
    restart: unless-stopped
    <<: *public-dns

  # Jupyter scratchpad for ad-hoc analytics against social-postgres.
  # Localhost-only (SSH tunnel / Tailscale) — token auth from .env.
  # Never expose this port publicly: it is remote code execution.
  jupyter:
    image: quay.io/jupyter/scipy-notebook:x86_64-2025-07-28
    pull_policy: if_not_present
    container_name: social-jupyter
    networks:
      - backend
      - db
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./jupyter/start-notebook.d:/usr/local/bin/start-notebook.d:ro
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      - DATABASE_URL=postgresql://${SOCIAL_POSTGRES_USER}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB}
      # Media QA notebook (work/media_validation.ipynb): fetches assets via the
      # API and runs the semantic check against the DMR vision model (qwen3-vl).
      - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL}
      - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD}
      - DMR_BASE_URL=${DMR_BASE_URL:-http://host.docker.internal:12435/engines/v1}
      - DMR_MODEL=${DMR_MODEL:-qwen3-vl}
      - TZ=Europe/Athens
    # host.docker.internal must resolve for DMR_BASE_URL — other services
    # already carry this mapping; jupyter was missing it (DNS failure made the
    # semantic vision check silently skip).
    extra_hosts:
      - host.docker.internal:host-gateway
    <<: *public-dns
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/api || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 2048m
    cpus: '2'
    restart: unless-stopped

  # ── stack-ops: idle-sleep + wake-on-connect front proxy ────────────
  # Sleeps idle-tolerant services after their idle timeout and wakes them
  # transparently on first connection (docker start + wait-healthy + TCP
  # pipe). Backend/worker base URLs point at stack-ops:<same port>; UIs get
  # an auto-refresh waiting page. Host ports for sleeping services are
  # published HERE so localhost tools wake them too.
  # Control API: 127.0.0.1:8787 -> /wake/<name> /sleep/<name> /status
  # /keepawake/<name>?ttl=<s> . Config: stack-ops/services.json.
  stack-ops:
    build:
      context: ./stack-ops
    container_name: stack-ops
    environment:
      - STACK_OPS_POLL_SECONDS=${STACK_OPS_POLL_SECONDS:-60}
      - STACK_OPS_CPU_MAX=${STACK_OPS_CPU_MAX:-3.0}
      - STACK_OPS_WAKE_TIMEOUT=${STACK_OPS_WAKE_TIMEOUT:-120}
      - STACK_OPS_CONN_STREAK=${STACK_OPS_CONN_STREAK:-4}
      - STACK_OPS_SLEEPER=${STACK_OPS_SLEEPER:-1}
      # Host repo path for pruned-service recreation — compose resolves
      # relative bind sources against --project-directory on the host fs.
      - STACK_OPS_HOST_DIR=${STACK_OPS_HOST_DIR:-/home/tbaltzakis/cu130-slim}
    networks:
      - backend
    ports:
      - 127.0.0.1:8787:8787 # control API
      - 127.0.0.1:8000:8199 # comfyui (wake-proxied)
      - 127.0.0.1:3000:3000 # metabase
      - 127.0.0.1:5555:5555 # flower
      - 127.0.0.1:5900:5900 # noVNC VNC
      - 127.0.0.1:6080:6080 # noVNC web
      - 127.0.0.1:6081:6081 # noVNC audio ws
      - 127.0.0.1:8010:8010 # languagetool
      - 127.0.0.1:8011:8000 # instagram-private-api
      - 127.0.0.1:8080:8080 # env-manager frontend
      - 127.0.0.1:8888:8888 # social-jupyter
      - 127.0.0.1:9000:9000 # portainer
      - 127.0.0.1:9223:9223 # browser-novnc bridge api
      - 127.0.0.1:9224:9224 # tiktok-browser-sidecar
      - 127.0.0.1:9225:9225 # linkedin-browser-sidecar
      - 127.0.0.1:9226:9226 # facebook-browser-sidecar
      - 127.0.0.1:9227:9227 # linkedin-mcp-server
      - 127.0.0.1:9228:9228 # airbyte-mcp-server
      - 127.0.0.1:9230:9230 # messenger-sidecar (9229 = airbyte health, direct)
      - 127.0.0.1:1080:1080 # warp-proxy socks5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./stack-ops/services.json:/app/services.json:ro
      # Compose file + env so wake() can recreate pruned services
      # (`docker compose -f /app/docker-compose.yml up -d --no-deps <svc>`).
      # .env is required — the file uses ${VAR:?} required-var syntax.
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 192m
    memswap_limit: 384m
    cpus: '1'
    restart: always
    <<: *public-dns


  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    environment:
      # Must resolve to the same Loki the worker's LOKI_URL reads —
      # ingestion and query sides share one deployment.
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://192.168.1.200:30100}
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - backend
    depends_on:
      docker-socket-proxy:
        condition: service_started

  # Minimal-permission Docker socket proxy — promtail discovers containers
  # through this instead of holding the real docker.sock (which grants
  # host-level Docker API access even when mounted :ro).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

  # ── Gate watchers — cdp/li-vetting watches, persistent service ───────
  stack-watchers:
    image: python:3.12-slim
    container_name: stack-watchers
    command: python /app/.devin/skills/pending-triggers-ops/scripts/heal_supervisor.py
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/wsl/docker-desktop/cli-tools/usr/bin/docker:/usr/bin/docker:ro
      - /mnt/wsl/docker-desktop/cli-tools/usr/local/lib/docker/cli-plugins/docker-compose:/root/.docker/cli-plugins/docker-compose:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'heal_supervisor' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Mautic — self-hosted funnel/marketing-automation manager (campaigns,
  # landing pages, drip sequences, lead scoring, forms). Dedicated MariaDB.
  mautic-db:
    image: mariadb:11.4
    container_name: mautic-db
    networks:
      - db
    volumes:
      - mautic_db_data:/var/lib/mysql
    environment:
      - MARIADB_DATABASE=mautic
      - MARIADB_USER=mautic
      - MARIADB_PASSWORD=${MAUTIC_DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MAUTIC_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  mautic:
    image: mautic/mautic:latest
    container_name: mautic
    networks:
      - backend
      - db
    ports:
      - 127.0.0.1:8021:80
    volumes:
      - mautic_data:/var/www/html
    depends_on:
      mautic-db:
        condition: service_healthy
    <<: *public-dns
    environment:
      - MAUTIC_DB_HOST=mautic-db
      - MAUTIC_DB_PORT=3306
      - MAUTIC_DB_USER=mautic
      - MAUTIC_DB_PASSWORD=${MAUTIC_DB_PASSWORD}
      - MAUTIC_DB_DATABASE=mautic
      - MAUTIC_TRUSTED_PROXIES=["0.0.0.0/0"]
      - MAUTIC_URL=${MAUTIC_PUBLIC_URL:-http://localhost:8021}
      - MAUTIC_RUN_CRON_JOBS=true
      - DOCKER_MAUTIC_ROLE=mautic_web
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 1g
    restart: unless-stopped

  mautic-cron:
    image: mautic/mautic:latest
    container_name: mautic-cron
    networks:
      - db
    volumes:
      - mautic_data:/var/www/html
    depends_on:
      - mautic
    environment:
      - MAUTIC_DB_HOST=mautic-db
      - MAUTIC_DB_PORT=3306
      - MAUTIC_DB_USER=mautic
      - MAUTIC_DB_PASSWORD=${MAUTIC_DB_PASSWORD}
      - MAUTIC_DB_DATABASE=mautic
      - DOCKER_MAUTIC_ROLE=mautic_cron
    mem_limit: 384m
    restart: unless-stopped

volumes:
  portainer_data: null
  postgres_data: null
  social_postgres_data: null
  # Pre-created via docker volume create during the PG16→17 migration;
  # external keeps `compose down -v` from ever deleting the live data.
  social_postgres_data_v17:
    external: true
    name: cu130-slim_social_postgres_data_v17
  redis_data: null
  tunnel_url: null
  browser_cookies: null
  browser_profile: null
  engagement_cookies: null
  engagement_profile: null
  minio_data: null
  instagram_sessions: null
  warp_data: null
  tiktok_browser_data: null
  linkedin_browser_data: null
  linkedin_mcp_data: null
  facebook_browser_data: null
  airbyte_mcp_data: null
  nextcloud_mcp_data: null
  mautic_db_data: null
  mautic_data: null

# Explicit network topology (restored 2026-09-06 to match runtime state).
# Names are pinned so compose adopts the existing networks instead of
# creating project-prefixed ones. `default` is the implicit project network
# (cu130-slim_default) used by social-frontend / comfyui / cloudflared.
networks:
  backend:
    name: cu130-backend
  db:
    name: cu130-db
  frontend:
    name: cu130-frontend
  gpu:
    name: cu130-gpu
  default: null
