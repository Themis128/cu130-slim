      - BROWSER_BRIDGE_URL=http://stack-ops:9223
      # TikTok Browser Automation sidecar (Playwright)
      - TIKTOK_BROWSER_SIDECAR_URL=http://stack-ops:9224
      # LinkedIn Browser Automation sidecar (Playwright)
      - LINKEDIN_BROWSER_SIDECAR_URL=http://stack-ops:9225
      - LINKEDIN_MCP_SERVER_URL=http://stack-ops:9227/mcp
      - LINKEDIN_NEWSLETTER_SERIES_URN=${LINKEDIN_NEWSLETTER_SERIES_URN:-}
      - AIRBYTE_MCP_SERVER_URL=http://stack-ops:9228/mcp
      # Facebook Browser Automation sidecar (Playwright)
      # Personal-profile posting + profile edits the Graph API does not support.
      - FACEBOOK_BROWSER_SIDECAR_URL=http://stack-ops:9226
