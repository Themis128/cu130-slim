# Public DNS for outbound HTTPS (Cloudflare Workers AI, etc.).
# Host /etc/resolv.conf currently points only at Tailscale MagicDNS
# (100.100.100.100), which fails public lookups in this WSL environment.
# Docker still uses 127.0.0.11 for *service-name* resolution on the compose network.
x-public-dns: &public-dns
  dns:
    - 1.1.1.1
    - 8.8.8.8

