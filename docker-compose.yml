services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-media-comfyui-gpu
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories individually to avoid overwriting ComfyUI source code
      - ./storage/custom_nodes:/home/user/ComfyUI/custom_nodes
      - ./storage/models:/home/user/ComfyUI/models
      - ./storage/user:/home/user/ComfyUI/user
      # Output directory for generated images (symlinked to host in workflow)
      - ./storage/output:/home/user/ComfyUI/output
      # Input directory for uploads
      - ./storage/input:/home/user/ComfyUI/input
    environment:
      - N8N_API_KEY=testkey123
      - CLI_ARGS=--listen 0.0.0.0 --port 8000 --preview-method auto
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - FAL_KEY=${FAL_KEY}
      # VRAM optimization for 8GB cards (reduces fragmentation)
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    environment:
      - N8N_API_KEY=testkey123
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
      - TWITTER_API_URL=https://api.twitter.com/2/tweets
      - N8N_SANDBOX_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_WORKFLOW_FILE_SYSTEM=true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=metabase
      - POSTGRES_USER=metabase
      - POSTGRES_PASSWORD=metabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=metabase
      - MB_DB_PASS=metabase
      - MB_DB_HOST=postgres
      - N8N_API_KEY=testkey123
    depends_on:
      - postgres
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ./ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8001:8000"
    volumes:
      - ./chroma:/chroma/chroma
    command: ["run", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  env-manager-backend:
    build:
      context: ./env-manager/backend
      dockerfile: Dockerfile
    container_name: env-manager-backend
    ports:
      - "8081:8081"
    volumes:
      - ./.env:/app/.env:rw
    environment:
      - ENV_MANAGER_USER=admin
      - ENV_MANAGER_PASS=admin
    restart: unless-stopped

  env-manager-frontend:
    build:
      context: ./env-manager/frontend
      dockerfile: Dockerfile
    container_name: env-manager-frontend
    ports:
      - "8080:8080"
    depends_on:
      - env-manager-backend
    restart: unless-stopped

# Social Automation Platform Services
  social-postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    environment:
      - POSTGRES_DB=social_automation
      - POSTGRES_USER=social_user
      - POSTGRES_PASSWORD=social_pass
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  social-api:
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile
    container_name: social-api
    ports:
      - "8083:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://social_user:social_pass@social-postgres:5432/social_automation
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - N8N_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY}
      - COMFYUI_URL=http://comfyui:8000
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_URL=http://chroma:8000
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/linkedin/callback
      - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID}
      - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET}
      - TWITTER_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/twitter/callback
      - INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID}
      - INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET}
      - INSTAGRAM_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/instagram/callback
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      - FACEBOOK_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/facebook/callback
    volumes:
      - ./social-automation/backend/app:/app/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - social-postgres
      - redis
      - n8n
      - comfyui
      - ollama
      - chroma
    restart: unless-stopped

  social-worker:
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile.worker
    container_name: social-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://social_user:social_pass@social-postgres:5432/social_automation
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - N8N_URL=http://n8n:5678
      - N8N_API_KEY=${N8N_API_KEY}
      - COMFYUI_URL=http://comfyui:8000
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./social-automation/backend/app:/app/app
    depends_on:
      - social-postgres
      - redis
      - n8n
      - comfyui
      - ollama
    restart: unless-stopped

  social-frontend:
    build:
      context: ./social-automation/frontend
      dockerfile: Dockerfile
    container_name: social-frontend
    ports:
      - "8082:8083"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8083/api/v1
      - PORT=8083
    depends_on:
      - social-api
    restart: unless-stopped

volumes:
  portainer_data:
  postgres_data:
  social_postgres_data:
  redis_data:


