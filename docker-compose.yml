version: '3.8'

services:
  comfyui:
    image: baltzakist/comfyui:latest
    container_name: social-media-comfyui-gpu
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories individually to avoid overwriting ComfyUI source code
      - ./storage/custom_nodes:/home/user/ComfyUI/custom_nodes
      - ./storage/models:/home/user/ComfyUI/models
      - ./storage/user:/home/user/ComfyUI/user
      # Output directory for generated images (symlinked to host in workflow)
      - ./storage/output:/home/user/ComfyUI/output
      # Input directory for uploads
      - ./storage/input:/home/user/ComfyUI/input
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8000 --preview-method auto --use-sage-attention
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - FAL_KEY=${FAL_KEY}
      # VRAM optimization for 8GB cards (reduces fragmentation)
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/root/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
      - TWITTER_API_URL=https://api.twitter.com/2/tweets
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - ./metabase-data:/metabase-data
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ./ollama:/root/.ollama
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8001:8000"
    volumes:
      - ./chroma:/chroma/chroma
    command: ["run", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data:
