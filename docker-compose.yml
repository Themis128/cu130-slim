# Public DNS for outbound HTTPS (Cloudflare Workers AI, etc.).
# Host /etc/resolv.conf currently points only at Tailscale MagicDNS
# (100.100.100.100), which fails public lookups in this WSL environment.
# Docker still uses 127.0.0.11 for *service-name* resolution on the compose network.
x-public-dns: &public-dns
  dns:
  - 1.1.1.1
  - 8.8.8.8

services:
  comfyui:
    image: baltzakist/cu130-slim-comfyui:2.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-media-comfyui-gpu
    ports:
    - 8000:8000
    volumes:
    - ./.env:/app/.env:ro
    - ./storage-user/custom_nodes:/home/user/ComfyUI/custom_nodes
    - ./storage-models/models:/home/user/ComfyUI/models
    - ./storage/models/checkpoints:/home/user/ComfyUI/models/checkpoints
    - ./storage-user/user:/home/user/ComfyUI/user
    - ./storage-user/output:/home/user/ComfyUI/output
    - ./storage-user/input:/home/user/ComfyUI/input
    environment:
    - CLI_ARGS=--listen 0.0.0.0 --port 8000 --preview-method auto
    - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
    - FAL_KEY=${FAL_KEY}
    - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    <<: *public-dns
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
  n8n:
    image: n8nio/n8n:2.19.5
    container_name: n8n
    ports:
    - 5678:5678
    volumes:
    - ./n8n-data:/home/node/.n8n
    <<: *public-dns
    environment:
    - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
    - N8N_INSTANCE_OWNER_EMAIL=tbaltzakis@cloudless.gr
    - N8N_INSTANCE_OWNER_FIRST_NAME=Admin
    - N8N_INSTANCE_OWNER_LAST_NAME=User
    - N8N_INSTANCE_OWNER_PASSWORD_HASH=$$2b$$12$$NaqhUHCeovpAKGzdP2CuNucKbwgY9OcTtdVVppoiSlX45pAP6ZOYW
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_PUBLIC_API_DISABLED=false
    - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
    - N8N_BASIC_AUTH_ACTIVE=true
    - N8N_BASIC_AUTH_USER=${N8N_USER}
    - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    - N8N_ENABLED_MODULES=instance-ai
    - N8N_DISABLED_MODULES=mcp,mcp-registry
    - N8N_INSTANCE_AI_MODEL=ollama/llama3.1:8b
    - N8N_INSTANCE_AI_MODEL_URL=http://ollama:11434
    - N8N_INSTANCE_AI_MODEL_API_KEY=
    - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
    - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
    - N8N_INSTANCE_AI_SANDBOX_URL=http://n8n-sandbox:8081
    - N8N_SANDBOX_SERVICE_URL=http://n8n-sandbox:8081
    - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
    - TWITTER_API_URL=https://api.twitter.com/2/tweets
    - N8N_SANDBOX_ENABLED=true
    - N8N_RUNNERS_ENABLED=true
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    - N8N_WEBHOOK_URL=http://localhost:5678/
    - N8N_WORKFLOW_FILE_SYSTEM=true
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    - N8N_TEMPLATES_ENABLED=false
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    - GENERIC_TIMEZONE=Europe/Athens
    - TZ=Europe/Athens
    - SOCIAL_API_URL=http://social-api:8000
    - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL}
    - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD}
    - CLOUDLESS_LINKEDIN_ORG_ACCOUNT_ID=${CLOUDLESS_LINKEDIN_ORG_ACCOUNT_ID:-4a8d9440-47d2-4bda-bd11-3776fd9022ba}
    - CLOUDLESS_CAROUSEL_TOPIC=${CLOUDLESS_CAROUSEL_TOPIC:-}
    - CLOUDLESS_CAROUSEL_SLIDES=${CLOUDLESS_CAROUSEL_SLIDES:-7}
    - SOCIALAUTO_DIGEST_DAYS=${SOCIALAUTO_DIGEST_DAYS:-1}
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    restart: unless-stopped
  n8n-sandbox:
    image: n8nio/n8n-sandbox-service-sandbox:latest
    container_name: n8n-sandbox
    environment:
    - N8N_SANDBOX_HOST=0.0.0.0
    - N8N_SANDBOX_PORT=8081
    - N8N_SANDBOX_LOG_LEVEL=info
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
    - POSTGRES_DB=${METABASE_DB_DBNAME}
    - POSTGRES_USER=${METABASE_DB_USER}
    - POSTGRES_PASSWORD=${METABASE_DB_PASS}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  metabase:
    image: metabase/metabase:v0.63.14.1
    container_name: metabase
    ports:
    - 3000:3000
    environment:
    - MB_DB_TYPE=postgres
    - MB_DB_DBNAME=${METABASE_DB_DBNAME}
    - MB_DB_PORT=5432
    - MB_DB_USER=${METABASE_DB_USER}
    - MB_DB_PASS=${METABASE_DB_PASS}
    - MB_DB_HOST=postgres
    - MB_EMAIL=${MB_EMAIL}
    - MB_PASSWORD=${MB_PASSWORD}
    - MB_ANON_TRACKING_ENABLED=false
    - MB_CHECK_FOR_UPDATES=false
    - MB_LOAD_SAMPLE_CONTENT=false
    - MB_METABOT_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
    dns:
    - 1.1.1.1
    - 8.8.8.8
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.33.1
    container_name: ollama
    ports:
    - 11435:11434
    volumes:
    - ./ollama/models:/root/.ollama/models
    - ./ollama/cache:/root/.ollama/cache
    runtime: nvidia
    dns:
    - 1.1.1.1
    - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: chroma
    ports:
    - 8001:8000
    volumes:
    - ./.env:/app/.env:ro
    - ./chroma:/chroma/chroma
    command:
    - run
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  languagetool:
    image: erikvl87/languagetool
    container_name: languagetool
    ports:
    - 8010:8010
    environment:
    - Java_Xms=256m
    - Java_Xmx=512m
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:2.39.6
    container_name: portainer
    ports:
    - 9000:9000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    restart: unless-stopped
  env-manager-backend:
    build:
      context: ./env-manager/backend
      dockerfile: Dockerfile
    container_name: env-manager-backend
    ports:
    - 8081:8081
    volumes:
    - ./.env:/app/.env:rw
    environment:
    - ENV_MANAGER_USER=${ENV_MANAGER_USER}
    - ENV_MANAGER_PASS=${ENV_MANAGER_PASS}
    restart: unless-stopped
  env-manager-frontend:
    build:
      context: ./env-manager/frontend
      dockerfile: Dockerfile
    container_name: env-manager-frontend
    ports:
    - 8080:8080
    depends_on:
    - env-manager-backend
    restart: unless-stopped
  social-postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    environment:
    - POSTGRES_DB=${SOCIAL_POSTGRES_DB}
    - POSTGRES_USER=${SOCIAL_POSTGRES_USER}
    - POSTGRES_PASSWORD=${SOCIAL_POSTGRES_PASSWORD}
    volumes:
    - social_postgres_data:/var/lib/postgresql/data
    ports:
    - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
    - 6379:6379
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  social-api:
    image: baltzakist/social-api:v2.00
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile
    container_name: social-api
    ports:
    - 8083:8000
    environment:
    - TZ=Europe/Athens
    - APP_TIMEZONE=Europe/Athens
    - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB}
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - ACCESS_TOKEN_EXPIRE_MINUTES=30
    - REFRESH_TOKEN_EXPIRE_DAYS=7
    - N8N_API_URL=http://n8n:5678
    - N8N_API_KEY=${N8N_API_KEY}
    - N8N_USER=${N8N_USER}
    - N8N_PASSWORD=${N8N_PASSWORD}
    - COMFYUI_URL=http://comfyui:8000
    - OLLAMA_URL=http://ollama:11434
    - CHROMA_URL=http://chroma:8000
    - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
    - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
    - LINKEDIN_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/linkedin/callback
    - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID}
    - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET}
    - TWITTER_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/twitter/callback
    - INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID}
    - INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET}
    - INSTAGRAM_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/instagram/callback
    - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
    - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
    - FACEBOOK_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/facebook/callback
    - THREADS_CLIENT_ID=${THREADS_CLIENT_ID}
    - THREADS_CLIENT_SECRET=${THREADS_CLIENT_SECRET}
    - THREADS_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/threads/callback
    - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL}
    - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD}
    - SOCIAL_ADMIN_NAME=${SOCIAL_ADMIN_NAME}
    - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
    - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-C0BT263L17U}
    - SLACK_DIGEST_HOUR=${SLACK_DIGEST_HOUR:-9}
    - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
    - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER:-resend}
    - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    - SMTP_FROM=${SMTP_FROM:-noreply@cloudless.gr}
    - DIGEST_EMAIL_TO=${DIGEST_EMAIL_TO:-tbaltzakis@cloudless.gr}
    - DIGEST_EMAIL_ISSUES_ONLY=${DIGEST_EMAIL_ISSUES_ONLY:-false}
    - CLOUDFLARE_EMAIL_API_TOKEN=${CLOUDFLARE_EMAIL_API_TOKEN:-}
    - TWITTER_API_KEY=${TWITTER_API_KEY:-}
    - TWITTER_API_SECRET=${TWITTER_API_SECRET:-}
    - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN:-}
    - TWITTER_ACCESS_TOKEN_SECRET=${TWITTER_ACCESS_TOKEN_SECRET:-}
    - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    - GROQ_API_KEY=${GROQ_API_KEY:-}
    - PIXAZO_API_KEY=${PIXAZO_API_KEY:-}
    - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-}
    - LANGUAGETOOL_URL=http://languagetool:8010
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
    - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    - MINIO_BUCKET=social-media
    volumes:
    - ./.env:/app/.env:ro
    - ./social-automation/backend/app:/app/app
    - ./social-automation/backend/alembic:/app/alembic
    - ./social-automation/uploads:/app/uploads
    - tunnel_url:/run/tunnel
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
      comfyui:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chroma:
        condition: service_healthy
    dns:
    - 1.1.1.1
    - 8.8.8.8
    restart: unless-stopped
  social-worker:
    image: baltzakist/social-worker:v2.00
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile.worker
    container_name: social-worker
    environment:
    - TZ=Europe/Athens
    - APP_TIMEZONE=Europe/Athens
    - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB}
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - N8N_API_URL=http://n8n:5678
    - N8N_API_KEY=${N8N_API_KEY}
    - N8N_USER=${N8N_USER}
    - N8N_PASSWORD=${N8N_PASSWORD}
    - COMFYUI_URL=http://comfyui:8000
    - OLLAMA_URL=http://ollama:11434
    - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
    - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-C0BT263L17U}
    - SLACK_DIGEST_HOUR=${SLACK_DIGEST_HOUR:-9}
    - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
    - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER:-resend}
    - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    - SMTP_FROM=${SMTP_FROM:-noreply@cloudless.gr}
    - DIGEST_EMAIL_TO=${DIGEST_EMAIL_TO:-tbaltzakis@cloudless.gr}
    - DIGEST_EMAIL_ISSUES_ONLY=${DIGEST_EMAIL_ISSUES_ONLY:-false}
    - CLOUDFLARE_EMAIL_API_TOKEN=${CLOUDFLARE_EMAIL_API_TOKEN:-}
    - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    - GROQ_API_KEY=${GROQ_API_KEY:-}
    - PIXAZO_API_KEY=${PIXAZO_API_KEY:-}
    - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-}
    volumes:
    - ./.env:/app/.env:ro
    - ./social-automation/backend/app:/app/app
    - ./social-automation/uploads:/app/uploads
    - tunnel_url:/run/tunnel
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
      comfyui:
        condition: service_healthy
      ollama:
        condition: service_healthy
    dns:
    - 1.1.1.1
    - 8.8.8.8
    restart: unless-stopped
  celery-beat:
    image: baltzakist/social-worker:v2.00
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile.worker
    container_name: celery-beat
    environment:
    - TZ=Europe/Athens
    - APP_TIMEZONE=Europe/Athens
    - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB}
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - N8N_API_URL=http://n8n:5678
    - N8N_API_KEY=${N8N_API_KEY}
    - N8N_USER=${N8N_USER}
    - N8N_PASSWORD=${N8N_PASSWORD}
    - COMFYUI_URL=http://comfyui:8000
    - OLLAMA_URL=http://ollama:11434
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
    - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-C0BT263L17U}
    - SLACK_DIGEST_HOUR=${SLACK_DIGEST_HOUR:-9}
    - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
    - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER:-resend}
    - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    - SMTP_FROM=${SMTP_FROM:-noreply@cloudless.gr}
    - DIGEST_EMAIL_TO=${DIGEST_EMAIL_TO:-tbaltzakis@cloudless.gr}
    - DIGEST_EMAIL_ISSUES_ONLY=${DIGEST_EMAIL_ISSUES_ONLY:-false}
    - CLOUDFLARE_EMAIL_API_TOKEN=${CLOUDFLARE_EMAIL_API_TOKEN:-}
    volumes:
    - ./.env:/app/.env:ro
    - ./social-automation/backend/app:/app/app
    extra_hosts:
    - host.docker.internal:host-gateway
    command: celery -A app.worker.celery_app beat --loglevel=info --scheduler=celery.beat:PersistentScheduler
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
    - 1.1.1.1
    - 8.8.8.8
    restart: unless-stopped
  cloudflared:
    image: baltzakist/cloudflared:v0.2
    pull_policy: always
    container_name: social-cloudflared
    volumes:
    - tunnel_url:/run/tunnel
    - ./social-automation/cloudflared-entrypoint.sh:/entrypoint.sh:ro
    restart: unless-stopped
    depends_on:
    - social-api

  social-frontend:
    image: baltzakist/social-frontend:v2.00
    build:
      context: ./social-automation/frontend
      dockerfile: Dockerfile.dev
    container_name: social-frontend
    ports:
    - 8082:8083
    environment:
    - TZ=Europe/Athens
    - NEXT_PUBLIC_APP_TIMEZONE=Europe/Athens
    - API_INTERNAL_URL=http://social-api:8000
    - NEXT_PUBLIC_API_URL=http://localhost:8082/api/v1
    - PORT=8083
    volumes:
    - ./social-automation/frontend:/app
    - /app/node_modules
    - /app/.next
    depends_on:
    - social-api
    restart: unless-stopped
volumes:
  portainer_data: null
  postgres_data: null
  social_postgres_data: null
  redis_data: null
  tunnel_url: null
