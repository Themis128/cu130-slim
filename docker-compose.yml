services:
  comfyui:
    image: baltzakist/cu130-slim-comfyui:latest
    container_name: social-media-comfyui-gpu
    ports:
    - 8188:8188
    volumes:
    - ./storage-user/custom_nodes:/home/user/ComfyUI/custom_nodes
    - ./storage-models/models:/home/user/ComfyUI/models
    - ./storage/models/checkpoints:/home/user/ComfyUI/models/checkpoints
    - ./storage-user/user:/home/user/ComfyUI/user
    - ./storage-user/output:/home/user/ComfyUI/output
    - ./storage-user/input:/home/user/ComfyUI/input
    environment:
    - CLI_ARGS=--listen 0.0.0.0 --port 8188 --preview-method auto
    - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
    - FAL_KEY=${FAL_KEY}
    - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    runtime: nvidia
    deploy:
      resources:
        reservations:
          cpus: '2.0'
          memory: 4G
        limits:
          cpus: '4'
          memory: 8G
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8188/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
    - 5678:5678
    volumes:
    - ./n8n-data:/home/node/.n8n
    environment:
    - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
    - N8N_INSTANCE_OWNER_EMAIL=tbaltzakis@cloudless.gr
    - N8N_INSTANCE_OWNER_FIRST_NAME=Admin
    - N8N_INSTANCE_OWNER_LAST_NAME=User
    - N8N_INSTANCE_OWNER_PASSWORD_HASH=$$2b$$12$$NaqhUHCeovpAKGzdP2CuNucKbwgY9OcTtdVVppoiSlX45pAP6ZOYW
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_PUBLIC_API_DISABLED=false
    - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
    - N8N_BASIC_AUTH_ACTIVE=true
    - N8N_BASIC_AUTH_USER=${N8N_USER}
    - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    - N8N_ENABLED_MODULES=instance-ai
    - N8N_INSTANCE_AI_MODEL=ollama/llama3.1:8b
    - N8N_INSTANCE_AI_MODEL_URL=http://ollama:11434
    - N8N_INSTANCE_AI_MODEL_API_KEY=
    - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
    - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
    - N8N_INSTANCE_AI_SANDBOX_URL=http://n8n-sandbox:8081
    - N8N_SANDBOX_SERVICE_URL=http://n8n-sandbox:8081
    - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
    - TWITTER_API_URL=https://api.twitter.com/2/tweets
    - N8N_SANDBOX_ENABLED=true
    - N8N_RUNNERS_ENABLED=true
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    - N8N_WEBHOOK_URL=http://localhost:5678/
    - N8N_WORKFLOW_FILE_SYSTEM=true
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5678/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
  n8n-sandbox:
    image: n8nio/n8n-sandbox-service-sandbox:latest
    container_name: n8n-sandbox
    environment:
    - N8N_SANDBOX_HOST=0.0.0.0
    - N8N_SANDBOX_PORT=8081
    - N8N_SANDBOX_LOG_LEVEL=info
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 0G
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
    - POSTGRES_DB=${METABASE_DB_DBNAME}
    - POSTGRES_USER=${METABASE_DB_USER}
    - POSTGRES_PASSWORD=${METABASE_DB_PASS}
    volumes:
    - ./.env:/app/.env:rw
    - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 0G
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
    - 3000:3000
    environment:
    - MB_DB_TYPE=postgres
    - MB_DB_DBNAME=${METABASE_DB_DBNAME}
    - MB_DB_PORT=5432
    - MB_DB_USER=${METABASE_DB_USER}
    - MB_DB_PASS=${METABASE_DB_PASS}
    - MB_DB_HOST=postgres
    - MB_EMAIL=${MB_EMAIL}
    - MB_PASSWORD=${MB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
    - 11435:11434
    volumes:
    - ./ollama/models:/root/.ollama/models
    - ./ollama/cache:/root/.ollama/cache
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: '2.0'
          memory: 4G
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:11434/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  stable-diffusion-nim:
    image: nvcr.io/nim/stable-diffusion-3.5-medium:latest
    container_name: stable-diffusion-nim
    ports:
    - 8000:8000
    environment:
    - NGC_API_KEY=${NGC_API_KEY}
    - HF_TOKEN=${HF_TOKEN}
    volumes:
    - ./nim-cache:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          cpus: '2.0'
          memory: 6G
        limits:
          cpus: '4'
          memory: 12G
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
    - 8001:8000
    volumes:
    - ./chroma:/chroma/chroma
    command:
    - run
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/api/v1/heartbeat
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 0G
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
    - 9000:9000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  env-manager-backend:
    container_name: env-manager-backend
    ports:
    - 8081:8081
    volumes:
    - ./.env:/app/.env:rw
    environment:
    - ENV_MANAGER_USER=${ENV_MANAGER_USER}
    - ENV_MANAGER_PASS=${ENV_MANAGER_PASS}
    restart: unless-stopped
    image: baltzakist/cu130-slim-env-manager-backend:latest
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
  env-manager-frontend:
    container_name: env-manager-frontend
    ports:
    - 8080:8080
    depends_on:
      env-manager-backend:
        condition: service_started
    restart: unless-stopped
    image: baltzakist/cu130-slim-env-manager-frontend:latest
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
  social-postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    environment:
    - POSTGRES_DB=${SOCIAL_POSTGRES_DB}
    - POSTGRES_USER=${SOCIAL_POSTGRES_USER}
    - POSTGRES_PASSWORD=${SOCIAL_POSTGRES_PASSWORD}
    volumes:
    - social_postgres_data:/var/lib/postgresql/data
    ports:
    - 5433:5432
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${SOCIAL_POSTGRES_USER} -d ${SOCIAL_POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 0G
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD
      must be set}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  social-api:
    container_name: social-api
    ports:
    - 8083:8000
    environment:
    - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB}
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - SECRET_KEY=${SECRET_KEY}
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - ACCESS_TOKEN_EXPIRE_MINUTES=30
    - REFRESH_TOKEN_EXPIRE_DAYS=7
    - N8N_API_URL=http://n8n:5678
    - N8N_API_KEY=${N8N_API_KEY}
    - N8N_USER=${N8N_USER}
    - N8N_PASSWORD=${N8N_PASSWORD}
    - COMFYUI_URL=http://comfyui:8188
    - OLLAMA_URL=http://ollama:11434
    - CHROMA_URL=http://chroma:8000
    - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
    - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
    - LINKEDIN_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/linkedin/callback
    - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID}
    - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET}
    - TWITTER_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/twitter/callback
    - INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID}
    - INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET}
    - INSTAGRAM_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/instagram/callback
    - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
    - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
    - FACEBOOK_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/facebook/callback
    - THREADS_CLIENT_ID=${THREADS_CLIENT_ID}
    - THREADS_CLIENT_SECRET=${THREADS_CLIENT_SECRET}
    - THREADS_REDIRECT_URI=http://localhost:8083/api/v1/auth/oauth/threads/callback
    - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL}
    - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD}
    - SOCIAL_ADMIN_NAME=${SOCIAL_ADMIN_NAME}
    volumes:
    - ./.env:/app/.env:rw
    - social_uploads:/app/uploads
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port
      8000 --reload"
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
      comfyui:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped
    image: baltzakist/cu130-slim-social-api:latest
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
  social-worker:
    container_name: social-worker
    environment:
    - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB}
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - SECRET_KEY=${SECRET_KEY}
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - N8N_API_URL=http://n8n:5678
    - N8N_API_KEY=${N8N_API_KEY}
    - N8N_USER=${N8N_USER}
    - N8N_PASSWORD=${N8N_PASSWORD}
    - COMFYUI_URL=http://comfyui:8188
    - OLLAMA_URL=http://ollama:11434
    volumes:
    - ./.env:/app/.env:rw
    - social_uploads:/app/uploads
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
      comfyui:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    image: baltzakist/cu130-slim-social-worker:latest
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
  social-frontend:
    container_name: social-frontend
    ports:
    - 8082:8083
    environment:
    - API_INTERNAL_URL=http://social-api:8000
    - NEXT_PUBLIC_API_URL=http://social-api:8000/api/v1
    - PORT=8083
    - HOST=0.0.0.0
    depends_on:
      social-api:
        condition: service_healthy
    restart: unless-stopped
    image: baltzakist/cu130-slim-social-frontend:test
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
volumes:
  portainer_data: null
  postgres_data: null
  social_postgres_data: null
  redis_data: null
  social_uploads: null
