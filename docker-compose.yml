# Public DNS for outbound HTTPS (Cloudflare Workers AI, etc.).
# Host /etc/resolv.conf currently points only at Tailscale MagicDNS
# (100.100.100.100), which fails public lookups in this WSL environment.
# Docker still uses 127.0.0.11 for *service-name* resolution on the compose network.
x-public-dns: &public-dns
  dns:
  - 1.1.1.1
  - 8.8.8.8

# Shared environment for all Celery worker + beat containers.
# Extracted as a YAML anchor so the three queue-dedicated workers and the
# beat scheduler stay in sync without copy-pasting 50 env lines each.
x-worker-env: &worker-env
  - TZ=Europe/Athens
  - APP_TIMEZONE=Europe/Athens
  - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB}
  - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
  - ENCRYPTION_KEY=${ENCRYPTION_KEY}
  - N8N_API_URL=http://n8n:5678
  - N8N_API_KEY=${N8N_API_KEY}
  - N8N_USER=${N8N_USER}
  - N8N_PASSWORD=${N8N_PASSWORD}
  - COMFYUI_URL=http://comfyui:8000
  - DMR_URL=${DMR_URL:-http://host.docker.internal:12434/engines/llama.cpp/v1}
  - DMR_TEXT_MODEL=${DMR_TEXT_MODEL:-ai/qwen3:8b-q4_K_M}
  - DMR_VISION_MODEL=${DMR_VISION_MODEL:-ai/qwen3-vl}
  - DMR_EMBEDDING_MODEL=${DMR_EMBEDDING_MODEL:-ai/qwen3-embedding}
  - DMR_TINY_MODEL=${DMR_TINY_MODEL:-ai/smollm2}
  - LOCAL_DIFFUSERS_URL=http://local-diffusers:7860
  - LOCAL_DIFFUSERS_MODEL=${LOCAL_DIFFUSERS_MODEL:-stable-diffusion-v1-5/stable-diffusion-v1-5}
  - CHROMA_URL=http://chroma:8000
  - LANGUAGETOOL_URL=http://languagetool:8010
  - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
  - CLOUDFLARE_AI_API_TOKEN=${CLOUDFLARE_AI_API_TOKEN:-}
  - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
  - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
  - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
  - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
  - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
  - R2_S3_ENDPOINT=${R2_S3_ENDPOINT:-}
  - MINIO_ENDPOINT=minio:9000
  - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
  - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
  - MINIO_BUCKET=social-media
  - MINIO_SECURE=false
  - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
  - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
  - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-C0BT263L17U}
  - SLACK_DIGEST_HOUR=${SLACK_DIGEST_HOUR:-9}
  - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
  - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
  - SMTP_PORT=${SMTP_PORT:-587}
  - SMTP_USER=${SMTP_USER:-resend}
  - SMTP_PASSWORD=${SMTP_PASSWORD:-}
  - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
  - SMTP_SSL_VERIFY=${SMTP_SSL_VERIFY:-true}
  - SMTP_FROM=${SMTP_FROM:-noreply@cloudless.gr}
  - DIGEST_EMAIL_TO=${DIGEST_EMAIL_TO:-tbaltzakis@cloudless.gr}
  - DIGEST_EMAIL_ISSUES_ONLY=${DIGEST_EMAIL_ISSUES_ONLY:-false}
  - CLOUDFLARE_EMAIL_API_TOKEN=${CLOUDFLARE_EMAIL_API_TOKEN:-}
  - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
  - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
  - GROQ_API_KEY=${GROQ_API_KEY:-}
  - GEMINI_API_KEY=${GEMINI_API_KEY:-}
  - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
  - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
  - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
  - COHERE_API_KEY=${COHERE_API_KEY:-}
  - PIXAZO_API_KEY=${PIXAZO_API_KEY:-}
  - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-}
  - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID:-}
  - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET:-}
  - TWITTER_REDIRECT_URI=${TWITTER_REDIRECT_URI:-https://social.cloudless.gr/api/v1/auth/oauth/twitter/callback}
  - TWITTER_API_KEY=${TWITTER_API_KEY:-}
  - TWITTER_API_SECRET=${TWITTER_API_SECRET:-}
  - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN:-}
  - TWITTER_ACCESS_TOKEN_SECRET=${TWITTER_ACCESS_TOKEN_SECRET:-}
  - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
  - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
  - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-https://social.cloudless.gr/api/v1/auth/oauth/tiktok/callback}
  # Instagram private API credentials (instagrapi direct path)
  - INSTAGRAM_PRIVATE_API_URL=http://instagram-private-api:8000
  - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME:-}
  - INSTAGRAM_PASSWORD=${INSTAGRAM_PASSWORD:-}
  - INSTAGRAM_PROXY=${INSTAGRAM_PROXY:-socks5://warp-proxy:1080}

# Shared volumes for all worker containers.
x-worker-volumes: &worker-volumes
  - ./.env:/app/.env:ro
  - ./social-automation/backend/app:/app/app
  - ./social-automation/uploads:/app/uploads
  - tunnel_url:/run/tunnel

# Shared depends_on for all worker containers.
x-worker-depends: &worker-depends
  social-postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  n8n:
    condition: service_healthy
  comfyui:
    condition: service_healthy
  chroma:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  comfyui:
    image: baltzakist/cu130-slim-comfyui:v2.417
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-media-comfyui-gpu
    networks:
    - backend
    - gpu
    ports:
    - 8000:8000
    volumes:
    - ./.env:/app/.env:ro
    - ./storage-user/custom_nodes:/home/user/ComfyUI/custom_nodes
    - ./storage-models/models:/home/user/ComfyUI/models
    - ./storage-user/metadata:/home/user/ComfyUI/metadata
    - ./storage-user/user:/home/user/ComfyUI/user
    - ./storage-user/output:/home/user/ComfyUI/output
    - ./storage-user/input:/home/user/ComfyUI/input
    environment:
    # ── GPU-first: keep everything in VRAM, use fp16 to fit in 8GB ───────
    # --gpu-only: force text encoders/CLIP/models onto GPU (minimum RAM)
    # --force-fp16: halves VRAM usage with minimal quality loss
    # --reserve-vram 1: keep 1GB VRAM free for DMR so ComfyUI doesn't OOM it
    - CLI_ARGS=--listen 0.0.0.0 --port 8000 --preview-method auto --gpu-only --force-fp16 --reserve-vram 1
    - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
    - FAL_KEY=${FAL_KEY}
    - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    <<: *public-dns
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
  n8n:
    image: n8nio/n8n:2.19.5
    container_name: n8n
    networks:
    - backend
    - db
    ports:
    - 5678:5678
    volumes:
    - ./n8n-data:/home/node/.n8n
    - ./storage-user/metadata:/home/node/.n8n/storage/metadata
    - ./comfyui-workflows:/workflows:ro
    - ./scripts:/scripts:ro
    <<: *public-dns
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n-sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
    - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
    - N8N_INSTANCE_OWNER_EMAIL=tbaltzakis@cloudless.gr
    - N8N_INSTANCE_OWNER_FIRST_NAME=Admin
    - N8N_INSTANCE_OWNER_LAST_NAME=User
    - N8N_INSTANCE_OWNER_PASSWORD_HASH=$$2b$$12$$LbmiO.nIr3mesTaYZc6yYOaR4VSbSm84OORt.bZAfcXXZ8kWzwifG
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_PUBLIC_API_DISABLED=false
    - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
    - N8N_BASIC_AUTH_ACTIVE=true
    - N8N_BASIC_AUTH_USER=${N8N_USER}
    - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
    - N8N_ENABLED_MODULES=instance-ai
    - N8N_DISABLED_MODULES=mcp
    - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
    - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
    - N8N_INSTANCE_AI_SANDBOX_URL=http://n8n-sandbox:8081
    - N8N_SANDBOX_SERVICE_URL=http://n8n-sandbox:8081
    - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
    - TWITTER_API_URL=https://api.twitter.com/2/tweets
    - N8N_SANDBOX_ENABLED=true
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=false
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    - N8N_WEBHOOK_URL=http://localhost:5678/
    - N8N_WORKFLOW_FILE_SYSTEM=true
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    - N8N_TEMPLATES_ENABLED=false
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    - GENERIC_TIMEZONE=Europe/Athens
    - TZ=Europe/Athens
    # --- Postgres as n8n database backend (shared with stack) ---
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=social-postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=n8n
    - DB_POSTGRESDB_USER=${SOCIAL_POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${SOCIAL_POSTGRES_PASSWORD}
    - DB_POSTGRESDB_SCHEMA=public
    # --- Execution mode (regular = in-process, no separate worker needed) ---
    - EXECUTIONS_MODE=regular
    # --- social-api integration ---
    - SOCIAL_API_URL=http://social-api:8000
    - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL}
    - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD}
    - CLOUDLESS_LINKEDIN_ORG_ACCOUNT_ID=${CLOUDLESS_LINKEDIN_ORG_ACCOUNT_ID:-9c4451bb-e820-489f-8676-76ddbc788ffe}
    - CLOUDLESS_FACEBOOK_ACCOUNT_ID=${CLOUDLESS_FACEBOOK_ACCOUNT_ID:-e280d96f-2807-4150-babe-f388d02bcfba}
    - CLOUDLESS_INSTAGRAM_ACCOUNT_ID=${CLOUDLESS_INSTAGRAM_ACCOUNT_ID:-f216ddec-1953-48b1-8eda-50bbfb34c4e6}
    - CLOUDLESS_TWITTER_ACCOUNT_ID=${CLOUDLESS_TWITTER_ACCOUNT_ID:-a89d6852-eff8-479a-835f-50d806cf59dd}
    - CLOUDLESS_THREADS_ACCOUNT_ID=${CLOUDLESS_THREADS_ACCOUNT_ID:-1071dcd5-1bc9-4770-923c-d897eb124485}
    - CLOUDLESS_TIKTOK_ACCOUNT_ID=${CLOUDLESS_TIKTOK_ACCOUNT_ID:-dcda73fb-75b6-47af-b9d1-c1ba404d91a8}
    - CLOUDLESS_CAROUSEL_TOPIC=${CLOUDLESS_CAROUSEL_TOPIC:-}
    - CLOUDLESS_CAROUSEL_SLIDES=${CLOUDLESS_CAROUSEL_SLIDES:-7}
    - SOCIALAUTO_DIGEST_DAYS=${SOCIALAUTO_DIGEST_DAYS:-1}
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    restart: unless-stopped
  n8n-sandbox:
    image: n8nio/n8n-sandbox-service-sandbox:latest
    container_name: n8n-sandbox
    networks:
    - backend
    environment:
    - N8N_SANDBOX_HOST=0.0.0.0
    - N8N_SANDBOX_PORT=8081
    - N8N_SANDBOX_LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/ 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
    - db
    environment:
    - POSTGRES_DB=${METABASE_DB_DBNAME}
    - POSTGRES_USER=${METABASE_DB_USER}
    - POSTGRES_PASSWORD=${METABASE_DB_PASS}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  metabase:
    image: metabase/metabase:v0.63.14.1
    container_name: metabase
    networks:
    - backend
    - db
    ports:
    - 3000:3000
    volumes:
    - ./storage-user/metadata:/storage/metadata:ro
    environment:
    - MB_DB_TYPE=postgres
    - MB_DB_DBNAME=${METABASE_DB_DBNAME}
    - MB_DB_PORT=5432
    - MB_DB_USER=${METABASE_DB_USER}
    - MB_DB_PASS=${METABASE_DB_PASS}
    - MB_DB_HOST=postgres
    - MB_EMAIL=${MB_EMAIL}
    - MB_PASSWORD=${MB_PASSWORD}
    - MB_ANON_TRACKING_ENABLED=false
    - MB_CHECK_FOR_UPDATES=false
    - MB_LOAD_SAMPLE_CONTENT=false
    - MB_METABOT_ENABLED=false
    # Limit Java heap — analytics dashboard doesn't need the default 1GB.
    - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m
    depends_on:
      postgres:
        condition: service_healthy
    dns:
    - 1.1.1.1
    - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
  local-diffusers:
    build:
      context: ./diffusers-server
      dockerfile: Dockerfile
    container_name: local-diffusers
    networks:
    - backend
    - gpu
    environment:
    - MODEL_ID=${LOCAL_DIFFUSERS_MODEL:-stable-diffusion-v1-5/stable-diffusion-v1-5}
    - HF_TOKEN=${HF_TOKEN}
    - LOAD_ON_STARTUP=true
    - TORCH_DTYPE=float16
    - DEVICE=cuda
    - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    <<: *public-dns
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    volumes:
    - ./diffusers-server/models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: chroma
    networks:
    - backend
    ports:
    - 8001:8000
    volumes:
    - ./.env:/app/.env:ro
    - ./chroma:/chroma/chroma
    command:
    - run
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
    - backend
    ports:
    - 9100:9000
    - 9101:9001
    environment:
    - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
    - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
    - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  languagetool:
    image: erikvl87/languagetool
    container_name: languagetool
    networks:
    - backend
    ports:
    - 8010:8010
    environment:
    # Limit Java heap — spell/grammar check doesn't need 512MB.
    - Java_Xms=128m
    - Java_Xmx=256m
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:2.39.6
    container_name: portainer
    networks:
    - backend
    ports:
    - 9000:9000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    restart: unless-stopped
  env-manager-backend:
    image: baltzakist/cu130-slim-env-manager-backend:v2.417
    pull_policy: if_not_present
    build:
      context: ./env-manager/backend
      dockerfile: Dockerfile
    container_name: env-manager-backend
    networks:
    - backend
    ports:
    - 8081:8081
    volumes:
    - ./.env:/app/.env:rw
    environment:
    - ENV_MANAGER_USER=${ENV_MANAGER_USER}
    - ENV_MANAGER_PASS=${ENV_MANAGER_PASS}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  env-manager-frontend:
    image: baltzakist/cu130-slim-env-manager-frontend:v2.417
    pull_policy: if_not_present
    build:
      context: ./env-manager/frontend
      dockerfile: Dockerfile
    container_name: env-manager-frontend
    networks:
    - backend
    - frontend
    ports:
    - 8080:8080
    depends_on:
      env-manager-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  social-postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    networks:
    - db
    environment:
    - POSTGRES_DB=${SOCIAL_POSTGRES_DB}
    - POSTGRES_USER=${SOCIAL_POSTGRES_USER}
    - POSTGRES_PASSWORD=${SOCIAL_POSTGRES_PASSWORD}
    volumes:
    - social_postgres_data:/var/lib/postgresql/data
    ports:
    - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
    - db
    ports:
    - 6379:6379
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  social-api:
    image: baltzakist/cu130-slim-social-api:v2.417
    pull_policy: if_not_present
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile
    container_name: social-api
    networks:
    - backend
    - db
    ports:
    - 8083:8000
    environment:
    - TZ=Europe/Athens
    - APP_TIMEZONE=Europe/Athens
    - APP_ENV=development
    - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB}
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - ACCESS_TOKEN_EXPIRE_MINUTES=30
    - REFRESH_TOKEN_EXPIRE_DAYS=7
    - N8N_API_URL=http://n8n:5678
    - N8N_API_KEY=${N8N_API_KEY}
    - N8N_USER=${N8N_USER}
    - N8N_PASSWORD=${N8N_PASSWORD}
    - COMFYUI_URL=http://comfyui:8000
    - DMR_URL=${DMR_URL:-http://host.docker.internal:12434/engines/llama.cpp/v1}
    - DMR_TEXT_MODEL=${DMR_TEXT_MODEL:-ai/qwen3:8b-q4_K_M}
    - DMR_VISION_MODEL=${DMR_VISION_MODEL:-ai/qwen3-vl}
    - DMR_EMBEDDING_MODEL=${DMR_EMBEDDING_MODEL:-ai/qwen3-embedding}
    - DMR_TINY_MODEL=${DMR_TINY_MODEL:-ai/smollm2}
    - LOCAL_DIFFUSERS_URL=http://local-diffusers:7860
    - LOCAL_DIFFUSERS_MODEL=${LOCAL_DIFFUSERS_MODEL:-stable-diffusion-v1-5/stable-diffusion-v1-5}
    - CHROMA_URL=http://chroma:8000
    - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
    - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
    - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-https://social.cloudless.gr/api/v1/auth/oauth/linkedin/callback}
    - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID}
    - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET}
    - TWITTER_REDIRECT_URI=${TWITTER_REDIRECT_URI:-https://social.cloudless.gr/api/v1/auth/oauth/twitter/callback}
    - INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID}
    - INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET}
    - INSTAGRAM_REDIRECT_URI=${INSTAGRAM_REDIRECT_URI:-https://social.cloudless.gr/api/v1/auth/oauth/instagram/callback}
    - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
    - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
    - FACEBOOK_REDIRECT_URI=${FACEBOOK_REDIRECT_URI:-https://social.cloudless.gr/api/v1/auth/oauth/facebook/callback}
    - THREADS_CLIENT_ID=${THREADS_CLIENT_ID}
    - THREADS_CLIENT_SECRET=${THREADS_CLIENT_SECRET}
    - THREADS_REDIRECT_URI=${THREADS_REDIRECT_URI:-https://social.cloudless.gr/api/v1/auth/oauth/threads/callback}
    - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
    - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
    - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-https://social.cloudless.gr/api/v1/auth/oauth/tiktok/callback}
    - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL}
    - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD}
    - SOCIAL_ADMIN_NAME=${SOCIAL_ADMIN_NAME}
    - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
    - D1_SOCIAL_AUTOMATION_ID=${D1_SOCIAL_AUTOMATION_ID:-}
    - D1_N8N_ID=${D1_N8N_ID:-}
    - D1_METABASE_ID=${D1_METABASE_ID:-}
    - KV_CACHE_NAMESPACE=${KV_CACHE_NAMESPACE:-}
    - KV_QUEUE_NAMESPACE=${KV_QUEUE_NAMESPACE:-}
    - VECTORIZE_INDEX_NAME=${VECTORIZE_INDEX_NAME:-social-embeddings}
    - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
    - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-C0BT263L17U}
    - SLACK_DIGEST_HOUR=${SLACK_DIGEST_HOUR:-9}
    - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
    - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USER=${SMTP_USER:-resend}
    - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    - SMTP_SSL_VERIFY=${SMTP_SSL_VERIFY:-true}
    - SMTP_FROM=${SMTP_FROM:-noreply@cloudless.gr}
    - DIGEST_EMAIL_TO=${DIGEST_EMAIL_TO:-tbaltzakis@cloudless.gr}
    - DIGEST_EMAIL_ISSUES_ONLY=${DIGEST_EMAIL_ISSUES_ONLY:-false}
    - CLOUDFLARE_EMAIL_API_TOKEN=${CLOUDFLARE_EMAIL_API_TOKEN:-}
    - TWITTER_API_KEY=${TWITTER_API_KEY:-}
    - TWITTER_API_SECRET=${TWITTER_API_SECRET:-}
    - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN:-}
    - TWITTER_ACCESS_TOKEN_SECRET=${TWITTER_ACCESS_TOKEN_SECRET:-}
    - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
    - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    - GROQ_API_KEY=${GROQ_API_KEY:-}
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
    - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    - COHERE_API_KEY=${COHERE_API_KEY:-}
    - PIXAZO_API_KEY=${PIXAZO_API_KEY:-}
    - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-}
    - LANGUAGETOOL_URL=http://languagetool:8010
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
    - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    - MINIO_BUCKET=social-media
    - MINIO_SECURE=false
    - CLOUDFLARE_AI_API_TOKEN=${CLOUDFLARE_AI_API_TOKEN:-}
    - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
    - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
    - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
    - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
    - R2_S3_ENDPOINT=${R2_S3_ENDPOINT:-}
    # Instagram Private API sidecar (aiograpi-rest)
    - INSTAGRAM_PRIVATE_API_URL=http://instagram-private-api:8000
    - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME:-}
    - INSTAGRAM_PASSWORD=${INSTAGRAM_PASSWORD:-}
    # Residential/mobile proxy for Instagram (prevents challenge_required
    # from datacenter IPs). Default: Cloudflare WARP SOCKS5 proxy.
    - INSTAGRAM_PROXY=${INSTAGRAM_PROXY:-socks5://warp-proxy:1080}
    # Browser + noVNC bridge (visual social logins)
    - BROWSER_BRIDGE_URL=http://browser-novnc:9223
    # TikTok Browser Automation sidecar (Playwright)
    - TIKTOK_BROWSER_SIDECAR_URL=http://tiktok-browser-sidecar:9224
    # LinkedIn Browser Automation sidecar (Playwright)
    - LINKEDIN_BROWSER_SIDECAR_URL=http://linkedin-browser-sidecar:9225
    - LINKEDIN_MCP_SERVER_URL=http://linkedin-mcp-server:9227/mcp
    - AIRBYTE_MCP_SERVER_URL=http://airbyte-mcp-server:9228/mcp
    # Facebook Browser Automation sidecar (Playwright)
    # Personal-profile posting + profile edits the Graph API does not support.
    - FACEBOOK_BROWSER_SIDECAR_URL=http://facebook-browser-sidecar:9226
    volumes:
    - ./.env:/app/.env:ro
    - ./social-automation/backend/app:/app/app
    - ./social-automation/backend/alembic:/app/alembic
    - ./social-automation/uploads:/app/uploads
    - tunnel_url:/run/tunnel
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
      comfyui:
        condition: service_healthy
      chroma:
        condition: service_healthy
      minio:
        condition: service_healthy
      instagram-private-api:
        condition: service_healthy
    dns:
    - 1.1.1.1
    - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  # ── Celery workers (queue-dedicated) ──────────────────────────────────────
  # Three worker containers, each consuming a dedicated queue so time-sensitive
  # publishing tasks are never blocked by CPU-heavy media/AI work:
  #   social-worker-publishing — conc=3 (I/O-bound API calls, time-sensitive)
  #   social-worker-media      — conc=2, max-tasks-per-child=50 (CPU-heavy, recycle RAM)
  #   social-worker-default    — conc=2, max-tasks-per-child=200 (light tasks)
  # Total: 7 concurrent prefork processes across 3 containers.
  # celery-beat (below) schedules tasks into the routed queues.
  social-worker-publishing:
    image: baltzakist/cu130-slim-social-worker:v2.417
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile.worker
    container_name: social-worker-publishing
    networks:
    - backend
    - db
    environment: *worker-env
    volumes: *worker-volumes
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on: *worker-depends
    <<: *public-dns
    # conc=3: publishing is I/O-bound (LinkedIn/Twitter/Meta API calls), low
    # RAM per process (~120MB).  3 slots ensure "publish now" is never blocked
    # by a long process_publish_queue run.  max-tasks-per-child=200: light
    # tasks, recycle infrequently to avoid churn.
    command: celery -A app.worker.celery_app worker -Q publishing --loglevel=info --concurrency=3 --max-tasks-per-child=200 --hostname=publishing@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d publishing@$$HOSTNAME | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  social-worker-media:
    image: baltzakist/cu130-slim-social-worker:v2.417
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile.worker
    container_name: social-worker-media
    networks:
    - backend
    - db
    environment: *worker-env
    volumes: *worker-volumes
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on: *worker-depends
    <<: *public-dns
    # conc=2: media tasks are CPU/RAM-heavy (Pillow, AI calls).  max-tasks-per-
    # child=50: recycle processes more often to release fragmented Pillow/AI
    # memory on this 8GB-RAM host.
    command: celery -A app.worker.celery_app worker -Q media --loglevel=info --concurrency=2 --max-tasks-per-child=50 --hostname=media@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d media@$$HOSTNAME | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  social-worker-default:
    image: baltzakist/cu130-slim-social-worker:v2.417
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile.worker
    container_name: social-worker-default
    networks:
    - backend
    - db
    environment: *worker-env
    volumes: *worker-volumes
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on: *worker-depends
    <<: *public-dns
    # -Q default,celery catches both routed "default" tasks and any unrouted
    # task.  conc=2, max-tasks-per-child=200: analytics/workflows/digests are
    # I/O-bound with short bursts, recycle infrequently.
    command: celery -A app.worker.celery_app worker -Q default,celery --loglevel=info --concurrency=2 --max-tasks-per-child=200 --hostname=default@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d default@$$HOSTNAME | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  celery-beat:
    image: baltzakist/cu130-slim-social-worker:v2.417
    pull_policy: always
    build:
      context: ./social-automation/backend
      dockerfile: Dockerfile.worker
    container_name: celery-beat
    networks:
    - backend
    - db
    environment: *worker-env
    volumes:
    - ./.env:/app/.env:ro
    - ./social-automation/backend/app:/app/app
    extra_hosts:
    - host.docker.internal:host-gateway
    command: celery -A app.worker.celery_app beat --loglevel=info --scheduler=celery.beat:PersistentScheduler
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *public-dns
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys; sys.exit(0 if any(b'beat' in open(f'/proc/{p}/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
  cloudflared:
    image: baltzakist/cloudflared:v0.2
    pull_policy: always
    container_name: social-cloudflared
    networks:
    - backend
    - default
    environment:
    - SOCIAL_TUNNEL_TOKEN=${SOCIAL_TUNNEL_TOKEN:-}
    volumes:
    - tunnel_url:/run/tunnel
    - ./social-automation/cloudflared-entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # pgrep alone stays "healthy" while cloudflared is disconnected from the
      # edge; the metrics gauge only exceeds 0 when tunnel connections exist.
      test: ["CMD-SHELL", "pgrep -f cloudflared >/dev/null && curl -sf http://localhost:20241/metrics | grep -Eq 'cloudflared_tunnel_ha_connections [1-9]'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      social-api:
        condition: service_healthy

  social-frontend:
    image: baltzakist/cu130-slim-social-frontend:v2.417
    pull_policy: always
    build:
      context: ./social-automation/frontend
      dockerfile: Dockerfile.dev
    container_name: social-frontend
    ports:
    - 8082:8083
    environment:
    - TZ=Europe/Athens
    - NEXT_PUBLIC_APP_TIMEZONE=Europe/Athens
    - API_INTERNAL_URL=http://social-api:8000
    - NEXT_PUBLIC_API_URL=https://social.cloudless.gr/api/v1
    - PORT=8083
    - HOSTNAME=0.0.0.0
    volumes:
    - ./social-automation/frontend:/app
    - /app/node_modules
    - /app/.next
    networks:
    - backend
    - frontend
    depends_on:
      social-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Instagram Private API sidecar (aiograpi-rest) ────────────────────────
  # RESTful HTTP wrapper around aiograpi (async Instagram private mobile API).
  # Enables profile writes (bio, picture, name, website, phone) that the
  # official Graph API does not support.  Runs on internal port 8000, exposed
  # as 8011 on the host for diagnostics.  Session files persist in a named
  # volume so Instagram login survives container restarts.
  instagram-private-api:
    image: subzeroid/aiograpi-rest:latest
    build:
      context: ./instagram-private-api
      dockerfile: Dockerfile
    container_name: instagram-private-api
    networks:
    - backend
    ports:
    - 8011:8000
    environment:
    - TZ=Europe/Athens
    - AIOGRAPI_REST_DB_PATH=/data/db.json
    volumes:
    - instagram_sessions:/data
    - ./social-automation/uploads:/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    <<: *public-dns

  # ── Cloudflare WARP proxy (residential IP for Instagram sidecar) ───────────
  # Provides a SOCKS5 proxy on port 1080 that routes traffic through
  # Cloudflare WARP, giving the Instagram sidecar a non-datacenter IP
  # to avoid challenge_required from Instagram's anti-abuse system.
  # Free, no account required. Uses WireGuard tunnel via wgcf.
  warp-proxy:
    image: caomingjun/warp
    container_name: warp-proxy
    networks:
    - backend
    ports:
    - 1080:1080
    environment:
    - WARP_SLEEP=2
    - TZ=Europe/Athens
    device_cgroup_rules:
    - 'c 10:200 rwm'
    cap_add:
    - MKNOD
    - AUDIT_WRITE
    - NET_ADMIN
    sysctls:
    - net.ipv6.conf.all.disable_ipv6=0
    - net.ipv4.conf.all.src_valid_mark=1
    volumes:
    - warp_data:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD-SHELL", "curl --socks5-hostname 127.0.0.1:1080 -sL https://cloudflare.com/cdn-cgi/trace | grep -q 'warp=on' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Browser + noVNC container (visual browser for social logins) ─────────
  # Provides a headed Chromium browser accessible via web browser (noVNC)
  # and an HTTP bridge API for the SocialAuto backend to start sessions,
  # check status, and extract cookies after visual login.
  # Supported platforms: instagram, facebook, linkedin, tiktok, twitter,
  #   threads, reddit, youtube, pinterest, tumblr, medium, discord,
  #   telegram, whatsapp
  browser-novnc:
    build:
      context: ./browser-novnc
      dockerfile: Dockerfile
    container_name: browser-novnc
    networks:
    - backend
    ports:
    - 6080:6080    # noVNC web interface (for iframe embedding)
    - 5900:5900    # VNC (desktop client)
    - 9223:9223    # Bridge API (for social-api)
    - 6081:6081    # Audio WebSocket (for noVNC audio)
    environment:
    - SCREEN_WIDTH=1280
    - SCREEN_HEIGHT=800
    - SCREEN_DEPTH=24
    - VNC_PORT=5900
    - NOVNC_PORT=6080
    - BRIDGE_PORT=9223
    - AUDIO_WS_PORT=6081
    - TZ=Europe/Athens
    volumes:
    - browser_cookies:/app/cookies
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9223/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── TikTok Browser Automation sidecar (Playwright) ───────────────────────
  # RESTful HTTP wrapper around Playwright for TikTok profile settings that
  # the official Display API does not expose: privacy toggles, notification
  # preferences, ad settings, accessibility, business verification form.
  # Captcha-gated writes (bio, avatar, nickname) are NOT supported.
  # Session cookie is injected at runtime via the /session endpoint.
  tiktok-browser-sidecar:
    build:
      context: ./tiktok-browser-sidecar
      dockerfile: Dockerfile
    container_name: tiktok-browser-sidecar
    networks:
    - backend
    ports:
    - 9224:9224
    environment:
    - TIKTOK_SIDECAR_PORT=9224
    - TZ=Europe/Athens
    volumes:
    - tiktok_browser_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9224/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    <<: *public-dns

  # ── LinkedIn Browser Automation sidecar (Playwright) ──────────────────────
  # RESTful HTTP wrapper around Playwright for LinkedIn profile management
  # that the official API does not expose: headline, about, cover photo,
  # profile picture, website, location, experience, education, skills,
  # and Company Page management (about, logo, cover, specialties).
  # Browser session is injected via POST /session with storage_state.
  linkedin-browser-sidecar:
    build:
      context: ./linkedin-browser-sidecar
      dockerfile: Dockerfile
    container_name: linkedin-browser-sidecar
    networks:
    - backend
    ports:
    - 9225:9225
    environment:
    - LINKEDIN_SIDECAR_PORT=9225
    - TZ=Europe/Athens
    volumes:
    - linkedin_browser_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9225/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    <<: *public-dns

  # ── LinkedIn MCP Server (read/search/messaging) ───────────────────────────
  # Complements the linkedin-browser-sidecar (which handles writes/posting).
  # Uses stickerdaniel/linkedin-mcp-server with streamable-http transport.
  # Session is stored in linkedin_mcp_data volume and shared with the sidecar.
  linkedin-mcp-server:
    image: stickerdaniel/linkedin-mcp-server:latest
    container_name: linkedin-mcp-server
    networks:
    - backend
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "9227", "--path", "/mcp"]
    ports:
    - 9227:9227
    environment:
    - TRANSPORT=streamable-http
    - HOST=0.0.0.0
    - PORT=9227
    - HTTP_PATH=/mcp
    - TZ=Europe/Athens
    - TOOL_TIMEOUT=300
    - BROWSER_IDLE_TIMEOUT=0
    - LINKEDIN_COOKIE=${LINKEDIN_COOKIE:-}
    volumes:
    - linkedin_mcp_data:/home/pwuser/.linkedin-mcp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',9227)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    <<: *public-dns

  # ── Airbyte MCP Server (data connectors: FB Marketing, etc.) ──────────────
  # Wraps the official airbyte-mcp with streamable-http transport.
  # Provides tools to list/run Airbyte connectors (Facebook Marketing, Stripe,
  # Postgres, etc.) from SocialAuto. Requires connector credentials in env.
  airbyte-mcp-server:
    build:
      context: ./airbyte-mcp-server
      dockerfile: Dockerfile
    container_name: airbyte-mcp-server
    networks:
    - backend
    ports:
    - 9228:9228
    - 9229:9229
    environment:
    - AIRBYTE_MCP_PORT=9228
    - AIRBYTE_MCP_HEALTH_PORT=9229
    - AIRBYTE_MCP_HOST=0.0.0.0
    - AIRBYTE_PROJECT_DIR=/data
    - AIRBYTE_MCP_SAFE_MODE=1
    - AIRBYTE_CLOUD_MCP_READONLY_MODE=0
    - TZ=Europe/Athens
    - AIRBYTE_CLOUD_CLIENT_ID=${AIRBYTE_CLOUD_CLIENT_ID:-}
    - AIRBYTE_CLOUD_CLIENT_SECRET=${AIRBYTE_CLOUD_CLIENT_SECRET:-}
    - AIRBYTE_CLOUD_WORKSPACE_ID=${AIRBYTE_CLOUD_WORKSPACE_ID:-}
    # Facebook Marketing connector credentials
    - FB_MARKETING_ACCESS_TOKEN=${FB_MARKETING_ACCESS_TOKEN:-}
    - FB_MARKETING_AD_ACCOUNT_ID=${FB_MARKETING_AD_ACCOUNT_ID:-}
    - FB_MARKETING_APP_ID=${FB_MARKETING_APP_ID:-}
    - FB_MARKETING_APP_SECRET=${FB_MARKETING_APP_SECRET:-}
    volumes:
    - airbyte_mcp_data:/data
    - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9229/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    <<: *public-dns

  # ── Facebook Browser Automation sidecar (Playwright) ──────────────────────
  # RESTful HTTP wrapper around Playwright for Facebook personal-profile
  # operations that the official Graph API does not support: personal-profile
  # posting (text/photo/link/video), bio edits, profile picture, cover photo,
  # and website.  Also supports Page-mode posting via /page/* endpoints.
  # Browser session is injected via POST /session with storage_state.
  facebook-browser-sidecar:
    build:
      context: ./facebook-browser-sidecar
      dockerfile: Dockerfile
    container_name: facebook-browser-sidecar
    networks:
    - backend
    ports:
    - 9226:9226
    environment:
    - FACEBOOK_SIDECAR_PORT=9226
    - TZ=Europe/Athens
    volumes:
    - facebook_browser_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9226/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    <<: *public-dns

volumes:
  portainer_data: null
  postgres_data: null
  social_postgres_data: null
  redis_data: null
  tunnel_url: null
  browser_cookies: null
  minio_data: null
  instagram_sessions: null
  warp_data: null
  tiktok_browser_data: null
  linkedin_browser_data: null
  linkedin_mcp_data: null
  facebook_browser_data: null
  airbyte_mcp_data: null

# Explicit network topology (restored 2026-09-06 to match runtime state).
# Names are pinned so compose adopts the existing networks instead of
# creating project-prefixed ones. `default` is the implicit project network
# (cu130-slim_default) used by social-frontend / comfyui / cloudflared.
networks:
  backend:
    name: cu130-backend
  db:
    name: cu130-db
