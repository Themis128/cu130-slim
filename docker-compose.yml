# Shared volumes for all worker containers.
x-worker-volumes: &worker-volumes
  - ./.env:/app/.env:ro
  - ./social-automation/backend/app:/app/app
  # Live test tree — lets pytest run against the mounted source instead of
  # the stale copy baked into the image.
  - ./social-automation/backend/tests:/app/tests
  # Ops CLIs (meta_tool, linkedin_tool, x_tool, tiktok_tool, bluesky_tool,
  # slack_tool, monetization_tool, viber_tool, dedup_scan) — read-only.
  - ./social-automation/backend/scripts:/app/scripts:ro
  - ./social-automation/backend/dbt:/app/dbt
  - ./social-automation/backend/mlruns:/app/mlruns
  - ./social-automation/uploads:/app/uploads
  # Skill tooling + repo env for host-side scripts (gmail-ops, human-gate,
  # devapp watchers) — read-only; lets containerized tasks call them.
  - ./.devin:/repo/.devin:ro
  - ./.env:/repo/.env:ro
  - tunnel_url:/run/tunnel
  # Kakkava doctrine corpus — read-only mount; kakkava_sync re-walks it
  # daily and embeds chunks into team_<id>_doctrine for copy grounding.
  - "/mnt/c/Users/tbaltzakis/OneDrive/Kakkava Sofia:/mnt/kakkava:ro"
  # Report notebooks — papermill executes /notebooks/reports/*.ipynb inside
  # workers; rendered outputs go to /notebooks/output (visible in Jupyter
  # at work/output since the same host dir is mounted there).
  - ./notebooks:/notebooks

# Shared depends_on for all worker containers.
x-worker-depends: &worker-depends
  social-postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  n8n:
    condition: service_healthy
  # comfyui intentionally absent: workers reach it through the stack-ops
  # wake proxy (COMFYUI_URL=http://stack-ops:8199); a depends_on here would
  # force-start the GPU container on every worker recreate.
  chroma:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  comfyui:
    image: ghcr.io/themis128/cu130-slim:comfyui-latest
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-media-comfyui-gpu
    init: true  # reaps zombie PIDs — the 2026-10-06 FLUX job left the container unkillable
    networks:
      - backend
      - gpu
    volumes:
      - ./.env:/app/.env:ro
      - ./comfyui/profiles:/opt/ComfyUI/profiles:ro
      - ./storage-user/custom_nodes:/home/user/ComfyUI/custom_nodes
      - ./storage-models/models:/home/user/ComfyUI/models
      - ./storage-user/metadata:/home/user/ComfyUI/metadata
      - ./storage-user/user:/home/user/ComfyUI/user
      - ./storage-user/output:/home/user/ComfyUI/output
      - ./storage-user/input:/home/user/ComfyUI/input
    environment:
      # ── GPU sharing: ComfyUI + local-diffusers coexist on 8GB RTX 3070 ───
      # Profile files live in ./comfyui/profiles and are bind-mounted into
      # /opt/ComfyUI/profiles. The entrypoint reads the selected profile and
      # appends it to the base listen args. Override with CLI_ARGS if needed.
      - COMFYUI_PROFILE=flux
      - CLI_ARGS=
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - FAL_KEY=${FAL_KEY}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:128
    <<: *public-dns
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    # Bound RAM/CPU — was the only uncapped service in the stack. A large
    # generation job could push the 20GB WSL VM into OOM-killing siblings.
    mem_limit: 8g
    memswap_limit: 12g
    cpus: '6'
  n8n:
    image: n8nio/n8n:2.43.4
    container_name: n8n
    networks:
      - backend
      - db
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./storage-user/metadata:/home/node/.n8n/storage/metadata
      - ./comfyui-workflows:/workflows:ro
      - ./scripts:/scripts:ro
    <<: *public-dns
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # n8n-sandbox intentionally absent: it is idle-slept and wake-proxied
      # via stack-ops (N8N_*_SANDBOX_URL=http://stack-ops:8081); a depends_on
      # would force-start it on every `compose up n8n`.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=tbaltzakis@cloudless.gr
      - N8N_INSTANCE_OWNER_FIRST_NAME=Admin
      - N8N_INSTANCE_OWNER_LAST_NAME=User
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=$$2b$$12$$LbmiO.nIr3mesTaYZc6yYOaR4VSbSm84OORt.bZAfcXXZ8kWzwifG
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_ENABLED_MODULES=instance-ai
      - N8N_DISABLED_MODULES=mcp
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_INSTANCE_AI_SANDBOX_URL=http://stack-ops:8081
      - N8N_INSTANCE_AI_MODEL=${N8N_INSTANCE_AI_MODEL:-hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}
      - N8N_INSTANCE_AI_MODEL_URL=${N8N_INSTANCE_AI_MODEL_URL:-http://host.docker.internal:12435/engines/llama.cpp/v1}
      - N8N_INSTANCE_AI_MODEL_API_KEY=${N8N_INSTANCE_AI_MODEL_API_KEY:-dmr-local}
      - OPENAI_BASE_URL=${N8N_INSTANCE_AI_MODEL_URL:-http://host.docker.internal:12435/engines/llama.cpp/v1}
      - N8N_SANDBOX_SERVICE_URL=http://stack-ops:8081
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
      - TWITTER_API_URL=https://api.twitter.com/2/tweets
      - N8N_SANDBOX_ENABLED=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=false
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_WORKFLOW_FILE_SYSTEM=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Nextcloud app password for IntraVox API calls from workflows
      # (digest → intranet news). Basic auth is computed in-node.
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME}
      - NEXTCLOUD_APP_PASSWORD=${NEXTCLOUD_APP_PASSWORD}
      - GENERIC_TIMEZONE=Europe/Athens
      - TZ=Europe/Athens
      # --- Postgres as n8n database backend (shared with stack) ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=social-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${SOCIAL_POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${SOCIAL_POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public
      # --- Execution mode (regular = in-process, no separate worker needed) ---
      - EXECUTIONS_MODE=regular
      # --- Durable scheduler: DB-backed schedule queue; a restart no longer
      # drops pending runs and missed runs fire within their grace period.
      # Available since n8n 2.36 (on-by-default from 2.45). Needs
      # N8N_USE_WORKFLOW_PUBLICATION_SERVICE (default true in 2.x).
      - N8N_SCHEDULER_ENABLED=true
      # --- Execution bounds (data-driven 2026-10-20: ~100 execs/day,
      # p95 ≈ 25min for ComfyUI/TikTok pipelines). 1h global default;
      # long-waiting workflows (linkedin-dm-deferred-reply) override up to
      # 24h via settings.executionTimeout. ---
      - EXECUTIONS_TIMEOUT=3600
      - EXECUTIONS_TIMEOUT_MAX=86400
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=10
      # --- Execution-data retention: 7 days / 2000 rows (~2 weeks of
      # headroom at current volume). Slack error alerts + SocialAuto
      # post_targets are the durable audit trail, not n8n history. ---
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=2000
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      # --- Prometheus /metrics (localhost-only; exposed to LAN via the
      # n8n-metrics proxy service on :9392 for the omv Prometheus job) ---
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_SCHEDULER_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_INCLUDE_API_ENDPOINTS=true
      # --- Task runners: external mode (internal is deprecated and
      # insecure — runner code shares the n8n uid). Code-node JS executes
      # in the n8n-task-runner sidecar; NODE_FUNCTION_ALLOW_BUILTIN lives
      # in its /etc/task-runners.json (crypto+moment allowed by default).
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_TASK_TIMEOUT=300
      # --- Pin defaults the startup log flags for future change ---
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000
      # --- social-api integration ---
      - SOCIAL_API_URL=http://social-api:8000
      - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL}
      - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD}
      - SOCIAL_TOTP_SECRET=${SOCIAL_TOTP_SECRET:-}
      # X-Service-Token for POST /api/v1/newsletter/linkedin/issue
      - NEWSLETTER_SERVICE_TOKEN=${NEWSLETTER_SERVICE_TOKEN:-}
      # chat.postMessage → #newsletter channel (no dedicated webhook exists)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_NEWSLETTER_CHANNEL_ID=${SLACK_NEWSLETTER_CHANNEL_ID:-C0C1B8PMTUN}
      # chat.postMessage → #socialauto-alerts for workflow error notifications
      - SLACK_ALERTS_CHANNEL_ID=${SLACK_ALERTS_CHANNEL_ID:-C0C1D46212N}
      - CLOUDLESS_LINKEDIN_ORG_ACCOUNT_ID=${CLOUDLESS_LINKEDIN_ORG_ACCOUNT_ID:-9c4451bb-e820-489f-8676-76ddbc788ffe}
      - CLOUDLESS_FACEBOOK_ACCOUNT_ID=${CLOUDLESS_FACEBOOK_ACCOUNT_ID:-e280d96f-2807-4150-babe-f388d02bcfba}
      - CLOUDLESS_INSTAGRAM_ACCOUNT_ID=${CLOUDLESS_INSTAGRAM_ACCOUNT_ID:-38ddbd44-8811-4d0b-be62-a23fd2f50490}
      - CLOUDLESS_TWITTER_ACCOUNT_ID=${CLOUDLESS_TWITTER_ACCOUNT_ID:-a89d6852-eff8-479a-835f-50d806cf59dd}
      - CLOUDLESS_THREADS_ACCOUNT_ID=${CLOUDLESS_THREADS_ACCOUNT_ID:-1071dcd5-1bc9-4770-923c-d897eb124485}
      - CLOUDLESS_TIKTOK_ACCOUNT_ID=${CLOUDLESS_TIKTOK_ACCOUNT_ID:-dcda73fb-75b6-47af-b9d1-c1ba404d91a8}
      - CLOUDLESS_CAROUSEL_TOPIC=${CLOUDLESS_CAROUSEL_TOPIC:-}
      - CLOUDLESS_CAROUSEL_SLIDES=${CLOUDLESS_CAROUSEL_SLIDES:-7}
      - SOCIALAUTO_DIGEST_DAYS=${SOCIALAUTO_DIGEST_DAYS:-1}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_ALERTS_WEBHOOK_URL=${SLACK_ALERTS_WEBHOOK_URL:-}
      - N8N_ERROR_SLACK_WEBHOOK_URL=${N8N_ERROR_SLACK_WEBHOOK_URL:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 768m
    memswap_limit: 2560m
    cpus: '3'
    restart: unless-stopped
  # External JS/Python task runners for n8n Code nodes (external mode —
  # internal mode is deprecated and shares the n8n uid). Launcher + runners
  # connect to the n8n task broker on n8n:5679 with the shared auth token.
  # Image version MUST match n8nio/n8n. The stock /etc/task-runners.json in
  # this image already allowlists crypto+moment builtins for our Code nodes.
  n8n-task-runner:
    image: n8nio/runners:2.43.4
    pull_policy: if_not_present
    container_name: n8n-task-runner
    init: true
    networks:
      - backend
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_TASK_TIMEOUT=300
      # Keep the JS runner warm 60s between tasks (default 15s re-spawns too
      # eagerly for our TOTP-on-every-publish cadence).
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=60
      - GENERIC_TIMEZONE=Europe/Athens
      - TZ=Europe/Athens
      # The launcher's nested tini can't be PID 1; register as subreaper so
      # spawned tasks' zombies get reaped (was crash-looping on build-up).
      - TINI_SUBREAPER=true
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      # Launcher health endpoint.
      test: ["CMD-SHELL", "wget -qO- http://localhost:5680/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: '2'
    restart: unless-stopped
    <<: *public-dns
  # Metrics-only LAN endpoint — proxies ONLY n8n /metrics on :9392 so the
  # omv Prometheus can scrape it without opening the n8n API/UI on the LAN.
  # Same pattern as social-metrics (:9390 → social-api). Add a scrape
  # target for <host-lan-ip>:9392 in the Prometheus config.
  n8n-metrics:
    image: nginx:1.27-alpine
    pull_policy: if_not_present
    container_name: n8n-metrics
    networks:
      - backend
    ports:
      - 9392:80
    volumes:
      - ./deploy/nginx/n8n-metrics.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/metrics | head -1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    memswap_limit: 256m
    cpus: '1'
    restart: unless-stopped
    <<: *public-dns
  n8n-sandbox:
    image: n8nio/n8n-sandbox-service-sandbox:latest
    container_name: n8n-sandbox
    networks:
      - backend
    environment:
      - N8N_SANDBOX_HOST=0.0.0.0
      - N8N_SANDBOX_PORT=8081
      - N8N_SANDBOX_LOG_LEVEL=info
    healthcheck:
      # Daemon serves /healthz (returns {"status":"ok"}); / returns wget RC 8,
      # which permanently marked the container unhealthy despite working fine.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/healthz 2>/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: '2'
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - db
    environment:
      - POSTGRES_DB=${METABASE_DB_DBNAME}
      - POSTGRES_USER=${METABASE_DB_USER}
      - POSTGRES_PASSWORD=${METABASE_DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: '2'
    restart: unless-stopped
  metabase:
    image: metabase/metabase:v0.63.14.1
    container_name: metabase
    networks:
      - backend
      - db
    volumes:
      - ./storage-user/metadata:/storage/metadata:ro
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=${METABASE_DB_DBNAME}
      - MB_DB_PORT=5432
      - MB_DB_USER=${METABASE_DB_USER}
      - MB_DB_PASS=${METABASE_DB_PASS}
      - MB_DB_HOST=postgres
      - MB_EMAIL=${MB_EMAIL}
      - MB_PASSWORD=${MB_PASSWORD}
      - MB_ANON_TRACKING_ENABLED=false
      - MB_CHECK_FOR_UPDATES=false
      - MB_LOAD_SAMPLE_CONTENT=false
      - MB_METABOT_ENABLED=false
      # Limit Java heap — analytics dashboard doesn't need the default 1GB.
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 1536m
    memswap_limit: 3072m
    cpus: '2'
    restart: unless-stopped
  local-diffusers:
    build:
      context: ./diffusers-server
      dockerfile: Dockerfile
    container_name: local-diffusers
    # Dormant profile: excluded from default `docker compose up` so the retired
    # SD 1.5 service can't resurrect on stack restarts or reserve the GPU.
    # Run explicitly: docker compose --profile local-diffusers up -d local-diffusers
    profiles:
      - local-diffusers
    networks:
      - backend
      - gpu
    environment:
      - MODEL_ID=${LOCAL_DIFFUSERS_MODEL:-stable-diffusion-v1-5/stable-diffusion-v1-5}
      - HF_TOKEN=${HF_TOKEN}
      # Retired 2026-10-05: SD 1.5 superseded by ComfyUI FLUX.1-schnell GGUF;
      # keeping it loaded permanently cost ~1.5-2GB VRAM on the 8GB card.
      # Service remains defined for manual/dormant use — not in any chain.
      - LOAD_ON_STARTUP=false
      - TORCH_DTYPE=float16
      - DEVICE=cuda
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
    <<: *public-dns
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    volumes:
      - ./diffusers-server/models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    # Memory cap — model load spikes are fine, runaway creep is not (VM-wide wedge risk).
    mem_limit: 4608m
    memswap_limit: 9216m
    cpus: '2'
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: chroma
    networks:
      - backend
    ports:
      - 127.0.0.1:8001:8000
    volumes:
      - ./.env:/app/.env:ro
      - ./chroma:/chroma/chroma
    command:
      - run
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    memswap_limit: 1536m
    cpus: '2'
    restart: unless-stopped
  minio:
