server:
  http_listen_port: 9080
clients:
  # Push target is templated from LOKI_PUSH_URL (compose env) so the
  # collector can never drift from the worker's LOKI_URL read side —
  # keep the two pointed at the same Loki deployment.
  - url: ${LOKI_PUSH_URL}/loki/api/v1/push
positions:
  # Persisted on a bind-mounted volume so a container recreate resumes
  # the cursor instead of replaying retained Docker logs.
  filename: /var/lib/promtail/positions.yaml
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      # Reaches the daemon through the minimal-permission socket proxy —
      # the collector never holds the real docker.sock.
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service_name'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
