# Headless Service + static Endpoints pointing at the n8n-metrics nginx
# container on the Docker host (the compose service proxies ONLY /metrics from
# the loopback-bound n8n — see docker-compose.yml "n8n-metrics").
# The Endpoints IP is the workstation LAN address Prometheus reaches; update it
# here if the host moves. Mirror of deploy/monitoring/socialauto/service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: n8n-metrics
  namespace: monitoring
  labels:
    app: n8n
    component: metrics
    release: kube-prom
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9392
      protocol: TCP
      targetPort: 9392
---
apiVersion: v1
kind: Endpoints
metadata:
  name: n8n-metrics
  namespace: monitoring
  labels:
    app: n8n
    component: metrics
subsets:
  - addresses:
      - hostname: office-1
        ip: 192.168.1.23
    ports:
      - name: metrics
        port: 9392
        protocol: TCP
