apiVersion: v1
kind: Service
metadata:
  name: espocrm-exporter
  namespace: espocrm
  labels:
    app: espocrm-exporter
    component: metrics
    release: kube-prom
spec:
  selector:
    app: espocrm-exporter
  ports:
    - name: metrics
      port: 8080
      protocol: TCP
      targetPort: 8080
