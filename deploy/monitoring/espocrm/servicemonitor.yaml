apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: espocrm
  namespace: monitoring
  labels:
    app: espocrm-exporter
    release: kube-prom
spec:
  namespaceSelector:
    matchNames:
      - espocrm
  selector:
    matchLabels:
      app: espocrm-exporter
      component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
      # /metrics is Bearer-token gated (exporter env METRICS_TOKEN); the token
      # lives in this namespace via espocrm-exporter-metrics-token (apply.sh).
      authorization:
        type: Bearer
        credentials:
          name: espocrm-exporter-metrics-token
          key: token
      relabelings:
        - targetLabel: job
          replacement: espocrm
