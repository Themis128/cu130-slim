apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: espocrm
  namespace: monitoring
  labels:
    app: espocrm-exporter
    release: kube-prom
spec:
  namespaceSelector:
    matchNames:
      - espocrm
  selector:
    matchLabels:
      app: espocrm-exporter
      component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
      relabelings:
        - targetLabel: job
          replacement: espocrm
