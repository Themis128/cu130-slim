apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: socialauto
  namespace: monitoring
  labels:
    app: socialauto
    cluster-protection.io/health: "true"
    release: kube-prom
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: socialauto
      component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - targetLabel: job
          replacement: socialauto
