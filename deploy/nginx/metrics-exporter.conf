# Metrics-only LAN endpoint — exposes social-api /metrics on :9100 so the
# omv Prometheus can scrape it without opening the full API on the LAN.
server {
    listen 80 default_server;
    server_name _;

    location = /metrics {
        proxy_pass http://social-api:8000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
