# Metrics-only LAN endpoint — exposes social-api /metrics on :9100 so the
# omv Prometheus can scrape it without opening the full API on the LAN.
server {
    listen 80 default_server;
    server_name _;

    # Resolve the upstream at request time, not startup — without this nginx
    # caches social-api's IP and 502s forever after the API is recreated.
    resolver 127.0.0.11 valid=10s;

    location = /metrics {
        set $upstream http://social-api:8000/metrics;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
