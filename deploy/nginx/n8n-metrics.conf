# Metrics-only LAN endpoint — exposes n8n /metrics on :9392 so the omv
# Prometheus can scrape it without opening the full n8n API/UI on the LAN.
# Mirror of deploy/nginx/metrics-exporter.conf (social-api on :9390).
server {
    listen 80 default_server;
    server_name _;

    location = /metrics {
        proxy_pass http://n8n:5678/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
