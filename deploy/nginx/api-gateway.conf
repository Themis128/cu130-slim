# Stable API gateway for blue/green deploys.
# The frontend (Next.js rewrite of /api/v1/*) points here; this proxies to
# whichever API slot is recorded in /etc/nginx/upstream/active.conf.
# Deploy scripts rewrite that file then run `nginx -s reload` — the only
# traffic switch is a reload, which is hitless for new connections.

upstream social_api_backend {
    include /etc/nginx/upstream/active.conf;
}

server {
    listen 8080;
    server_name _;

    # Media uploads flow through the API — allow large bodies.
    client_max_body_size 512m;

    location /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        proxy_pass http://social_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Paddle must get a response quickly; app must not hang forever.
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSE / streaming endpoints.
        proxy_buffering off;

        # A dead slot must not wedge the gateway — try the other upstream.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
