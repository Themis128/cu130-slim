# Standalone SocialAuto stack — deploys local images on Docker host.
# Copy `.env.example` (repo root) to `.env` next to this file and fill in real secrets before `compose up`.
#
# The `env_file: .env` entries feed app config; the inline `environment:`
# keys below pin the internal service URLs so an env file exported for
# localhost can never break service-to-service wiring.

services:
  # Core SocialAuto API Stack
  social-api:
    image: ghcr.io/themis128/cu130-slim:social-backend-api-latest
    pull_policy: never
    container_name: social-api
    ports:
      - "127.0.0.1:8083:8000"
    volumes:
      - ../../notebooks:/notebooks
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER:-social_user}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB:-social_automation}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MESSENGER_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONPATH=/app
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - LOKI_URL=${LOKI_URL:-http://192.168.1.200:30100}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://192.168.1.200:30100}
    extra_hosts:
      - host.docker.internal:host-gateway
      # mail.cloudless.gr has a valid LE cert but no public :587 —
      # map the LAN postfix IP so STARTTLS hostname verification
      # passes with SMTP_SSL_VERIFY=true.
      - mail.cloudless.gr:${MAIL_HOST_LAN_IP:-192.168.1.130}
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - cu130-backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      # matched to the root compose + image CMD (2026-11-26 crash-loop):
      # cold start = alembic + seed + worker imports takes minutes under
      # memory pressure — the frontend waits on this health, so a short
      # grace stalls the whole standalone stack
      start_period: 300s

  social-frontend:
    image: ghcr.io/themis128/cu130-slim:social-frontend-latest
    pull_policy: never
    container_name: social-frontend
    ports:
      - "127.0.0.1:8082:8083"
    environment:
      - PORT=8083
      - HOSTNAME=0.0.0.0
      - TZ=Europe/Athens
    depends_on:
      social-api:
        condition: service_healthy
    restart: unless-stopped

  social-worker-publishing:
    image: ghcr.io/themis128/cu130-slim:social-backend-latest
    pull_policy: never
    container_name: social-worker-publishing
    command: celery -A app.worker.celery_app worker -Q publishing --loglevel=info --concurrency=3 --max-tasks-per-child=200 --hostname=publishing@%h
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER:-social_user}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB:-social_automation}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MESSENGER_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis/0
      - PYTHONPATH=/app
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - LOKI_URL=${LOKI_URL:-http://192.168.1.200:30100}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://192.168.1.200:30100}
    extra_hosts:
      - host.docker.internal:host-gateway
      # mail.cloudless.gr has a valid LE cert but no public :587 —
      # map the LAN postfix IP so STARTTLS hostname verification
      # passes with SMTP_SSL_VERIFY=true.
      - mail.cloudless.gr:${MAIL_HOST_LAN_IP:-192.168.1.130}
    depends_on:
      - social-postgres
      - redis
    restart: unless-stopped
    networks:
      - default
      - cu130-backend

  social-worker-media:
    image: ghcr.io/themis128/cu130-slim:social-backend-latest
    pull_policy: never
    container_name: social-worker-media
    command: celery -A app.worker.celery_app worker -Q media --loglevel=info --concurrency=1 --max-tasks-per-child=50 --hostname=media@%h
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER:-social_user}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB:-social_automation}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MESSENGER_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis/0
      - PYTHONPATH=/app
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - LOKI_URL=${LOKI_URL:-http://192.168.1.200:30100}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://192.168.1.200:30100}
    extra_hosts:
      - host.docker.internal:host-gateway
      # mail.cloudless.gr has a valid LE cert but no public :587 —
      # map the LAN postfix IP so STARTTLS hostname verification
      # passes with SMTP_SSL_VERIFY=true.
      - mail.cloudless.gr:${MAIL_HOST_LAN_IP:-192.168.1.130}
    depends_on:
      - social-postgres
      - redis
    restart: unless-stopped
    networks:
      - default
      - cu130-backend

  social-worker-default:
    image: ghcr.io/themis128/cu130-slim:social-backend-latest
    pull_policy: never
    container_name: social-worker-default
    command: celery -A app.worker.celery_app worker -Q default,celery --loglevel=info --concurrency=2 --max-tasks-per-child=200 --hostname=default@%h
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER:-social_user}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB:-social_automation}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MESSENGER_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis/0
      - PYTHONPATH=/app
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - LOKI_URL=${LOKI_URL:-http://192.168.1.200:30100}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://192.168.1.200:30100}
    volumes:
      - ../../notebooks:/notebooks
    extra_hosts:
      - host.docker.internal:host-gateway
      # mail.cloudless.gr has a valid LE cert but no public :587 —
      # map the LAN postfix IP so STARTTLS hostname verification
      # passes with SMTP_SSL_VERIFY=true.
      - mail.cloudless.gr:${MAIL_HOST_LAN_IP:-192.168.1.130}
    depends_on:
      - social-postgres
      - redis
    restart: unless-stopped
    networks:
      - default
      - cu130-backend

  social-worker-messenger:
    image: ghcr.io/themis128/cu130-slim:social-backend-latest
    pull_policy: never
    container_name: social-worker-messenger
    command: celery -A app.worker.celery_app worker -Q messenger --loglevel=info --concurrency=2 --max-tasks-per-child=50 --hostname=messenger@%h
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER:-social_user}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB:-social_automation}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MESSENGER_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis/0
      - PYTHONPATH=/app
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - LOKI_URL=${LOKI_URL:-http://192.168.1.200:30100}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://192.168.1.200:30100}
    extra_hosts:
      - host.docker.internal:host-gateway
      # mail.cloudless.gr has a valid LE cert but no public :587 —
      # map the LAN postfix IP so STARTTLS hostname verification
      # passes with SMTP_SSL_VERIFY=true.
      - mail.cloudless.gr:${MAIL_HOST_LAN_IP:-192.168.1.130}
    depends_on:
      - social-postgres
      - redis
    restart: unless-stopped
    networks:
      - default
      - cu130-backend

  social-worker-meta:
    # Dedicated `meta` queue lane (facebook/instagram/threads publish sweep +
    # Meta-only tasks). Without this service Meta publishes queue forever.
    image: ghcr.io/themis128/cu130-slim:social-backend-latest
    pull_policy: never
    container_name: social-worker-meta
    command: celery -A app.worker.celery_app worker -Q meta --loglevel=info --concurrency=2 --max-tasks-per-child=200 --hostname=meta@%h
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER:-social_user}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB:-social_automation}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MESSENGER_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis/0
      - PYTHONPATH=/app
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - LOKI_URL=${LOKI_URL:-http://192.168.1.200:30100}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://192.168.1.200:30100}
    extra_hosts:
      - host.docker.internal:host-gateway
      # mail.cloudless.gr has a valid LE cert but no public :587 —
      # map the LAN postfix IP so STARTTLS hostname verification
      # passes with SMTP_SSL_VERIFY=true.
      - mail.cloudless.gr:${MAIL_HOST_LAN_IP:-192.168.1.130}
    depends_on:
      - social-postgres
      - redis
    restart: unless-stopped
    networks:
      - default
      - cu130-backend

  celery-beat:
    image: ghcr.io/themis128/cu130-slim:social-backend-latest
    pull_policy: never
    container_name: celery-beat
    command: celery -A app.worker.celery_app beat --loglevel=info --scheduler=celery.beat:PersistentScheduler
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SOCIAL_POSTGRES_USER:-social_user}:${SOCIAL_POSTGRES_PASSWORD}@social-postgres:5432/${SOCIAL_POSTGRES_DB:-social_automation}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MESSENGER_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis/0
      - PYTHONPATH=/app
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_SECURE=false
      - LOKI_URL=${LOKI_URL:-http://192.168.1.200:30100}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://192.168.1.200:30100}
    extra_hosts:
      - host.docker.internal:host-gateway
      # mail.cloudless.gr has a valid LE cert but no public :587 —
      # map the LAN postfix IP so STARTTLS hostname verification
      # passes with SMTP_SSL_VERIFY=true.
      - mail.cloudless.gr:${MAIL_HOST_LAN_IP:-192.168.1.130}
    depends_on:
      - social-postgres
      - redis
    restart: unless-stopped
    networks:
      - default
      - cu130-backend

  # Browser Sidecars (local build images — not published to GHCR).
  # On the primary host these run under the ROOT compose project
  # (docker-compose.yml, project `cu130-slim`) — same container_name here
  # would collide on every full `compose up -d` (deploy-watch included)
  # and abort the whole converge. Gated behind the `browser-sidecars`
  # profile: enable with `--profile browser-sidecars` only on hosts where
  # the root project does NOT already run them.
  linkedin-browser-sidecar:
    profiles: ["browser-sidecars"]
    image: cu130-slim-linkedin-browser-sidecar:latest
    pull_policy: never
    container_name: linkedin-browser-sidecar
    init: true
    ports:
      - "127.0.0.1:9225:9225"
    environment:
      - LINKEDIN_SIDECAR_PORT=9225
      - TZ=Europe/Athens
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL:-}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD:-}
      - LINKEDIN_PROXY=${LINKEDIN_PROXY:-}
      - LINKEDIN_RATE_LIMIT_COOLDOWN_MS=${LINKEDIN_RATE_LIMIT_COOLDOWN_MS:-21600000}
      - LINKEDIN_DEBUG_CONSOLE=${LINKEDIN_DEBUG_CONSOLE:-0}
    volumes:
      - linkedin-browser-data:/data
    restart: unless-stopped

  facebook-browser-sidecar:
    profiles: ["browser-sidecars"]
    image: cu130-slim-facebook-browser-sidecar:latest
    pull_policy: never
    container_name: facebook-browser-sidecar
    ports:
      - "127.0.0.1:9226:9226"
    volumes:
      - facebook-browser-data:/data
    restart: unless-stopped

  messenger-sidecar:
    image: cu130-slim-messenger-sidecar:latest
    pull_policy: never
    container_name: messenger-sidecar
    ports:
      - "127.0.0.1:9230:9230"
    volumes:
      - messenger-browser-data:/data
    restart: unless-stopped


  # Persistent logged-in TikTok browser session — the tiktok_reauth beat and
  # DIRECT_POST session checks probe :9224. Same pattern as the other
  # browser sidecars; image is built locally (build ctx ../..//tiktok-browser-sidecar).
  tiktok-browser-sidecar:
    image: cu130-slim-tiktok-browser-sidecar:latest
    pull_policy: never
    container_name: tiktok-browser-sidecar
    init: true
    ports:
      - "127.0.0.1:9224:9224"
    environment:
      - TIKTOK_SIDECAR_PORT=9224
      - TZ=Europe/Athens
    volumes:
      - tiktok-browser-data:/data
    restart: unless-stopped

  # Infrastructure
  social-postgres:
    image: postgres:17-alpine
    container_name: social-postgres
    environment:
      - POSTGRES_USER=${SOCIAL_POSTGRES_USER:-social_user}
      - POSTGRES_PASSWORD=${SOCIAL_POSTGRES_PASSWORD:?set SOCIAL_POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${SOCIAL_POSTGRES_DB:-social_automation}
    volumes:
      - social-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI / GPU Services
  social-media-comfyui-gpu:
    image: ghcr.io/themis128/cu130-slim:comfyui-latest
    pull_policy: never
    container_name: social-media-comfyui-gpu
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Mirrors the root docker-compose.yml comfyui service — without these
      # the container boots with EMPTY custom_nodes/models dirs and every
      # Wan2.2/FLUX render 400s on unknown class_type (seen 2026-11-23).
      - ../../.env:/app/.env:ro
      - ../../comfyui/profiles:/opt/ComfyUI/profiles:ro
      - ../../storage-user/custom_nodes:/home/user/ComfyUI/custom_nodes
      - ../../storage-models/models:/home/user/ComfyUI/models
      - ../../storage-user/metadata:/home/user/ComfyUI/metadata
      - ../../storage-user/user:/home/user/ComfyUI/user
      - ../../storage-user/output:/home/user/ComfyUI/output
      - ../../storage-user/input:/home/user/ComfyUI/input
    environment:
      - COMFYUI_PROFILE=flux
      - CLI_ARGS=
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:128
    networks:
      default:
        aliases:
          # workers resolve COMFYUI_URL=http://comfyui:8000 from .env —
          # without this alias every generate_video call dies on DNS
          - comfyui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Supporting Services
  # n8n — kept in parity with the root docker-compose.yml service on purpose:
  # the live container is managed from the root file (2.47.0, external task
  # runners, Postgres backend, encrypted credentials). This block exists so a
  # `compose up` from THIS file cannot downgrade the image, drop
  # N8N_ENCRYPTION_KEY (would orphan every stored credential), or lose the
  # $env/task-runner settings that took an outage to diagnose (2026-11-23).
  n8n:
    image: n8nio/n8n:2.47.0
    container_name: n8n
    user: "0:0"
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=tbaltzakis@cloudless.gr
      - N8N_INSTANCE_OWNER_FIRST_NAME=Admin
      - N8N_INSTANCE_OWNER_LAST_NAME=User
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=$$2b$$12$$7lR7hWc2tlFx0TKc6IziC.jpCO.AorTJVF2ZkfwiMPEnvuJ/SvfXe
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
      # n8n 2.x defaults this to blocked — every workflow using $env in Code
      # nodes/expressions died with "access to env vars denied".
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_ENABLED_MODULES=instance-ai
      - N8N_DISABLED_MODULES=mcp
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_INSTANCE_AI_SANDBOX_URL=http://stack-ops:8081
      - N8N_INSTANCE_AI_MODEL=${N8N_INSTANCE_AI_MODEL:-hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}
      - N8N_INSTANCE_AI_MODEL_URL=${N8N_INSTANCE_AI_MODEL_URL:-http://ollama:11434/v1}
      - N8N_INSTANCE_AI_MODEL_API_KEY=${N8N_INSTANCE_AI_MODEL_API_KEY:-dmr-local}
      - OPENAI_BASE_URL=${N8N_INSTANCE_AI_MODEL_URL:-http://ollama:11434/v1}
      - N8N_SANDBOX_SERVICE_URL=http://stack-ops:8081
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-}
      - TWITTER_API_URL=https://api.twitter.com/2/tweets
      - N8N_SANDBOX_ENABLED=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=false
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_WORKFLOW_FILE_SYSTEM=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - NEXTCLOUD_USERNAME=${NEXTCLOUD_USERNAME}
      - NEXTCLOUD_APP_PASSWORD=${NEXTCLOUD_APP_PASSWORD}
      - GENERIC_TIMEZONE=Europe/Athens
      - TZ=Europe/Athens
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=social-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${SOCIAL_POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${SOCIAL_POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public
      - EXECUTIONS_MODE=regular
      - N8N_SCHEDULER_ENABLED=true
      - EXECUTIONS_TIMEOUT=3600
      - EXECUTIONS_TIMEOUT_MAX=86400
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=10
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=2000
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_SCHEDULER_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_INCLUDE_API_ENDPOINTS=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000
      - SOCIAL_API_URL=http://social-api:8000
      - SOCIAL_ADMIN_EMAIL=${SOCIAL_ADMIN_EMAIL}
      - SOCIAL_ADMIN_PASSWORD=${SOCIAL_ADMIN_PASSWORD}
      - SOCIAL_TOTP_SECRET=${SOCIAL_TOTP_SECRET:-}
      - NEWSLETTER_SERVICE_TOKEN=${NEWSLETTER_SERVICE_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_NEWSLETTER_CHANNEL_ID=${SLACK_NEWSLETTER_CHANNEL_ID:-C0C1B8PMTUN}
      - SLACK_ALERTS_CHANNEL_ID=${SLACK_ALERTS_CHANNEL_ID:-C0C1D46212N}
      - CLOUDLESS_LINKEDIN_ORG_ACCOUNT_ID=${CLOUDLESS_LINKEDIN_ORG_ACCOUNT_ID:-9c4451bb-e820-489f-8676-76ddbc788ffe}
      - CLOUDLESS_FACEBOOK_ACCOUNT_ID=${CLOUDLESS_FACEBOOK_ACCOUNT_ID:-e280d96f-2807-4150-babe-f388d02bcfba}
      - CLOUDLESS_INSTAGRAM_ACCOUNT_ID=${CLOUDLESS_INSTAGRAM_ACCOUNT_ID:-38ddbd44-8811-4d0b-be62-a23fd2f50490}
      - CLOUDLESS_TWITTER_ACCOUNT_ID=${CLOUDLESS_TWITTER_ACCOUNT_ID:-a89d6852-eff8-479a-835f-50d806cf59dd}
      - CLOUDLESS_THREADS_ACCOUNT_ID=${CLOUDLESS_THREADS_ACCOUNT_ID:-1071dcd5-1bc9-4770-923c-d897eb124485}
      - CLOUDLESS_TIKTOK_ACCOUNT_ID=${CLOUDLESS_TIKTOK_ACCOUNT_ID:-dcda73fb-75b6-47af-b9d1-c1ba404d91a8}
      - CLOUDLESS_CAROUSEL_TOPIC=${CLOUDLESS_CAROUSEL_TOPIC:-}
      - CLOUDLESS_CAROUSEL_SLIDES=${CLOUDLESS_CAROUSEL_SLIDES:-7}
      - SOCIALAUTO_DIGEST_DAYS=${SOCIALAUTO_DIGEST_DAYS:-1}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_ALERTS_WEBHOOK_URL=${SLACK_ALERTS_WEBHOOK_URL:-}
      - N8N_ERROR_SLACK_WEBHOOK_URL=${N8N_ERROR_SLACK_WEBHOOK_URL:-}
    extra_hosts:
      - host.docker.internal:host-gateway
      - mail.cloudless.gr:${MAIL_HOST_LAN_IP:-192.168.1.130}
    volumes:
      # Same on-disk state as the root-compose n8n — do NOT switch back to a
      # named volume or credentials/config diverge.
      - ../../n8n-data:/home/node/.n8n
      - ../../storage-user/metadata:/home/node/.n8n/storage/metadata
      - ../../comfyui-workflows:/workflows:ro
    depends_on:
      - social-postgres
    mem_limit: 768m
    memswap_limit: 2560m
    cpus: '3'
    restart: unless-stopped
    networks:
      - default
      - cu130-backend

  # External JS/Python task runners for n8n Code nodes — mirrors the root
  # compose service; image version MUST match n8nio/n8n.
  n8n-task-runner:
    image: n8nio/runners:2.47.0
    pull_policy: if_not_present
    container_name: n8n-task-runner
    init: true
    networks:
      - default
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=60
      - GENERIC_TIMEZONE=Europe/Athens
      - TZ=Europe/Athens
      - TINI_SUBREAPER=true
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5680/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 1024m
    cpus: '2'
    restart: unless-stopped

  instagram-private-api:
    # Built locally: upstream :latest ships aiograpi 1.0.9 whose password
    # login crashes on the retired qe/sync/ endpoint (int(None)). The
    # Dockerfile upgrades aiograpi to >=2.1.19 (launcher/sync fix).
    image: subzeroid/aiograpi-rest:latest
    build:
      context: ../../instagram-private-api
      dockerfile: Dockerfile
    container_name: instagram-private-api
    ports:
      - "127.0.0.1:8011:8000"
    environment:
      - AIOGRAPI_REST_DB_PATH=/data/db.json
    volumes:
      - instagram_sessions:/data
    restart: unless-stopped

  # Gateways
  # social-api-gateway removed: the dev-stack `cu130-slim` project's api-gateway
  # owns container_name `social-api-gateway` (blue/green frontend upstream).
  # This duplicate made every `compose up -d` abort on a name conflict, leaving
  # recreated services stuck in "Created". Ingress is cloudflared -> social-api:8000.

  social-metrics:
    image: nginx:1.27-alpine
    container_name: social-metrics
    ports:
      - "0.0.0.0:9390:80"
    volumes:
      - ./nginx/metrics.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
      - cu130-backend
    restart: unless-stopped

  # Cloudflare Tunnel connector for social.cloudless.gr — without it the
  # named tunnel has no live edge connections and the hostname 530s.
  # http2 (TCP) not QUIC: WSL2 NAT drops idle UDP flow state.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: social-cloudflared
    command: tunnel --no-autoupdate run --protocol http2 --token ${SOCIAL_TUNNEL_TOKEN}
    depends_on:
      - social-api
    restart: unless-stopped

networks:
  cu130-backend:
    external: true

volumes:
  social-postgres-data:
    external: true
    name: cu130-slim_social_postgres_data_v17
  redis-data:
  n8n-data:
  linkedin-browser-data:
  facebook-browser-data:
  messenger-browser-data:
  tiktok-browser-data:
  instagram_sessions:
    external: true
    name: cu130-slim_instagram_sessions
