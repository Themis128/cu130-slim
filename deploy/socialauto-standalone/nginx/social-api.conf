# Standalone API gateway — proxies :80 to the social-api container.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream social_api {
        server social-api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Media uploads flow through the API — allow large bodies.
        client_max_body_size 512m;

        location /healthz {
            access_log off;
            return 200 "ok";
        }

        location / {
            proxy_pass http://social_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-running AI endpoints (generate-content can take minutes).
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
