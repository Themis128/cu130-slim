# Metrics-only LAN endpoint — exposes social-api /metrics on :9390 so a
# remote Prometheus can scrape it without opening the full API on the LAN.
worker_processes 1;

events {
    worker_connections 256;
}

http {
    # Docker embedded DNS — re-resolve social-api so /metrics survives
    # container IP changes on recreate (static upstream cached the old IP
    # and 502'd until manual restart, seen 2026-11-22).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;
        set $social_api_upstream http://social-api:8000;

        location = /metrics {
            proxy_pass $social_api_upstream/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            return 404;
        }
    }
}
