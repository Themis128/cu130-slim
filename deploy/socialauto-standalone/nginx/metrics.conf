# Metrics-only LAN endpoint — exposes social-api /metrics on :9390 so a
# remote Prometheus can scrape it without opening the full API on the LAN.
worker_processes 1;

events {
    worker_connections 256;
}

http {
    server {
        listen 80 default_server;
        server_name _;

        location = /metrics {
            proxy_pass http://social-api:8000/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            return 404;
        }
    }
}
