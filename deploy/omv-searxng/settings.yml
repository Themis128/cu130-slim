# SearXNG config for the LAN-only metasearch instance on omv.
# The JSON API (format=json) is what social-api calls.
# secret_key is generated at deploy time — never committed.
use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "CHANGE_ME_AT_DEPLOY"
  limiter: false          # internal LAN service — no bot detection needed
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

ui:
  default_theme: simple
  query_in_title: false

# Engine mix tuned for a datacenter IP: Google is always captcha/consent-
# walled from VPS ranges, Brave rate-limits quickly — keep several engines
# so a single suspended engine never yields zero results.
engines:
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: qwant
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
