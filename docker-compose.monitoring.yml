# Prometheus + Grafana Observability Stack
# Phase 4: Scalability Architecture - Observability
# Include with: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.monitoring.yml up -d

# Public DNS for outbound HTTPS (Cloudflare Workers AI, etc.).
# Host /etc/resolv.conf currently points only at Tailscale MagicDNS
# (100.100.100.100), which fails public lookups in this WSL environment.
# Docker still uses 127.0.0.11 for *service-name* resolution on the compose network.
x-public-dns: &public-dns
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  # ── Prometheus ─────────────────────────────────────────────────────────────
  # Time-series database for metrics collection. Scrapes all configured targets
  # every 15s by default. Retention 15d (adjust via --storage.tsdb.retention.time).
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    networks:
      - cu130-backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle
      - --web.enable-admin-api
      - --web.route-prefix=/
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 1024m
    cpus: '2'
    memswap_limit: 2048m
    restart: unless-stopped
    <<: *public-dns

  # ── Grafana ────────────────────────────────────────────────────────────────
  # Visualization and alerting UI. Pre-provisioned with Prometheus datasource
  # and dashboards for Docker, Node, cAdvisor, and custom app metrics.
  grafana:
    image: grafana/grafana:11.1.4
    container_name: grafana
    networks:
      - cu130-backend
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - 127.0.0.1:3001:3000
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: '1'
    memswap_limit: 1024m
    restart: unless-stopped
    <<: *public-dns

  # ── Node Exporter ──────────────────────────────────────────────────────────
  # Host-level metrics (CPU, memory, disk, network) from the WSL/Linux host.
  # Runs in host pid/net namespace to see real host metrics.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    pid: host
    networks:
      - cu130-backend
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.systemd
      - --collector.processes
      - --web.listen-address=0.0.0.0:9100
    ports:
      - 9100:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: '1'
    memswap_limit: 256m
    restart: unless-stopped
    <<: *public-dns

  # ── cAdvisor ───────────────────────────────────────────────────────────────
  # Container-level metrics (CPU, memory, network, filesystem) for all containers.
  # Needs docker socket and rootfs access.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    networks:
      - cu130-backend
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - 127.0.0.1:8088:8080
    command:
      - --docker_only=false
      - --housekeeping_interval=10s
      - --max_housekeeping_interval=60s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: '1'
    memswap_limit: 512m
    restart: unless-stopped
    <<: *public-dns

  
  # ── Alertmanager (optional, for alert routing) ──────────────────────────────
  # Handles alerts from Prometheus, deduplication, grouping, and routing to
  # receivers (email, Slack, PagerDuty, webhook, etc.).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    networks:
      - cu130-backend
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.route-prefix=/
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - 127.0.0.1:9093:9093
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: '1'
    memswap_limit: 256m
    restart: unless-stopped
    <<: *public-dns

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  cu130-backend:
    external: true