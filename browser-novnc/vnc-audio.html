<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Browser Viewer with Audio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #vnc-container { width: 100%; height: 100%; }
        #vnc-iframe { width: 100%; height: 100%; border: none; }
        #audio-status {
            position: fixed; top: 10px; right: 10px;
            padding: 6px 12px; border-radius: 6px;
            font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.7); color: #fff;
            z-index: 9999; pointer-events: none;
        }
        #audio-toggle {
            position: fixed; top: 10px; left: 10px;
            padding: 6px 12px; border-radius: 6px;
            font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.7); color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer; z-index: 9999;
        }
        #audio-toggle:hover { background: rgba(50,50,50,0.8); }
    </style>
</head>
<body>
    <div id="vnc-container">
        <iframe id="vnc-iframe" src="/vnc.html"></iframe>
    </div>
    <div id="audio-status">Audio: connecting...</div>
    <button id="audio-toggle" onclick="toggleAudio()">Mute</button>

    <script>
        // Audio streaming via WebSocket + MediaSource API
        let audioWebSocket = null;
        let mediaSource = null;
        let sourceBuffer = null;
        let audioEnabled = true;
        let audioQueue = [];

        function getAudioWsUrl() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.hostname;
            const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
            // Audio WebSocket is on port 6081
            return `${proto}//${host}:6081`;
        }

        function initAudio() {
            const status = document.getElementById('audio-status');
            const wsUrl = getAudioWsUrl();

            try {
                audioWebSocket = new WebSocket(wsUrl);
                audioWebSocket.binaryType = 'arraybuffer';

                audioWebSocket.onopen = function() {
                    status.textContent = 'Audio: connected';
                    status.style.color = '#0f0';
                    initMediaSource();
                };

                audioWebSocket.onclose = function() {
                    status.textContent = 'Audio: disconnected';
                    status.style.color = '#f00';
                    // Reconnect after 3s
                    setTimeout(initAudio, 3000);
                };

                audioWebSocket.onerror = function() {
                    status.textContent = 'Audio: error';
                    status.style.color = '#f80';
                };

                audioWebSocket.onmessage = function(event) {
                    if (audioEnabled && sourceBuffer && !sourceBuffer.updating) {
                        try {
                            sourceBuffer.appendBuffer(event.data);
                        } catch(e) {
                            // Queue for later
                            audioQueue.push(event.data);
                        }
                    } else if (audioEnabled) {
                        audioQueue.push(event.data);
                        // Keep queue bounded
                        if (audioQueue.length > 100) audioQueue.shift();
                    }
                };
            } catch(e) {
                status.textContent = 'Audio: ' + e.message;
                status.style.color = '#f00';
            }
        }

        function initMediaSource() {
            try {
                mediaSource = new MediaSource();
                const audio = new Audio();
                audio.src = URL.createObjectURL(mediaSource);
                audio.autoplay = true;

                mediaSource.addEventListener('sourceopen', function() {
                    try {
                        // WebM with Opus codec
                        sourceBuffer = mediaSource.addSourceBuffer('audio/webm; codecs="opus"');
                        sourceBuffer.mode = 'sequence';

                        sourceBuffer.addEventListener('updateend', function() {
                            // Process queued chunks
                            if (audioQueue.length > 0 && !sourceBuffer.updating) {
                                const chunk = audioQueue.shift();
                                try {
                                    sourceBuffer.appendBuffer(chunk);
                                } catch(e) {
                                    // Drop on error
                                }
                            }
                        });

                        // Try to play
                        audio.play().catch(function(e) {
                            console.log('Autoplay blocked, will play on user interaction');
                            document.addEventListener('click', function() {
                                audio.play();
                            }, { once: true });
                        });
                    } catch(e) {
                        console.error('MediaSource error:', e);
                    }
                });
            } catch(e) {
                console.error('MediaSource init error:', e);
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audio-toggle');
            const status = document.getElementById('audio-status');
            if (audioEnabled) {
                btn.textContent = 'Mute';
                status.textContent = 'Audio: connected';
            } else {
                btn.textContent = 'Unmute';
                status.textContent = 'Audio: muted';
                audioQueue = [];
            }
        }

        // Start audio when page loads
        window.addEventListener('load', initAudio);
    </script>
</body>
</html>
