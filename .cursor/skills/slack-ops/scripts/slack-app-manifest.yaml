# Slack app manifest for the SocialAuto workspace app.
# Use: https://api.slack.com/apps → Create New App → From a manifest → paste this.
# Scopes cover every Slack Web API call made by the backend
# (chat.postMessage, files.getUploadURLExternal/completeUploadExternal,
#  conversations.list, users.*, auth.test) plus incoming webhooks.
display_information:
  name: SocialAuto
  description: Cloudless SocialAuto alerts, digests and publishing notifications
  background_color: "#0a7785"
features:
  bot_user:
    display_name: SocialAuto
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - channels:read
      - groups:read
      - files:write
      - users:read
      - incoming-webhook
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
